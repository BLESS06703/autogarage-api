<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — AutoGarage Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0D0D0D; color: #E0E0E0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; text-align: center; padding: 20px;
        }
        .card {
            background: #1A1A1A; border: 1px solid #2A2A2A;
            border-radius: 16px; padding: 48px 32px; max-width: 440px;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 22px; color: #FF6F00; margin-bottom: 8px; }
        p { font-size: 14px; color: #888; margin-bottom: 20px; line-height: 1.6; }
        .status { display: flex; align-items: center; gap: 8px; background: #0A0A0A; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #EF4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        button {
            background: #FF6F00; color: #fff; border: none; padding: 12px 28px;
            border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #E65100; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>No Connection</h1>
        <p>Unable to reach the server. Please check your internet connection.</p>
        <div class="status">
            <span class="dot"></span> Server unreachable
        </div>
        <button onclick="location.reload()">Retry Connection</button>
    </div>
    <script>
        setInterval(() => { fetch('/api/auth/login-page/').then(r => { if(r.ok) location.reload(); }).catch(() => {}); }, 10000);
    </script>
</body>
</html>
