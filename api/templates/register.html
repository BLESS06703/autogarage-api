<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — AutoGarage Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#1a1a2e;--surface:#16213e;--border:#1f3460;--text:#e0e0e0;--text2:#8892b0;--accent:#0a84ff;--green:#22c55e;--red:#ef4444;--amber:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px 24px;width:100%;max-width:400px}
h1{text-align:center;font-size:18px;font-weight:700;margin-bottom:4px}
.sub{text-align:center;color:var(--text2);font-size:10px;letter-spacing:1px;margin-bottom:20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.field input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.field input:focus{border-color:var(--accent)}
.field .pw-wrap{position:relative}
.field .pw-wrap input{padding-right:36px}
.field .pw-wrap i{position:absolute;right:10px;top:11px;color:var(--text2);cursor:pointer;font-size:12px}
.row{display:flex;gap:10px}
.row .field{flex:1}
.btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px}
.btn:disabled{opacity:0.5}
.msg{font-size:12px;padding:10px;border-radius:6px;margin-bottom:10px;display:none;text-align:center}
.msg.error{display:block;background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.msg.success{display:block;background:rgba(34,197,94,0.1);color:var(--green);border:1px solid rgba(34,197,94,0.2)}
.links{text-align:center;margin-top:14px;font-size:12px;color:var(--text2)}
.links a{color:var(--accent);text-decoration:none;font-weight:500}
.strength{margin-top:-6px;margin-bottom:8px}
.strength-bar{height:3px;background:var(--border);border-radius:2px}
.strength-bar span{display:block;height:100%;border-radius:2px;transition:0.3s}
.strength-text{font-size:10px;margin-top:3px}
@media(max-width:400px){.row{flex-direction:column;gap:0}}
</style>
</head>
<body>
<div class="card">
<h1>AutoGarage Pro</h1>
<div class="sub">CREATE ACCOUNT</div>
<div id="msg" class="msg"></div>
<div class="field"><label>Garage Name</label><input type="text" id="garageName" placeholder="e.g. Bless Garage Ltd"></div>
<div class="row">
<div class="field"><label>Username</label><input type="text" id="username" placeholder="Choose username"></div>
<div class="field"><label>Phone</label><input type="tel" id="phone" placeholder="+265..."></div>
</div>
<div class="field">
<label>Password</label>
<div class="pw-wrap">
<input type="password" id="password" placeholder="Min 6 characters" oninput="updateStrength()">
<i class="fas fa-eye" onclick="togglePw('password',this)"></i>
</div>
</div>
<div class="strength"><div class="strength-bar"><span id="strengthFill"></span></div><div class="strength-text" id="strengthText"></div></div>
<div class="field">
<label>Confirm Password</label>
<div class="pw-wrap">
<input type="password" id="confirmPassword" placeholder="Re-enter password">
<i class="fas fa-eye" onclick="togglePw('confirmPassword',this)"></i>
</div>
</div>
<button class="btn" id="btn" onclick="register()">Create Account</button>
<div id="dashLink" style="text-align:center;margin-top:12px;display:none"></div>
<div class="links"><a href="/api/auth/login-page/">Already registered? Sign in</a></div>
</div>
<script>
function togglePw(id,icon){var i=document.getElementById(id);i.type=i.type==='password'?'text':'password';icon.className=i.type==='password'?'fas fa-eye':'fas fa-eye-slash'}
function updateStrength(){var p=document.getElementById('password').value;var s=0;if(p.length>=6)s++;if(p.length>=10)s++;if(/[A-Z]/.test(p))s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;var c=['#EF4444','#F59E0B','#F59E0B','#22C55E','#22C55E'],l=['Very Weak','Weak','Fair','Strong','Very Strong'];var f=document.getElementById('strengthFill');f.style.width=(s*25)+'%';f.style.background=c[s];var t=document.getElementById('strengthText');t.textContent=l[s];t.style.color=c[s]}
function show(msg,type){var el=document.getElementById('msg');el.textContent=msg;el.className='msg '+type}
async function register(){
var g=document.getElementById('garageName').value.trim();
var u=document.getElementById('username').value.trim();
var ph=document.getElementById('phone').value.trim();
var p=document.getElementById('password').value;
var c=document.getElementById('confirmPassword').value;
var btn=document.getElementById('btn');
if(!g)return show('Enter garage name','error');
if(!u||u.length<3)return show('Username (3+ chars)','error');
if(!p||p.length<6)return show('Password (6+ chars)','error');
if(p!==c)return show('Passwords do not match','error');
btn.disabled=true;btn.textContent='Creating...';show('','');
try{
var res=await fetch('/api/auth/register/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,garage_name:g,phone:ph,role:'owner'})});
var data=await res.json();
if(data.access){
localStorage.setItem('token',data.access);
localStorage.setItem('user',JSON.stringify(data));
localStorage.setItem('savedUsername',u);
show('Account created!','success');
btn.textContent='Done!';
document.getElementById('dashLink').innerHTML='<a href="/api/dashboard-page/" style="display:inline-block;background:var(--accent);color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:600;margin-top:8px">Open Dashboard</a>';
document.getElementById('dashLink').style.display='block';
}else{show(data.error||'Failed','error');btn.disabled=false;btn.textContent='Create Account';}
}catch(e){show('Cannot connect','error');btn.disabled=false;btn.textContent='Create Account';}
}
</script>
</body>
</html>
