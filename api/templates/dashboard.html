<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGarage Pro - Dashboard</title>
    <style>
        :root {
            --bg: #0D0D0D; --surface: #1A1A1A; --surface2: #242424;
            --border: #2A2A2A; --text: #E0E0E0; --text2: #888;
            --orange: #FF6F00; --green: #22C55E; --red: #EF4444;
            --blue: #3B82F6; --amber: #F59E0B; --purple: #8B5CF6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 240px; background: var(--surface); border-right: 1px solid var(--border);
            padding: 20px; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; overflow-y: auto;
        }
        .sidebar-brand { font-size: 17px; font-weight: 700; color: var(--orange); margin-bottom: 20px; }
        .nav-item {
            display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 7px;
            color: var(--text2); cursor: pointer; font-size: 13px; border: none; background: none;
            width: 100%; text-align: left; margin-bottom: 1px; transition: 0.15s;
        }
        .nav-item:hover { background: var(--surface2); color: var(--text); }
        .nav-item.active { background: var(--orange); color: #fff; font-weight: 600; }
        .nav-section { font-size: 10px; color: var(--text2); letter-spacing: 1.5px; margin: 18px 0 8px 12px; text-transform: uppercase; font-weight: 600; }
        
        .main { margin-left: 240px; flex: 1; padding: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
        .header-title { font-size: 21px; font-weight: 700; }
        .status-badge { background: rgba(34,197,94,0.15); color: var(--green); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 6px; }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
        .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; cursor: pointer; transition: 0.15s; }
        .kpi-card:hover { border-color: var(--orange); }
        .kpi-label { font-size: 10px; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; font-weight: 500; margin-bottom: 6px; }
        .kpi-value { font-size: 28px; font-weight: 700; font-family: monospace; }
        .kpi-green { color: var(--green); } .kpi-orange { color: var(--orange); } .kpi-blue { color: var(--blue); } .kpi-purple { color: var(--purple); }
        
        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
        .card-title { font-size: 12px; font-weight: 600; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-empty { color: var(--text2); font-size: 13px; text-align: center; padding: 20px 0; }
        
        .btn { padding: 9px 16px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: 0.15s; }
        .btn-primary { background: var(--orange); color: #fff; width: 100%; margin-bottom: 8px; }
        .btn-primary:hover { background: #E65100; }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); width: 100%; margin-bottom: 8px; }
        .btn-outline:hover { background: var(--surface2); }
        
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 12px; color: var(--text2); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 500; }
        .tag-progress { background: rgba(255,111,0,0.15); color: var(--orange); }
        .tag-parts { background: rgba(245,158,11,0.15); color: var(--amber); }
        .tag-invoice { background: rgba(59,130,246,0.15); color: var(--blue); }
        .tag-done { background: rgba(34,197,94,0.15); color: var(--green); }
        
        .search-input { width: 100%; padding: 10px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 13px; outline: none; margin-bottom: 14px; }
        .search-input:focus { border-color: var(--orange); }
        .text-mono { font-family: monospace; }
        
        .loading-spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--surface2); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .progress-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .progress-label { width: 110px; font-size: 12px; color: var(--text2); flex-shrink: 0; }
        .progress-bar { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; }
        .progress-count { font-size: 12px; font-weight: 600; font-family: monospace; width: 26px; text-align: right; }
        
        .activity-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .activity-item:last-child { border-bottom: none; }
        .activity-marker { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
        .marker-done { background: var(--green); color: #000; }
        .marker-progress { background: var(--orange); color: #fff; }
        .marker-info { background: var(--blue); color: #fff; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 200; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 13px; outline: none; font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .sidebar.open { display: flex; }
            .main { margin-left: 0; padding: 14px; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">AutoGarage Pro</div>
    <button class="nav-item active" data-section="dashboard">Dashboard</button>
    <button class="nav-item" data-section="workorders">Work Orders</button>
    <button class="nav-item" data-section="customers">Customers</button>
    <button class="nav-item" data-section="vehicles">Vehicles</button>
    <button class="nav-item" data-section="appointments">Appointments</button>
    <div class="nav-section">Operations</div>
    <button class="nav-item" data-section="mechanics">Mechanics</button>
    <button class="nav-item" data-section="inventory">Inventory</button>
    <div class="nav-section">Finance</div>
    <button class="nav-item" data-section="payments">Payments</button>
    <button class="nav-item" data-section="invoices">Invoices</button>
    <button class="nav-item" data-section="reports">Reports</button>
    <div class="nav-section">Tools</div>
    <button class="nav-item" data-section="ai">AI Diagnostics</button>
    <button class="nav-item" data-section="notifications">Notifications</button>
    <button class="nav-item" data-section="settings">Settings</button>
    <div style="margin-top: auto; padding-top: 20px;">
        <button class="nav-item" onclick="logout()" style="color: var(--red);">Sign Out</button>
    </div>
</aside>

<main class="main" id="main-content"></main>

<script>
const API = '/api';
const token = localStorage.getItem('token');
if (!token) { window.location.href = '/api/auth/login-page/'; }

async function api(path, method = 'GET', body = null) {
    const opts = { method, headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(`${API}${path}`, opts);
    return res.json();
}

function extractList(data) {
    if (Array.isArray(data)) return data;
    if (data && data.results) return data.results;
    return [];
}

// Navigation
document.querySelectorAll('.nav-item[data-section]').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        this.classList.add('active');
        loadSection(this.dataset.section);
    });
});

async function loadSection(section) {
    const main = document.getElementById('main-content');
    main.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2);">Loading...</div>';
    try {
        switch(section) {
            case 'dashboard': await loadDashboard(); break;
            case 'workorders': await loadWorkOrders(); break;
            case 'customers': await loadCustomers(); break;
            case 'vehicles': await loadVehicles(); break;
            case 'mechanics': await loadMechanics(); break;
            case 'inventory': await loadInventory(); break;
            case 'appointments': await loadAppointments(); break;
            case 'payments': await loadPayments(); break;
            case 'invoices': await loadInvoices(); break;
            case 'reports': await loadReports(); break;
            case 'ai': await loadAI(); break;
            case 'notifications': await loadNotifications(); break;
            case 'settings': await loadSettings(); break;
        }
    } catch(e) {
        main.innerHTML = `<div class="card" style="text-align:center;padding:60px;"><h2>Error</h2><p style="color:var(--text2);">${e.message}</p></div>`;
    }
}

// ===== DASHBOARD =====
async function loadDashboard() {
    document.getElementById('main-content').innerHTML = `
        <div class="header"><h1 class="header-title">Dashboard</h1><span class="status-badge"><span class="status-dot"></span>System Active</span></div>
        <div class="kpi-grid">
            <div class="kpi-card" onclick="loadSection('customers')"><div class="kpi-label">Customers</div><div class="kpi-value kpi-blue" id="kpiCust">-</div></div>
            <div class="kpi-card" onclick="loadSection('workorders')"><div class="kpi-label">Active Jobs</div><div class="kpi-value kpi-orange" id="kpiJobs">-</div></div>
            <div class="kpi-card" onclick="loadSection('reports')"><div class="kpi-label">Revenue</div><div class="kpi-value kpi-green" id="kpiRev">-</div></div>
            <div class="kpi-card" onclick="loadSection('mechanics')"><div class="kpi-label">Mechanics</div><div class="kpi-value kpi-purple" id="kpiMech">-</div></div>
        </div>
        <div class="content-grid">
            <div class="card">
                <div class="card-title">Quick Actions</div>
                <button class="btn btn-primary" onclick="loadSection('workorders')">+ New Work Order</button>
                <button class="btn btn-outline" onclick="loadSection('customers')">View Customers</button>
                <button class="btn btn-outline" onclick="loadSection('inventory')">Check Inventory</button>
                <button class="btn btn-outline" onclick="loadSection('appointments')">Appointments</button>
            </div>
            <div class="card">
                <div class="card-title">Quick Links</div>
                <button class="btn btn-outline" onclick="loadSection('reports')">Revenue Reports</button>
                <button class="btn btn-outline" onclick="loadSection('ai')">AI Diagnostics</button>
                <button class="btn btn-outline" onclick="loadSection('notifications')">Notifications</button>
                <button class="btn btn-outline" onclick="loadSection('invoices')">Invoices</button>
            </div>
        </div>
    `;
    
    // Load KPIs in background
    try {
        const [orders, customers, mechanics, payments] = await Promise.all([
            api('/work-orders/'), api('/customers/'), api('/mechanics/'), api('/payments/')
        ]);
        const wo = extractList(orders), cust = extractList(customers), mech = extractList(mechanics), pay = extractList(payments);
        const active = wo.filter(w => w.status === 'In Progress' || w.status === 'Awaiting Parts').length;
        const rev = pay.reduce((s, p) => s + (parseFloat(p.amount) || 0), 0);
        document.getElementById('kpiCust').textContent = cust.length;
        document.getElementById('kpiJobs').textContent = active;
        document.getElementById('kpiRev').textContent = 'MWK ' + rev.toLocaleString();
        document.getElementById('kpiMech').textContent = mech.length;
    } catch(e) {}
}

// ===== WORK ORDERS =====
async function loadWorkOrders() {
    const data = await api('/work-orders/');
    const list = extractList(data);
    const sc = { 'In Progress': 'tag-progress', 'Awaiting Parts': 'tag-parts', 'Ready (Pending Invoice)': 'tag-invoice', 'Completed': 'tag-done' };
    document.getElementById('main-content').innerHTML = `
        <div class="header"><h1 class="header-title">Work Orders</h1>
            <button class="btn btn-primary" style="width:auto;" onclick="showWOModal()">+ New Work Order</button>
        </div>
        <div class="card">
            <input class="search-input" id="woSearch" placeholder="Search..." oninput="filterTable('woSearch','woBody')">
            <div class="table-wrapper"><table>
                <thead><tr><th>SRN</th><th>Vehicle</th><th>Status</th><th>Cost</th><th>Actions</th></tr></thead>
                <tbody id="woBody">
                    ${list.map(w => `<tr><td class="text-mono">${w.srn||'BG-'+w.id}</td><td>${w.vehicle_info||w.vehicle||'--'}</td><td><span class="tag ${sc[w.status]||'tag-progress'}">${w.status}</span></td><td class="text-mono">MWK ${parseFloat(w.cost_estimate||0).toLocaleString()}</td><td><select onchange="updateWO(${w.id},this.value)" style="padding:4px 8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:11px;"><option>Change...</option><option>In Progress</option><option>Awaiting Parts</option><option>Ready (Pending Invoice)</option><option>Completed</option></select></td></tr>`).join('') || '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--text2);">No work orders</td></tr>'}
                </tbody>
            </table></div>
        </div>`;
}

async function updateWO(id, status) { if(!status) return; await api(`/work-orders/${id}/`,'PATCH',{status}); loadSection('workorders'); }
function showWOModal() {
    const ov = document.createElement('div'); ov.className='modal-overlay';
    ov.innerHTML = `<div class="modal"><div class="modal-title">New Work Order</div>
        <div class="form-group"><label>Vehicle</label><input id="woVeh" placeholder="e.g. Toyota Hilux"></div>
        <div class="form-group"><label>Customer</label><input id="woCust" placeholder="Customer name"></div>
        <div class="form-group"><label>Issue</label><textarea id="woIssue"></textarea></div>
        <div class="form-group"><label>Cost (MWK)</label><input id="woCost" type="number" value="0"></div>
        <div class="form-actions"><button class="btn btn-outline" style="width:auto;" onclick="this.closest('.modal-overlay').remove()">Cancel</button><button class="btn btn-primary" style="width:auto;" onclick="createWO()">Create</button></div></div>`;
    document.body.appendChild(ov);
}
async function createWO() {
    const v=document.getElementById('woVeh').value, c=document.getElementById('woCust').value;
    const i=document.getElementById('woIssue').value, co=document.getElementById('woCost').value;
    if(!v||!c) return alert('Vehicle and customer required');
    await api('/work-orders/','POST',{vehicle_info:v,customer_name:c,issue_description:i,cost_estimate:parseFloat(co||0)});
    document.querySelector('.modal-overlay').remove(); loadSection('workorders');
}

// ===== CUSTOMERS =====
async function loadCustomers() {
    const list = extractList(await api('/customers/'));
    document.getElementById('main-content').innerHTML = `<div class="header"><h1 class="header-title">Customers</h1></div>
        <div class="card"><input class="search-input" id="cs" placeholder="Search..." oninput="filterTable('cs','cb')">
        <div class="table-wrapper"><table><thead><tr><th>Ref</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead>
        <tbody id="cb">${list.map(c=>`<tr><td class="text-mono">${c.reference_number||'--'}</td><td>${c.full_name}</td><td>${c.phone||'--'}</td><td>${c.email||'--'}</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--text2);">No customers</td></tr>'}</tbody></table></div></div>`;
}

// ===== VEHICLES =====
async function loadVehicles() {
    const list = extractList(await api('/vehicles/'));
    document.getElementById('main-content').innerHTML = `<div class="header"><h1 class="header-title">Vehicles</h1></div>
        <div class="card"><input class="search-input" id="vs" placeholder="Search..." oninput="filterTable('vs','vb')">
        <div class="table-wrapper"><table><thead><tr><th>Plate</th><th>Make</th><th>Model</th><th>Year</th><th>Mileage</th></tr></thead>
        <tbody id="vb">${list.map(v=>`<tr><td class="text-mono" style="color:var(--orange);">${v.plate||'--'}</td><td>${v.make||'--'}</td><td>${v.model_name||'--'}</td><td>${v.year||'--'}</td><td>${(v.mileage||0).toLocaleString()} km</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--text2);">No vehicles</td></tr>'}</tbody></table></div></div>`;
}

// ===== MECHANICS =====
async function loadMechanics() {
    const list = extractList(await api('/mechanics/'));
    document.getElementById('main-content').innerHTML = `<div class="header"><h1 class="header-title">Mechanics</h1></div>
        <div class="card"><div class="table-wrapper"><table><thead><tr><th>Name</th><th>Skills</th><th>Phone</th><th>Status</th></tr></thead>
        <tbody>${list.map(m=>`<tr><td>${m.full_name||m.username||'--'}</td><td>${m.skills||'--'}</td><td>${m.phone||'--'}</td><td><span class="tag ${m.is_available?'tag-done':'tag-progress'}">${m.is_available?'Available':'Busy'}</span></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--text2);">No mechanics</td></tr>'}</tbody></table></div></div>`;
}

// ===== INVENTORY =====
async function loadInventory() {
    const list = extractList(await api('/inventory/'));
    document.getElementById('main-content').innerHTML = `<div class="header"><h1 class="header-title">Inventory</h1></div>
        <div class="card"><input class="search-input" id="is" placeholder="Search..." oninput="filterTable('is','ib')">
        <div class="table-wrapper"><table><thead><tr><th>Part</th><th>Qty</th><th>Min</th><th>Price</th><th>Status</th></tr></thead>
        <tbody id="ib">${list.map(i=>{const low=i.quantity<i.min_threshold;return`<tr><td>${i.part_name}</td><td class="text-mono" style="color:${low?'var(--red)':'var(--green)'};">${i.quantity}</td><td>${i.min_threshold}</td><td class="text-mono">MWK ${parseFloat(i.unit_price||0).toLocaleString()}</td><td><span class="tag ${low?'tag-parts':'tag-done'}">${low?'Low':'OK'}</span></td></tr>`}).join('')||'<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--text2);">No items</td></tr>'}</tbody></table></div></div>`;
}

// ===== APPOINTMENTS =====
async function loadAppointments() {
    const list = extractList(await api('/appointments/'));
    document.getElementById('main-content').innerHTML = `<div class="header"><h1 class="header-title">Appointments</h1></div>
        <div class="card"><div class="table-wrapper"><table><thead><tr><th>Date</th><th>Time</th><th>Customer</th><th>Reason</th></tr></thead>
        <tbody>${list.map(a=>`<tr><td>${a.date||'--'}</td><td class="text-mono" style="color:var(--orange);">${a.time||'--'}</td><td>${a.customer_name||a.customer||'--'}</td><td>${a.reason||'--'}</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--text2);">No appointments</td></tr>'}</tbody></table></div></div>`;
}

// ===== PAYMENTS =====
async function loadPayments() {
    const list = extractList(await api('/payments/'));
    document.getElementById('main-content').innerHTML = `<div class="header"><h1 class="header-title">Payments</h1></div>
        <div class="card"><div class="table-wrapper"><table><thead><tr><th>Ref</th><th>Amount</th><th>Method</th><th>Date</th></tr></thead>
        <tbody>${list.map(p=>`<tr><td class="text-mono">${p.transaction_ref||'--'}</td><td class="text-mono" style="color:var(--green);">MWK ${parseFloat(p.amount||0).toLocaleString()}</td><td>${p.payment_method||'--'}</td><td>${(p.created_at||'').substring(0,10)}</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--text2);">No payments</td></tr>'}</tbody></table></div></div>`;
}

// ===== INVOICES =====
async function loadInvoices() {
    const list = extractList(await api('/invoices/'));
    const sc = {paid:'tag-done',sent:'tag-invoice',draft:'tag-parts',cancelled:'tag-progress'};
    document.getElementById('main-content').innerHTML = `<div class="header"><h1 class="header-title">Invoices</h1></div>
        <div class="card"><div class="table-wrapper"><table><thead><tr><th>Invoice #</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead>
        <tbody>${list.map(i=>`<tr><td class="text-mono">${i.invoice_number||'INV-'+i.id}</td><td>${i.customer_name||'--'}</td><td class="text-mono" style="color:var(--green);">MWK ${parseFloat(i.total_amount||0).toLocaleString()}</td><td><span class="tag ${sc[i.status]||'tag-progress'}">${(i.status||'').toUpperCase()}</span></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--text2);">No invoices</td></tr>'}</tbody></table></div></div>`;
}

// ===== REPORTS =====
async function loadReports() {
    document.getElementById('main-content').innerHTML = `<div class="header"><h1 class="header-title">Reports</h1></div>
        <div style="text-align:center;padding:20px;"><div class="loading-spinner"></div><p style="color:var(--text2);margin-top:8px;">Generating charts...</p></div>`;
    try {
        const data = await api('/charts/all/');
        const charts = [
            {id:'chartRev',url:'/api/charts/revenue/'},
            {id:'chartStat',url:'/api/charts/status/'},
            {id:'chartRep',url:'/api/charts/repairs/'},
            {id:'chartMech',url:'/api/charts/mechanics/'}
        ];
        let imgs = '';
        for(const c of charts) {
            const r = await api(c.url);
            imgs += `<div class="card"><div class="card-title">${c.id==='chartRev'?'Revenue':c.id==='chartStat'?'Job Status':c.id==='chartRep'?'Common Repairs':'Mechanics'}</div><img src="data:image/svg+xml;base64,${r.chart}" style="width:100%;" onerror="this.alt='Chart'"></div>`;
        }
        document.getElementById('main-content').innerHTML = `
            <div class="header"><h1 class="header-title">Reports & Analytics</h1></div>
            <div class="kpi-grid">
                <div class="kpi-card"><div class="kpi-label">Revenue</div><div class="kpi-value kpi-green">MWK ${(data.total_revenue||0).toLocaleString()}</div></div>
                <div class="kpi-card"><div class="kpi-label">Completed</div><div class="kpi-value kpi-blue">${data.completed_jobs||0}</div></div>
                <div class="kpi-card"><div class="kpi-label">Avg Value</div><div class="kpi-value kpi-orange">MWK ${(data.avg_job_value||0).toLocaleString()}</div></div>
                <div class="kpi-card"><div class="kpi-label">Customers</div><div class="kpi-value kpi-purple">${data.total_customers||0}</div></div>
            </div>
            <div class="content-grid">${imgs}</div>`;
    } catch(e) {
        document.getElementById('main-content').innerHTML = `<div class="header"><h1 class="header-title">Reports</h1></div><div class="card" style="text-align:center;padding:40px;"><p>No data available yet. Create work orders and record payments to see reports.</p></div>`;
    }
}

// ===== AI DIAGNOSTICS =====
async function loadAI() {
    document.getElementById('main-content').innerHTML = `
        <div class="header"><h1 class="header-title">AI Diagnostics</h1></div>
        <div class="card">
            <div class="form-group"><label>OBD-II Fault Code</label><input id="aiCode" placeholder="e.g. P0300" maxlength="5" style="text-transform:uppercase;"></div>
            <div class="form-group"><label>Vehicle (optional)</label><input id="aiVeh" placeholder="e.g. Toyota Hilux 2018"></div>
            <button class="btn btn-primary" onclick="runAI()">Run Diagnosis</button>
            <div id="aiResult" style="margin-top:16px;"></div>
        </div>`;
}
async function runAI() {
    const code=document.getElementById('aiCode').value, veh=document.getElementById('aiVeh').value;
    const el=document.getElementById('aiResult');
    if(!code){el.innerHTML='<p style="color:var(--red);">Enter a fault code</p>';return;}
    el.innerHTML='<div class="loading-spinner"></div> Analyzing...';
    try{
        const d=await api('/ai/diagnose/','POST',{code,vehicle:veh});
        const sc={Critical:'var(--red)',High:'var(--orange)',Medium:'var(--amber)',Low:'var(--green)'};
        el.innerHTML=`<div style="padding:16px;background:var(--surface2);border-radius:8px;border-left:3px solid ${sc[d.severity]||'var(--blue)'};"><h3>${d.title}</h3><p style="font-size:11px;color:var(--text2);">Severity: ${d.severity} | Cost: ${d.estimated_cost}</p><ol style="padding-left:16px;font-size:13px;line-height:1.8;">${d.details.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
    }catch(e){el.innerHTML=`<p style="color:var(--red);">${e.message}</p>`;}
}

// ===== NOTIFICATIONS =====
async function loadNotifications() {
    const list = extractList(await api('/notifications/'));
    const pc = {urgent:'var(--red)',high:'var(--orange)',medium:'var(--amber)',low:'var(--blue)'};
    document.getElementById('main-content').innerHTML = `<div class="header"><h1 class="header-title">Notifications</h1>
        <button class="btn btn-outline" style="width:auto;" onclick="markAllRead()">Mark All Read</button></div>
        <div class="card">${list.map(n=>`<div class="activity-item" style="opacity:${n.is_read?0.5:1};"><span class="activity-marker" style="background:${pc[n.priority]||'var(--blue)'};color:#fff;font-size:8px;">${(n.priority||'').substring(0,3).toUpperCase()}</span><span style="flex:1;"><strong>${n.title}</strong><span style="font-size:11px;color:var(--text2);display:block;">${n.message}</span></span>${!n.is_read?`<button class="btn btn-outline" style="width:auto;font-size:10px;padding:4px 8px;" onclick="markRead(${n.id})">Read</button>`:''}</div>`).join('')||'<div class="card-empty">No notifications</div>'}</div>`;
    window._notifList = list;
}
async function markRead(id){await api(`/notifications/${id}/`,'PATCH',{is_read:true});loadSection('notifications');}
async function markAllRead(){for(const n of (window._notifList||[])){if(!n.is_read) await api(`/notifications/${n.id}/`,'PATCH',{is_read:true});}loadSection('notifications');}

// ===== SETTINGS =====
async function loadSettings() {
    document.getElementById('main-content').innerHTML = `
        <div class="header"><h1 class="header-title">Settings</h1></div>
        <div class="card">
            <p><strong>Platform:</strong> AutoGarage Pro v2.0</p>
            <p><strong>API:</strong> ${API}</p>
            <p><strong>Status:</strong> <span style="color:var(--green);">Connected</span></p>
            <button class="btn btn-outline" style="width:auto;margin-top:12px;" onclick="testConn()">Test Connection</button>
            <button class="btn btn-outline" style="width:auto;margin-top:8px;color:var(--red);border-color:var(--red);" onclick="logout()">Sign Out</button>
            <div id="testResult" style="margin-top:12px;font-size:12px;color:var(--text2);"></div>
        </div>`;
}
async function testConn() {
    const el=document.getElementById('testResult');
    el.innerHTML='<div class="loading-spinner"></div>';
    const s=Date.now();
    try{await api('/dashboard/');el.innerHTML=`<span style="color:var(--green);">Connected (${Date.now()-s}ms)</span>`;}
    catch(e){el.innerHTML=`<span style="color:var(--red);">Failed: ${e.message}</span>`;}
}

// ===== HELPERS =====
function filterTable(sid,tid){const q=document.getElementById(sid).value.toLowerCase();document.querySelectorAll(`#${tid} tr`).forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q)?'':'';});}
function logout(){localStorage.removeItem('token');window.location.href='/api/auth/login-page/';}

// Start
loadSection('dashboard');
</script>
