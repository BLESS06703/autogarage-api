<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoGarage Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0d0d0d;--surface:#0f1b27;--border:rgba(217,217,217,0.15);--text:#f2f2f2;--text2:#d9d9d9;--accent:#bfafaf;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text2);font-family:system-ui,-apple-system,sans-serif;display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);padding:16px;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;transition:transform .3s}
.sidebar-brand{font-size:16px;font-weight:700;color:var(--text);margin-bottom:16px}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;color:var(--text2);cursor:pointer;font-size:13px;border:none;background:none;width:100%;text-align:left;margin-bottom:1px;transition:.15s}
.nav-item:hover{background:rgba(217,217,217,0.05);color:var(--text)}
.nav-item.active{background:var(--accent);color:var(--bg);font-weight:600}
.nav-item i{width:16px;text-align:center;font-size:12px}
.nav-section{font-size:10px;color:var(--text2);letter-spacing:1.5px;margin:16px 0 6px 12px;text-transform:uppercase;font-weight:600;opacity:.5}
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--surface);color:var(--text);border:1px solid var(--border);width:38px;height:38px;border-radius:6px;font-size:16px;cursor:pointer}
.main{margin-left:240px;flex:1;padding:24px 28px;min-height:100vh}
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-header h1{font-size:18px;font-weight:700;color:var(--text);flex:1}
.back-btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:600;color:var(--text);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.btn{padding:9px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:.2s}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{background:#cfbfbf}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{background:rgba(217,217,217,.05)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{opacity:.9}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--text2);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text)}
tr{cursor:pointer;transition:.1s}
tr:hover{background:rgba(217,217,217,.03)}
.tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:500}
.tag-active{background:rgba(34,197,94,.1);color:var(--green)}
.tag-pending{background:rgba(245,158,11,.1);color:var(--amber)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:.15s}
.kpi-card:hover{border-color:var(--accent)}
.kpi-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.kpi-value{font-size:28px;font-weight:700;color:var(--text);font-family:monospace}
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.loading{text-align:center;padding:40px;color:var(--text2)}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--text2);font-size:13px}
.fab{position:fixed;bottom:24px;right:24px;z-index:150;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--bg);border:none;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.fab-menu{position:fixed;bottom:88px;right:24px;z-index:150;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;display:none;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:200px}
.fab-menu.open{display:flex}
.fab-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);border:none;background:none;width:100%;text-align:left}
.fab-item:hover{background:rgba(217,217,217,.05)}
.action-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 16px;display:none;gap:12px;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.5);align-items:center}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:300}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:90%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:18px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap i{position:absolute;left:12px;top:12px;color:var(--text2)}
.search-input{width:100%;padding:10px 14px 10px 34px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.search-input:focus{border-color:var(--accent)}
.user-bar{position:fixed;top:12px;right:16px;z-index:90;display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:600;font-size:12px}
.user-name{font-size:12px;color:var(--text)}
.user-garage{font-size:9px;color:var(--text2)}
@media(max-width:768px){.hamburger{display:flex;align-items:center;justify-content:center}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main{margin-left:0!important;padding:56px 12px 80px 12px!important}.kpi-grid{grid-template-columns:repeat(2,1fr)!important}.content-grid{grid-template-columns:1fr!important}.fab{bottom:16px;right:16px;width:44px;height:44px}.fab-menu{bottom:70px;right:16px}}
</style>
</head>
<body>
<button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()">☰</button>
<aside class="sidebar" id="sidebar">
<div class="sidebar-brand">AutoGarage Pro</div>
<button class="nav-item active" data-section="dashboard"><i class="fas fa-th-large"></i>Dashboard</button>
<div class="nav-section">Operations</div>
<button class="nav-item" data-section="customers"><i class="fas fa-users"></i>Customers</button>
<button class="nav-item" data-section="vehicles"><i class="fas fa-car"></i>Vehicles</button>
<button class="nav-item" data-section="appointments"><i class="fas fa-calendar"></i>Appointments</button>
<button class="nav-item" data-section="workorders"><i class="fas fa-wrench"></i>Work Orders</button>
<button class="nav-item" data-section="mechanics"><i class="fas fa-user-cog"></i>Mechanics</button>
<button class="nav-item" data-section="inventory"><i class="fas fa-boxes"></i>Inventory</button>
<div class="nav-section">Finance</div>
<button class="nav-item" data-section="invoices"><i class="fas fa-file-invoice"></i>Invoices</button>
<button class="nav-item" data-section="payments"><i class="fas fa-money-bill"></i>Payments</button>
<button class="nav-item" data-section="reports"><i class="fas fa-chart-bar"></i>Reports</button>
<div class="nav-section">Tools</div>
<button class="nav-item" data-section="files"><i class="fas fa-folder"></i>Files</button>
<button class="nav-item" data-section="ai"><i class="fas fa-robot"></i>AI</button>
<button class="nav-item" data-section="notifications"><i class="fas fa-bell"></i>Notifications</button>
<div class="nav-section">System</div>
<button class="nav-item" data-section="settings"><i class="fas fa-cog"></i>Settings</button>
<div style="margin-top:auto;padding-top:12px"><button class="nav-item" onclick="logout()" style="color:var(--red)"><i class="fas fa-sign-out-alt"></i>Sign Out</button></div>
</aside>
<div class="user-bar" id="userBar"><div class="user-avatar" id="userAvatar">U</div><div><div class="user-name" id="userName">User</div><div class="user-garage" id="garageName">Garage</div></div></div>
<main class="main" id="main-content"><div class="loading"><div class="spinner"></div>Loading...</div></main>
<button class="fab" onclick="toggleFab()">+</button>
<div class="fab-menu" id="fabMenu">
<button class="fab-item" onclick="toggleFab();openForm('workorder')"><i class="fas fa-wrench"></i>New Work Order</button>
<button class="fab-item" onclick="toggleFab();openForm('customer')"><i class="fas fa-user-plus"></i>Register Customer</button>
<button class="fab-item" onclick="toggleFab();openForm('vehicle')"><i class="fas fa-car"></i>Register Vehicle</button>
<button class="fab-item" onclick="toggleFab();openForm('inventory')"><i class="fas fa-box"></i>Add Inventory</button>
</div>
<div class="action-bar" id="actionBar">
<span id="actionLabel" style="color:var(--text2);font-size:12px"></span>
<button class="btn btn-primary" onclick="editSelected()" style="font-size:11px;padding:6px 12px">Edit</button>
<button class="btn btn-danger" onclick="deleteSelected()" style="font-size:11px;padding:6px 12px">Delete</button>
</div>
<script>
var API='https://autogarage-api-wwj4.onrender.com/api',token=localStorage.getItem('token');
if(!token){document.getElementById('main-content').innerHTML='<div style="text-align:center;padding:80px 20px"><h2 style="color:var(--text)">Sign In Required</h2><p style="color:var(--text2);margin:12px 0 20px">Please log in to access your dashboard.</p><a href="/api/auth/login-page/" class="btn btn-primary">Sign In</a></div>';}

(function(){var d=JSON.parse(localStorage.getItem('user')||'{}');if(d.username){document.getElementById('userName').textContent=d.username;document.getElementById('userAvatar').textContent=d.username[0].toUpperCase();}if(d.garage_name)document.getElementById('garageName').textContent=d.garage_name+(d.role?' - '+d.role:'');})();

function toggleSidebar(){var s=document.getElementById('sidebar');s.classList.toggle('open');document.getElementById('hamburgerBtn').innerHTML=s.classList.contains('open')?'✕':'☰';}
function toggleFab(){document.getElementById('fabMenu').classList.toggle('open');}

document.querySelectorAll('.nav-item[data-section]').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('active');});this.classList.add('active');document.getElementById('sidebar').classList.remove('open');loadSection(this.dataset.section);});});

async function api(p,m,body){m=m||'GET';var opts={method:m,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}};if(body)opts.body=JSON.stringify(body);var res=await fetch(API+p,opts);if(!res.ok)throw new Error('Request failed ('+res.status+')');return res.json();}
function L(d){return Array.isArray(d)?d:(d&&d.results?d.results:[]);}

var selType='',selId=null,selRow=null;
function selectRow(type,id,row){if(selRow)selRow.style.background='';selRow=row;selType=type;selId=id;row.style.background='rgba(191,175,175,0.15)';document.getElementById('actionLabel').textContent=type+' #'+id;document.getElementById('actionBar').style.display='flex';}
function editSelected(){if(!selId)return;var v=prompt('Edit '+selType+':');if(!v)return;var body={};if(selType==='customer')body={full_name:v};else if(selType==='vehicle')body={plate:v};else if(selType==='inventory')body={part_name:v};else if(selType==='workorder')body={issue_description:v};else if(selType==='payment')body={payment_method:v};api('/'+selType.replace('workorder','work-orders')+'/'+selId+'/','PATCH',body).then(function(){hideActionBar();goSection(selType.replace('workorder','workorders'));}).catch(function(e){alert('Failed: '+e.message);});}
function deleteSelected(){if(!selId)return;if(!confirm('Delete this '+selType+'?'))return;api('/'+selType.replace('workorder','work-orders')+'/'+selId+'/','DELETE').then(function(){hideActionBar();goSection(selType.replace('workorder','workorders'));}).catch(function(e){alert('Failed: '+e.message);});}
function hideActionBar(){document.getElementById('actionBar').style.display='none';selId=null;selType='';if(selRow)selRow.style.background='';selRow=null;}

function goSection(s){hideActionBar();loadSection(s);}

function openForm(type){
var forms={
customer:{title:'Register Customer',fields:'<div class="form-group"><label>Full Name *</label><input id="cfName"></div><div class="form-group"><label>Phone *</label><input id="cfPhone"></div>',create:function(){var n=document.getElementById('cfName').value.trim(),p=document.getElementById('cfPhone').value.trim();if(!n||!p){alert('Name and phone required');return;}api('/quick-customer/','POST',{full_name:n,phone:p}).then(function(){closeModal();goSection('customers');}).catch(function(e){alert(e.message);});}},
vehicle:{title:'Register Vehicle',fields:'<div class="form-group"><label>Make *</label><input id="cfMake"></div><div class="form-group"><label>Model *</label><input id="cfModel"></div><div class="form-group"><label>Plate *</label><input id="cfPlate"></div><div class="form-group"><label>Year *</label><input id="cfYear"></div><div class="form-group"><label>Customer ID *</label><input id="cfCustId" type="number"></div>',create:function(){var mk=document.getElementById('cfMake').value.trim(),md=document.getElementById('cfModel').value.trim(),pl=document.getElementById('cfPlate').value.trim(),yr=document.getElementById('cfYear').value.trim(),cid=document.getElementById('cfCustId').value;if(!mk||!md||!pl||!yr||!cid){alert('All fields required');return;}api('/quick-vehicle/','POST',{make:mk,model_name:md,plate:pl,year:yr,customer_id:parseInt(cid)}).then(function(){closeModal();goSection('vehicles');}).catch(function(e){alert(e.message);});}},
inventory:{title:'Add Inventory',fields:'<div class="form-group"><label>Part Name *</label><input id="cfPart"></div><div class="form-group"><label>Quantity</label><input id="cfQty" type="number" value="1"></div><div class="form-group"><label>Min Threshold</label><input id="cfMin" type="number" value="5"></div><div class="form-group"><label>Unit Price (MWK)</label><input id="cfPrice" type="number" value="0"></div>',create:function(){var n=document.getElementById('cfPart').value.trim();if(!n){alert('Part name required');return;}api('/inventory/','POST',{part_name:n,quantity:parseInt(document.getElementById('cfQty').value)||1,min_threshold:parseInt(document.getElementById('cfMin').value)||5,unit_price:parseFloat(document.getElementById('cfPrice').value)||0}).then(function(){closeModal();goSection('inventory');}).catch(function(e){alert(e.message);});}},
workorder:{title:'New Work Order',fields:'<div class="form-group"><label>Vehicle Plate *</label><input id="cfPlateWO"></div><div class="form-group"><label>Customer Name *</label><input id="cfCustName"></div><div class="form-group"><label>Customer Phone *</label><input id="cfCustPhone"></div><div class="form-group"><label>Issue *</label><textarea id="cfIssue"></textarea></div><div class="form-group"><label>Cost (MWK)</label><input id="cfCost" type="number" value="0"></div>',create:function(){var pl=document.getElementById('cfPlateWO').value.trim(),cn=document.getElementById('cfCustName').value.trim(),cp=document.getElementById('cfCustPhone').value.trim(),iss=document.getElementById('cfIssue').value.trim();if(!pl||!cn||!cp||!iss){alert('All fields required');return;}api('/quick-workorder/','POST',{plate:pl,customer_name:cn,customer_phone:cp,issue_description:iss,cost_estimate:parseFloat(document.getElementById('cfCost').value)||0}).then(function(){closeModal();goSection('workorders');}).catch(function(e){alert(e.message);});}}
};
var f=forms[type];if(!f)return;
var ov=document.createElement('div');ov.className='modal-overlay';
ov.innerHTML='<div class="modal"><div class="modal-title">'+f.title+'</div>'+f.fields+'<div class="form-actions"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="this.closest(\'.modal-overlay\').querySelector(\'button.btn-primary\').disabled=true;'+f.create.toString().replace('function()','(function()')+'()">Create</button></div></div>';
document.body.appendChild(ov);
ov.addEventListener('click',function(e){if(e.target===ov)closeModal();});
}
function closeModal(){var m=document.querySelector('.modal-overlay');if(m)m.remove();}

async function loadSection(s){
var m=document.getElementById('main-content');m.innerHTML='<div class="loading"><div class="spinner"></div></div>';
try{
if(s==='dashboard')await dash();else if(s==='workorders')await wo();else if(s==='customers')await cust();else if(s==='vehicles')await veh();else if(s==='mechanics')await mech();else if(s==='inventory')await inv();else if(s==='appointments')await appt();else if(s==='payments')await pay();else if(s==='invoices')await invc();else if(s==='reports')await rpt();else if(s==='ai')await aid();else if(s==='files')await filesPage();else if(s==='notifications')await notif();else if(s==='settings')await sett();
}catch(e){m.innerHTML='<div class="empty">Error: '+e.message+'</div>';}
}

async function dash(){var html='<div class="kpi-grid"><div class="kpi-card" onclick="goSection(\'customers\')"><div class="kpi-label">Customers</div><div class="kpi-value" id="k1">-</div></div><div class="kpi-card" onclick="goSection(\'vehicles\')"><div class="kpi-label">Vehicles</div><div class="kpi-value" id="k2">-</div></div><div class="kpi-card" onclick="goSection(\'workorders\')"><div class="kpi-label">Active Jobs</div><div class="kpi-value" id="k3">-</div></div><div class="kpi-card" onclick="goSection(\'payments\')"><div class="kpi-label">Revenue</div><div class="kpi-value" id="k4">-</div></div></div><div class="content-grid"><div class="card"><div class="card-title">Quick Actions</div><button class="btn btn-primary" style="width:100%;margin-bottom:8px" onclick="openForm(\'workorder\')">New Work Order</button><button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="openForm(\'customer\')">Register Customer</button><button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="openForm(\'vehicle\')">Register Vehicle</button><button class="btn btn-outline" style="width:100%" onclick="openForm(\'inventory\')">Add Inventory</button></div><div class="card"><div class="card-title">Recent Activity</div><div id="activity"></div></div></div>';document.getElementById('main-content').innerHTML=html;
try{var o=await api('/work-orders/'),c=await api('/customers/'),v=await api('/vehicles/'),p=await api('/payments/');var wo=L(o),cu=L(c),ve=L(v),pa=L(p);document.getElementById('k1').textContent=cu.length;document.getElementById('k2').textContent=ve.length;document.getElementById('k3').textContent=wo.filter(function(w){return w.status==='In Progress'||w.status==='Awaiting Parts';}).length;document.getElementById('k4').textContent='MWK '+pa.reduce(function(s,p){return s+(parseFloat(p.amount)||0);},0).toLocaleString();
document.getElementById('activity').innerHTML=wo.slice(0,5).map(function(w){return'<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">'+(w.vehicle_info||'WO')+' — <span class="tag '+(w.status==='Completed'?'tag-active':'tag-pending')+'">'+w.status+'</span></div>';}).join('')||'<div class="empty">No activity yet</div>';}catch(e){}}

async function wo(){var list=L(await api('/work-orders/'));var rows=list.map(function(w){return'<tr onclick="selectRow(\'workorder\','+w.id+',this)"><td>'+(w.srn||'BG-'+w.id)+'</td><td>'+(w.vehicle_info||w.vehicle||'—')+'</td><td><span class="tag '+(w.status==='Completed'?'tag-active':'tag-pending')+'">'+w.status+'</span></td><td>MWK '+parseFloat(w.cost_estimate||0).toLocaleString()+'</td></tr>';}).join('');document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Work Orders</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>SRN</th><th>Vehicle</th><th>Status</th><th>Cost</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="empty">No work orders</td></tr>')+'</tbody></table></div></div>';}

async function cust(){var list=L(await api('/customers/'));var rows=list.map(function(c){return'<tr onclick="selectRow(\'customer\','+c.id+',this)"><td><strong>'+c.full_name+'</strong></td><td>'+c.phone+'</td><td>'+c.email+'</td><td>'+c.reference_number+'</td></tr>';}).join('');document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Customers</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Ref</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="empty">No customers</td></tr>')+'</tbody></table></div></div>';}

async function veh(){var list=L(await api('/vehicles/'));var rows=list.map(function(v){return'<tr onclick="selectRow(\'vehicle\','+v.id+',this)"><td>'+v.make+' '+v.model_name+'</td><td>'+v.plate+'</td><td>'+v.year+'</td><td>'+(v.mileage||0)+' km</td></tr>';}).join('');document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Vehicles</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Vehicle</th><th>Plate</th><th>Year</th><th>Mileage</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="empty">No vehicles</td></tr>')+'</tbody></table></div></div>';}

async function mech(){var list=L(await api('/mechanics/'));var rows=list.map(function(m){return'<tr><td><strong>'+(m.full_name||m.username)+'</strong></td><td>'+m.skills+'</td><td><span class="tag '+(m.is_available?'tag-active':'tag-pending')+'">'+(m.is_available?'Available':'Busy')+'</span></td></tr>';}).join('');document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Mechanics</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Name</th><th>Skills</th><th>Status</th></tr></thead><tbody>'+(rows||'<tr><td colspan="3" class="empty">No mechanics</td></tr>')+'</tbody></table></div></div>';}

async function inv(){var list=L(await api('/inventory/'));var rows=list.map(function(i){var lo=i.quantity<i.min_threshold;return'<tr onclick="selectRow(\'inventory\','+i.id+',this)"><td><strong>'+i.part_name+'</strong></td><td style="color:'+(lo?'var(--red)':'var(--green)')+';font-weight:600">'+i.quantity+'</td><td>'+i.min_threshold+'</td><td>MWK '+parseFloat(i.unit_price||0).toLocaleString()+'</td></tr>';}).join('');document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Inventory</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Part</th><th>Qty</th><th>Min</th><th>Price</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="empty">No items</td></tr>')+'</tbody></table></div></div>';}

async function appt(){var list=L(await api('/appointments/'));var rows=list.map(function(a){return'<tr><td>'+a.date+'</td><td>'+a.time+'</td><td>'+(a.customer_name||a.customer||'—')+'</td><td>'+a.reason+'</td></tr>';}).join('');document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Appointments</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Date</th><th>Time</th><th>Customer</th><th>Reason</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="empty">No appointments</td></tr>')+'</tbody></table></div></div>';}

async function pay(){var list=L(await api('/payments/'));var rows=list.map(function(p){return'<tr onclick="selectRow(\'payment\','+p.id+',this)"><td>'+p.transaction_ref+'</td><td style="color:var(--green);font-weight:600">MWK '+parseFloat(p.amount).toLocaleString()+'</td><td>'+p.payment_method+'</td></tr>';}).join('');document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Payments</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Ref</th><th>Amount</th><th>Method</th></tr></thead><tbody>'+(rows||'<tr><td colspan="3" class="empty">No payments</td></tr>')+'</tbody></table></div></div>';}

async function invc(){var list=L(await api('/invoices/'));var rows=list.map(function(i){return'<tr><td>'+(i.invoice_number||'INV-'+i.id)+'</td><td>'+i.customer_name+'</td><td style="color:var(--green);font-weight:600">MWK '+parseFloat(i.total_amount).toLocaleString()+'</td><td><span class="tag '+(i.status==='paid'?'tag-active':'tag-pending')+'">'+i.status+'</span></td></tr>';}).join('');document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Invoices</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Invoice #</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="empty">No invoices</td></tr>')+'</tbody></table></div></div>';}

async function rpt(){document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Reports</h1></div><div class="loading"><div class="spinner"></div></div>';
try{var o=await api('/work-orders/'),p=await api('/payments/'),m=await api('/mechanics/');var wo=L(o),pa=L(p),me=L(m);var rev=pa.reduce(function(s,p){return s+(parseFloat(p.amount)||0);},0),comp=wo.filter(function(w){return w.status==='Completed';}).length,act=wo.filter(function(w){return w.status==='In Progress'||w.status==='Awaiting Parts';}).length;var st={};wo.forEach(function(w){st[w.status]=(st[w.status]||0)+1;});var mt={};pa.forEach(function(p){var m=p.payment_method||'Other';mt[m]=(mt[m]||0)+parseFloat(p.amount);});document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Reports</h1></div><div class="kpi-grid"><div class="kpi-card"><div class="kpi-label">Total Revenue</div><div class="kpi-value">MWK '+rev.toLocaleString()+'</div></div><div class="kpi-card"><div class="kpi-label">Completed</div><div class="kpi-value">'+comp+'</div></div><div class="kpi-card"><div class="kpi-label">Active</div><div class="kpi-value">'+act+'</div></div><div class="kpi-card"><div class="kpi-label">Avg Value</div><div class="kpi-value">MWK '+(comp>0?Math.round(rev/comp):0).toLocaleString()+'</div></div></div><div class="content-grid"><div class="card"><div class="card-title">Revenue by Method</div><div style="height:250px"><canvas id="r1"></canvas></div></div><div class="card"><div class="card-title">Job Status</div><div style="height:250px"><canvas id="r2"></canvas></div></div></div>';
setTimeout(function(){if(Object.keys(mt).length)new Chart(document.getElementById('r1'),{type:'bar',data:{labels:Object.keys(mt),datasets:[{data:Object.values(mt),backgroundColor:['#bfafaf','#3b82f6','#22c55e'],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#d9d9d9'}},y:{ticks:{color:'#d9d9d9'}}}}});if(Object.keys(st).length)new Chart(document.getElementById('r2'),{type:'doughnut',data:{labels:Object.keys(st),datasets:[{data:Object.values(st),backgroundColor:['#bfafaf','#f59e0b','#3b82f6','#22c55e']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#d9d9d9',padding:10}}}}});},300);}catch(e){document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Reports</h1></div><div class="empty">No data yet. Create work orders and record payments.</div>';}}

async function aid(){document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>AI Diagnostics</h1></div><div class="card" style="max-width:500px"><div class="card-title">Fault Code Analyzer</div><div class="form-group"><label>OBD-II Code</label><input id="ac" placeholder="e.g. P0300" maxlength="5" style="text-transform:uppercase"></div><div class="form-group"><label>Vehicle</label><input id="av" placeholder="e.g. Toyota Hilux"></div><button class="btn btn-primary" onclick="runAI()">Run Diagnosis</button><div id="ar" style="margin-top:12px"></div></div>';}
async function runAI(){var c=document.getElementById('ac').value,v=document.getElementById('av').value,el=document.getElementById('ar');if(!c){el.innerHTML='<p style="color:var(--red)">Enter a code</p>';return;}el.innerHTML='<div class="spinner"></div>';try{var d=await api('/ai/diagnose/','POST',{code:c,vehicle:v});el.innerHTML='<div style="padding:14px;background:var(--bg);border-radius:8px;margin-top:12px;border:1px solid var(--border)"><h3>'+d.title+'</h3><p style="font-size:12px;color:var(--text2);margin:6px 0">Severity: '+d.severity+' · Cost: '+d.estimated_cost+'</p><ol style="padding-left:16px;font-size:13px;line-height:2">'+d.details.map(function(x){return'<li>'+x+'</li>';}).join('')+'</ol></div>';}catch(e){el.innerHTML='<p style="color:var(--red)">'+e.message+'</p>';}}

async function filesPage(){document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Files</h1></div><div class="card"><input type="file" id="fileInput" style="margin-bottom:12px;color:var(--text)"><button class="btn btn-primary" onclick="uploadFile()">Upload</button><div id="fileList" style="margin-top:14px"><div class="spinner"></div></div></div>';loadFiles();}
async function loadFiles(){try{var list=L(await api('/files/'));var html=list.length?list.map(function(f){return'<div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between"><span>'+f.filename+' <span style="color:var(--text2);font-size:10px">'+Math.round(f.size/1024)+'KB</span></span><button class="btn btn-danger" style="font-size:10px;padding:4px 8px" onclick="deleteSelected()">Delete</button></div>';}).join(''):'<div class="empty">No files uploaded</div>';document.getElementById('fileList').innerHTML=html;}catch(e){document.getElementById('fileList').innerHTML='<div class="empty">Failed to load files</div>';}}
async function uploadFile(){var input=document.getElementById('fileInput');var file=input.files[0];if(!file){alert('Select a file');return;}var form=new FormData();form.append('file',file);try{var res=await fetch(API+'/upload-file/',{method:'POST',headers:{'Authorization':'Bearer '+token},body:form});if(res.ok){loadFiles();input.value='';}else{alert('Upload failed');}}catch(e){alert('Upload failed: '+e.message);}}

async function notif(){var list=L(await api('/notifications/'));document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Notifications</h1></div><div class="card">'+(list.length?list.map(function(n){return'<div style="padding:10px 0;border-bottom:1px solid var(--border);opacity:'+(n.is_read?0.5:1)+'"><strong>'+n.title+'</strong><div style="font-size:11px;color:var(--text2)">'+n.message+'</div></div>';}).join(''):'<div class="empty">No notifications</div>')+'</div>';}

async function sett(){document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Settings</h1></div><div class="card" style="max-width:400px"><p>AutoGarage Pro v2.0</p><p style="color:var(--green)">Connected</p><p style="color:var(--text2)">PostgreSQL · Supabase</p><p style="color:var(--text2);margin-top:8px">Contact: blesskaunda056@gmail.com</p><p style="color:var(--text2)">Phone: 0892477118</p><button class="btn btn-outline" style="width:100%;margin-top:16px" onclick="logout()">Sign Out</button></div>';}

function logout(){localStorage.removeItem('token');window.location.href='/api/auth/login-page/';}
if(token){loadSection('dashboard');}
</script>
