<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGarage Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0D0D0D; --surface: #1A1A1A; --surface2: #242424;
            --border: #2A2A2A; --text: #E0E0E0; --text2: #888;
            --orange: #FF6F00; --green: #22C55E; --red: #EF4444;
            --blue: #3B82F6; --amber: #F59E0B; --purple: #8B5CF6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; min-height: 100vh; }

        .sidebar {
            width: 240px; background: var(--surface); border-right: 1px solid var(--border);
            padding: 16px; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
            overflow-y: auto; transition: transform 0.3s;
        }
        .sidebar-brand { font-size: 16px; font-weight: 700; color: var(--orange); margin-bottom: 16px; padding: 4px 8px; }
        .nav-item {
            display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px;
            color: var(--text2); cursor: pointer; font-size: 13px; border: none; background: none;
            width: 100%; text-align: left; margin-bottom: 2px; transition: 0.15s;
        }
        .nav-item i { width: 18px; text-align: center; font-size: 13px; }
        .nav-item:hover { background: var(--surface2); color: var(--text); }
        .nav-item.active { background: var(--orange); color: #fff; font-weight: 600; }
        .nav-section { font-size: 10px; color: var(--text2); letter-spacing: 1.5px; margin: 16px 0 6px 12px; text-transform: uppercase; font-weight: 600; }

        .hamburger { display: none; position: fixed; top: 10px; left: 10px; z-index: 200; background: var(--orange); color: #fff; border: none; width: 38px; height: 38px; border-radius: 8px; font-size: 18px; cursor: pointer; }

        .main { margin-left: 240px; flex: 1; padding: 24px; min-height: 100vh; }

        .page-header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
        .page-header h1 { font-size: 20px; font-weight: 700; }
        .back-btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; transition: 0.15s; display: flex; align-items: center; gap: 6px; }
        .back-btn:hover { background: var(--border); }

        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
        .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; cursor: pointer; transition: 0.15s; }
        .kpi-card:hover { border-color: var(--orange); }
        .kpi-label { font-size: 10px; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; font-weight: 500; margin-bottom: 6px; }
        .kpi-value { font-size: 28px; font-weight: 700; font-family: 'SF Mono', monospace; }
        .kpi-green { color: var(--green); } .kpi-orange { color: var(--orange); } .kpi-blue { color: var(--blue); } .kpi-purple { color: var(--purple); }

        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
        .card-title { font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
        .card-title i { color: var(--orange); font-size: 13px; }

        .btn { padding: 10px 18px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: 0.15s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--orange); color: #fff; }
        .btn-primary:hover { background: #E65100; }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--surface2); }
        .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
        .btn-danger:hover { background: rgba(239,68,68,0.1); }

        .table-wrapper { overflow-x: auto; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 12px 14px; color: var(--text2); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); background: var(--surface); }
        td { padding: 12px 14px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 500; letter-spacing: 0.3px; }
        .tag-progress { background: rgba(255,111,0,0.15); color: var(--orange); }
        .tag-parts { background: rgba(245,158,11,0.15); color: var(--amber); }
        .tag-invoice { background: rgba(59,130,246,0.15); color: var(--blue); }
        .tag-done { background: rgba(34,197,94,0.15); color: var(--green); }
        .tag-cancelled { background: rgba(239,68,68,0.15); color: var(--red); }

        .search-input { width: 100%; padding: 10px 14px 10px 36px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; margin-bottom: 14px; }
        .search-input:focus { border-color: var(--orange); }
        .search-wrap { position: relative; }
        .search-wrap i { position: absolute; left: 14px; top: 14px; color: var(--text2); font-size: 13px; }
        .text-mono { font-family: 'SF Mono', monospace; font-size: 12px; }

        .loading-spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--surface2); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text2); }
        .empty-state i { font-size: 40px; margin-bottom: 12px; color: var(--border); }
        .empty-state p { font-size: 13px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 300; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 18px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 13px; outline: none; font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--orange); }
        .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

        @media (max-width: 768px) {
            .hamburger { display: flex; align-items: center; justify-content: center; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 14px; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .content-grid { grid-template-columns: 1fr; }
            .page-header { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="fas fa-wrench"></i> AutoGarage Pro</div>
    <button class="nav-item active" data-section="dashboard"><i class="fas fa-th-large"></i> Dashboard</button>
    <button class="nav-item" data-section="workorders"><i class="fas fa-clipboard-list"></i> Work Orders</button>
    <button class="nav-item" data-section="customers"><i class="fas fa-users"></i> Customers</button>
    <button class="nav-item" data-section="vehicles"><i class="fas fa-car"></i> Vehicles</button>
    <button class="nav-item" data-section="appointments"><i class="fas fa-calendar-alt"></i> Appointments</button>
    <div class="nav-section">Operations</div>
    <button class="nav-item" data-section="mechanics"><i class="fas fa-user-cog"></i> Mechanics</button>
    <button class="nav-item" data-section="inventory"><i class="fas fa-boxes"></i> Inventory</button>
    <div class="nav-section">Finance</div>
    <button class="nav-item" data-section="payments"><i class="fas fa-money-bill-wave"></i> Payments</button>
    <button class="nav-item" data-section="invoices"><i class="fas fa-file-invoice"></i> Invoices</button>
    <button class="nav-item" data-section="reports"><i class="fas fa-chart-bar"></i> Reports</button>
    <div class="nav-section">Tools</div>
    <button class="nav-item" data-section="ai"><i class="fas fa-robot"></i> AI Diagnostics</button>
    <button class="nav-item" data-section="notifications"><i class="fas fa-bell"></i> Notifications</button>
    <button class="nav-item" data-section="settings"><i class="fas fa-cog"></i> Settings</button>
    <div style="margin-top: auto; padding-top: 16px;">
        <button class="nav-item" onclick="logout()" style="color: var(--red);"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
    </div>
</aside>

<main class="main" id="main-content"></main>

<script>
const API = '/api';
const token = localStorage.getItem('token');
if (!token) { window.location.href = '/api/auth/login-page/'; }

async function api(p, m='GET', b=null) {
    const o = { method:m, headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'} };
    if (b) o.body = JSON.stringify(b);
    const r = await fetch(`${API}${p}`, o);
    return r.json();
}
function L(d) { return Array.isArray(d) ? d : (d&&d.results ? d.results : []); }

// Navigation
document.querySelectorAll('.nav-item[data-section]').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('sidebar').classList.remove('open');
        loadSection(this.dataset.section);
    });
});

function backToDashboard() { loadSection('dashboard'); }

async function loadSection(s) {
    const m = document.getElementById('main-content');
    m.innerHTML = '<div style="text-align:center;padding:40px;"><div class="loading-spinner"></div></div>';
    try {
        switch(s) {
            case 'dashboard': await dash(); break;
            case 'workorders': await wo(); break;
            case 'customers': await cust(); break;
            case 'vehicles': await veh(); break;
            case 'mechanics': await mech(); break;
            case 'inventory': await inv(); break;
            case 'appointments': await appt(); break;
            case 'payments': await pay(); break;
            case 'invoices': await invc(); break;
            case 'reports': await rpt(); break;
            case 'ai': await aid(); break;
            case 'notifications': await notif(); break;
            case 'settings': await sett(); break;
        }
    } catch(e) {
        m.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>${e.message}</p><button class="btn btn-outline" style="margin-top:12px;" onclick="loadSection('${s}')">Retry</button></div>`;
    }
}

// ===== DASHBOARD =====
async function dash() {
    document.getElementById('main-content').innerHTML = `
        <div class="page-header"><h1><i class="fas fa-th-large" style="color:var(--orange);margin-right:8px;"></i>Dashboard</h1></div>
        <div class="kpi-grid">
            <div class="kpi-card" onclick="loadSection('customers')"><div class="kpi-label">Customers</div><div class="kpi-value kpi-blue" id="k1">-</div></div>
            <div class="kpi-card" onclick="loadSection('workorders')"><div class="kpi-label">Active Jobs</div><div class="kpi-value kpi-orange" id="k2">-</div></div>
            <div class="kpi-card" onclick="loadSection('reports')"><div class="kpi-label">Revenue</div><div class="kpi-value kpi-green" id="k3">-</div></div>
            <div class="kpi-card" onclick="loadSection('mechanics')"><div class="kpi-label">Mechanics</div><div class="kpi-value kpi-purple" id="k4">-</div></div>
        </div>
        <div class="content-grid">
            <div class="card"><div class="card-title"><i class="fas fa-bolt"></i> Quick Actions</div>
                <button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="loadSection('workorders')"><i class="fas fa-plus"></i> New Work Order</button>
                <button class="btn btn-outline" style="width:100%;margin-bottom:8px;" onclick="loadSection('customers')"><i class="fas fa-users"></i> Customers</button>
                <button class="btn btn-outline" style="width:100%;margin-bottom:8px;" onclick="loadSection('inventory')"><i class="fas fa-boxes"></i> Inventory</button>
                <button class="btn btn-outline" style="width:100%;" onclick="loadSection('appointments')"><i class="fas fa-calendar-alt"></i> Appointments</button>
            </div>
            <div class="card"><div class="card-title"><i class="fas fa-link"></i> Quick Links</div>
                <button class="btn btn-outline" style="width:100%;margin-bottom:8px;" onclick="loadSection('reports')"><i class="fas fa-chart-bar"></i> Reports</button>
                <button class="btn btn-outline" style="width:100%;margin-bottom:8px;" onclick="loadSection('ai')"><i class="fas fa-robot"></i> AI Diagnostics</button>
                <button class="btn btn-outline" style="width:100%;margin-bottom:8px;" onclick="loadSection('notifications')"><i class="fas fa-bell"></i> Notifications</button>
                <button class="btn btn-outline" style="width:100%;" onclick="loadSection('invoices')"><i class="fas fa-file-invoice"></i> Invoices</button>
            </div>
        </div>`;
    try {
        const [o, c, m, p] = await Promise.all([api('/work-orders/'), api('/customers/'), api('/mechanics/'), api('/payments/')]);
        const wo=L(o), cu=L(c), me=L(m), pa=L(p);
        document.getElementById('k1').textContent = cu.length;
        document.getElementById('k2').textContent = wo.filter(w=>w.status==='In Progress'||w.status==='Awaiting Parts').length;
        document.getElementById('k3').textContent = 'MWK '+pa.reduce((s,p)=>s+(parseFloat(p.amount)||0),0).toLocaleString();
        document.getElementById('k4').textContent = me.length;
    } catch(e) {}
}

// ===== WORK ORDERS =====
async function wo() {
    const list = L(await api('/work-orders/'));
    const sc = {'In Progress':'tag-progress','Awaiting Parts':'tag-parts','Ready (Pending Invoice)':'tag-invoice','Completed':'tag-done'};
    document.getElementById('main-content').innerHTML = `
        <div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>Work Orders</h1><button class="btn btn-primary" onclick="woModal()"><i class="fas fa-plus"></i> New Work Order</button></div>
        <div class="card">
            <div class="search-wrap"><i class="fas fa-search"></i><input class="search-input" id="woS" placeholder="Search work orders..." oninput="FT('woS','woB')"></div>
            <div class="table-wrapper"><table><thead><tr><th>SRN</th><th>Vehicle</th><th>Status</th><th>Cost</th><th>Action</th></tr></thead>
            <tbody id="woB">${list.map(w=>`<tr><td class="text-mono">${w.srn||'BG-'+w.id}</td><td>${w.vehicle_info||w.vehicle||'--'}</td><td><span class="tag ${sc[w.status]||'tag-progress'}">${w.status}</span></td><td class="text-mono">MWK ${parseFloat(w.cost_estimate||0).toLocaleString()}</td><td><select onchange="woUp(${w.id},this.value)" style="padding:5px 8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:5px;font-size:11px;"><option>Status...</option><option>In Progress</option><option>Awaiting Parts</option><option>Ready (Pending Invoice)</option><option>Completed</option></select></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty-state"><i class="fas fa-clipboard-list"></i><p>No work orders yet</p></div></td></tr>'}</tbody></table></div>
        </div>`;
}
async function woUp(id,s){if(!s)return;await api(`/work-orders/${id}/`,'PATCH',{status:s});loadSection('workorders');}
function woModal(){
    const ov=document.createElement('div');ov.className='modal-overlay';
    ov.innerHTML=`<div class="modal"><div class="modal-title">New Work Order</div>
        <div class="form-group"><label>Vehicle</label><input id="wv" placeholder="e.g. Toyota Hilux"></div>
        <div class="form-group"><label>Customer</label><input id="wc" placeholder="Customer name"></div>
        <div class="form-group"><label>Issue Description</label><textarea id="wi"></textarea></div>
        <div class="form-group"><label>Cost Estimate (MWK)</label><input id="wk" type="number" value="0"></div>
        <div class="form-actions"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button><button class="btn btn-primary" onclick="woCr()">Create</button></div></div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
}
async function woCr(){
    const v=document.getElementById('wv').value,c=document.getElementById('wc').value;
    const i=document.getElementById('wi').value,k=document.getElementById('wk').value;
    if(!v||!c) return alert('Vehicle and customer required');
    await api('/work-orders/','POST',{vehicle_info:v,customer_name:c,issue_description:i,cost_estimate:parseFloat(k||0)});
    document.querySelector('.modal-overlay').remove();loadSection('workorders');
}

// ===== CUSTOMERS =====
async function cust(){
    const list = L(await api('/customers/'));
    document.getElementById('main-content').innerHTML = `
        <div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>Customers</h1></div>
        <div class="card">
            <div class="search-wrap"><i class="fas fa-search"></i><input class="search-input" id="cs" placeholder="Search by name, phone or email..." oninput="FT('cs','cb')"></div>
            <div class="table-wrapper"><table><thead><tr><th>Reference</th><th>Full Name</th><th>Phone</th><th>Email</th><th>Registered</th></tr></thead>
            <tbody id="cb">${list.map(c=>`<tr><td class="text-mono">${c.reference_number||'--'}</td><td style="font-weight:500;">${c.full_name}</td><td>${c.phone||'--'}</td><td>${c.email||'--'}</td><td>${(c.created_at||'').substring(0,10)}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty-state"><i class="fas fa-users"></i><p>No customers registered</p></div></td></tr>'}</tbody></table></div>
        </div>`;
}

// ===== VEHICLES =====
async function veh(){
    const list = L(await api('/vehicles/'));
    document.getElementById('main-content').innerHTML = `
        <div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>Vehicles</h1></div>
        <div class="card">
            <div class="search-wrap"><i class="fas fa-search"></i><input class="search-input" id="vs" placeholder="Search by plate, make or model..." oninput="FT('vs','vb')"></div>
            <div class="table-wrapper"><table><thead><tr><th>Plate</th><th>Make</th><th>Model</th><th>Year</th><th>VIN</th><th>Mileage</th></tr></thead>
            <tbody id="vb">${list.map(v=>`<tr><td class="text-mono" style="color:var(--orange);font-weight:600;">${v.plate||'--'}</td><td>${v.make||'--'}</td><td>${v.model_name||'--'}</td><td>${v.year||'--'}</td><td class="text-mono">${v.vin||'--'}</td><td>${(v.mileage||0).toLocaleString()} km</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty-state"><i class="fas fa-car"></i><p>No vehicles registered</p></div></td></tr>'}</tbody></table></div>
        </div>`;
}

// ===== MECHANICS =====
async function mech(){
    const list = L(await api('/mechanics/'));
    document.getElementById('main-content').innerHTML = `
        <div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>Mechanics</h1></div>
        <div class="card"><div class="table-wrapper"><table><thead><tr><th>Name</th><th>Skills</th><th>Phone</th><th>Status</th><th>Hire Date</th></tr></thead>
        <tbody>${list.map(m=>`<tr><td style="font-weight:500;">${m.full_name||m.username||'--'}</td><td>${m.skills||'--'}</td><td>${m.phone||'--'}</td><td><span class="tag ${m.is_available?'tag-done':'tag-progress'}">${m.is_available?'Available':'Busy'}</span></td><td>${m.hire_date||'--'}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty-state"><i class="fas fa-user-cog"></i><p>No mechanics registered</p></div></td></tr>'}</tbody></table></div></div>`;
}

// ===== INVENTORY =====
async function inv(){
    const list = L(await api('/inventory/'));
    document.getElementById('main-content').innerHTML = `
        <div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>Inventory</h1></div>
        <div class="card">
            <div class="search-wrap"><i class="fas fa-search"></i><input class="search-input" id="is" placeholder="Search parts..." oninput="FT('is','ib')"></div>
            <div class="table-wrapper"><table><thead><tr><th>Part Name</th><th>Quantity</th><th>Min</th><th>Unit Price</th><th>Status</th></tr></thead>
            <tbody id="ib">${list.map(i=>{const lo=i.quantity<i.min_threshold;return`<tr><td style="font-weight:500;">${i.part_name}</td><td class="text-mono" style="color:${lo?'var(--red)':'var(--green)'};font-weight:600;">${i.quantity}</td><td>${i.min_threshold}</td><td class="text-mono">MWK ${parseFloat(i.unit_price||0).toLocaleString()}</td><td><span class="tag ${lo?'tag-parts':'tag-done'}">${lo?'Low Stock':'In Stock'}</span></td></tr>`;}).join('')||'<tr><td colspan="5"><div class="empty-state"><i class="fas fa-boxes"></i><p>No inventory items</p></div></td></tr>'}</tbody></table></div>
        </div>`;
}

// ===== APPOINTMENTS =====
async function appt(){
    const list = L(await api('/appointments/'));
    document.getElementById('main-content').innerHTML = `
        <div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>Appointments</h1></div>
        <div class="card"><div class="table-wrapper"><table><thead><tr><th>Date</th><th>Time</th><th>Customer</th><th>Reason</th></tr></thead>
        <tbody>${list.map(a=>`<tr><td>${a.date||'--'}</td><td class="text-mono" style="color:var(--orange);font-weight:600;">${a.time||'--:--'}</td><td style="font-weight:500;">${a.customer_name||a.customer||'--'}</td><td>${a.reason||'--'}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty-state"><i class="fas fa-calendar-alt"></i><p>No appointments scheduled</p></div></td></tr>'}</tbody></table></div></div>`;
}

        <div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>Invoices</h1></div>
        <div class="card"><div class="table-wrapper"><table><thead><tr><th>Invoice #</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>

// ===== REPORTS =====
async function rpt(){
    document.getElementById('main-content').innerHTML = `
        <div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>Reports & Analytics</h1></div>
        <div style="text-align:center;padding:40px;"><div class="loading-spinner"></div><p style="color:var(--text2);margin-top:8px;">Generating reports...</p></div>`;
    try {
        const [o, p, m] = await Promise.all([api('/work-orders/'), api('/payments/'), api('/mechanics/')]);
        const wo=L(o), pa=L(p), me=L(m);
        const rev = pa.reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
        const comp = wo.filter(w=>w.status==='Completed').length;
        const act = wo.filter(w=>w.status==='In Progress'||w.status==='Awaiting Parts').length;
        const avg = comp>0?Math.round(rev/comp):0;
        const st = {'In Progress':0,'Awaiting Parts':0,'Ready (Pending Invoice)':0,'Completed':0};
        wo.forEach(w=>{if(st[w.status]!==undefined)st[w.status]++;});
        const mt = {}; pa.forEach(p=>{const m=p.payment_method||'Other';mt[m]=(mt[m]||0)+parseFloat(p.amount||0);});
        const it = {}; wo.forEach(w=>{const k=(w.issue_description||'General').split(' ').slice(0,3).join(' ');it[k]=(it[k]||0)+1;});
        const top = Object.entries(it).sort((a,b)=>b[1]-a[1]).slice(0,6);

        document.getElementById('main-content').innerHTML = `
            <div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>Reports & Analytics</h1></div>
            <div class="kpi-grid">
                <div class="kpi-card"><div class="kpi-label">Total Revenue</div><div class="kpi-value kpi-green">MWK ${rev.toLocaleString()}</div></div>
                <div class="kpi-card"><div class="kpi-label">Completed Jobs</div><div class="kpi-value kpi-blue">${comp}</div></div>
                <div class="kpi-card"><div class="kpi-label">Avg Job Value</div><div class="kpi-value kpi-orange">MWK ${avg.toLocaleString()}</div></div>
                <div class="kpi-card"><div class="kpi-label">Active Jobs</div><div class="kpi-value kpi-purple">${act}</div></div>
            </div>
            <div class="content-grid">
                <div class="card"><div class="card-title"><i class="fas fa-chart-bar"></i> Revenue by Payment Method</div><div style="height:280px;"><canvas id="c1"></canvas></div></div>
                <div class="card"><div class="card-title"><i class="fas fa-chart-pie"></i> Job Status Distribution</div><div style="height:280px;"><canvas id="c2"></canvas></div></div>
                <div class="card"><div class="card-title"><i class="fas fa-chart-line"></i> Most Common Repairs</div><div style="height:280px;"><canvas id="c3"></canvas></div></div>
                <div class="card"><div class="card-title"><i class="fas fa-user-check"></i> Mechanic Workload</div><div style="height:280px;"><canvas id="c4"></canvas></div></div>
            </div>`;
        setTimeout(()=>{
            const o={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#888'}}},scales:{x:{ticks:{color:'#888'},grid:{color:'#222'}},y:{ticks:{color:'#888'},grid:{color:'#222'}}}};
            new Chart(document.getElementById('c1'),{type:'bar',data:{labels:Object.keys(mt),datasets:[{label:'Revenue (MWK)',data:Object.values(mt),backgroundColor:['#FF6F00','#3B82F6','#22C55E','#8B5CF6','#F59E0B'],borderRadius:6}]},options:o});
            new Chart(document.getElementById('c2'),{type:'doughnut',data:{labels:Object.keys(st),datasets:[{data:Object.values(st),backgroundColor:['#FF6F00','#F59E0B','#3B82F6','#22C55E'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#888',padding:15}}}}});
            new Chart(document.getElementById('c3'),{type:'line',data:{labels:top.map(i=>i[0]),datasets:[{label:'Occurrences',data:top.map(i=>i[1]),borderColor:'#FF6F00',backgroundColor:'rgba(255,111,0,0.1)',fill:true,tension:0.4,pointBackgroundColor:'#FF6F00'}]},options:o});
            const md=me.slice(0,8).map(m=>({name:m.full_name||m.username||'N/A',jobs:wo.filter(w=>w.mechanic==m.user).length||1}));
            new Chart(document.getElementById('c4'),{type:'polarArea',data:{labels:md.map(m=>m.name),datasets:[{data:md.map(m=>m.jobs),backgroundColor:['#FF6F00','#3B82F6','#22C55E','#8B5CF6','#F59E0B','#EF4444','#EC4899','#14B8A6'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#888',padding:10}}}}});
        },500);
    } catch(e) {
        document.getElementById('main-content').innerHTML = `<div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>Reports</h1></div><div class="empty-state"><i class="fas fa-chart-bar"></i><p>No data available. Create work orders and record payments to see reports.</p></div>`;
    }
}

// ===== AI =====
async function aid(){
    document.getElementById('main-content').innerHTML = `
        <div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>AI Diagnostics</h1></div>
        <div class="card" style="max-width:600px;">
            <div class="card-title"><i class="fas fa-robot"></i> Fault Code Analyzer</div>
            <div class="form-group"><label>OBD-II Fault Code</label><input id="ac" placeholder="e.g. P0300" maxlength="5" style="text-transform:uppercase;"></div>
            <div class="form-group"><label>Vehicle (optional)</label><input id="av" placeholder="e.g. Toyota Hilux 2018"></div>
            <button class="btn btn-primary" onclick="runAI()"><i class="fas fa-search"></i> Run Diagnosis</button>
            <div id="ar" style="margin-top:16px;"></div>
        </div>`;
}
async function runAI(){
    const c=document.getElementById('ac').value,v=document.getElementById('av').value,el=document.getElementById('ar');
    if(!c){el.innerHTML='<p style="color:var(--red);margin-top:12px;"><i class="fas fa-exclamation-circle"></i> Enter a fault code</p>';return;}
    el.innerHTML='<div style="text-align:center;padding:16px;"><div class="loading-spinner"></div><p style="color:var(--text2);margin-top:8px;">Analyzing...</p></div>';
    try{
        const d=await api('/ai/diagnose/','POST',{code:c,vehicle:v});
        const sc={Critical:'var(--red)',High:'var(--orange)',Medium:'var(--amber)',Low:'var(--green)'};
        el.innerHTML=`<div style="padding:18px;background:var(--surface2);border-radius:10px;border-left:3px solid ${sc[d.severity]||'var(--blue)'};margin-top:12px;"><h3 style="margin-bottom:6px;">${d.title}</h3><p style="font-size:12px;color:var(--text2);margin-bottom:12px;"><i class="fas fa-exclamation-triangle" style="color:${sc[d.severity]||'var(--blue)'};"></i> Severity: <strong>${d.severity}</strong> &middot; Est. Cost: <strong>${d.estimated_cost}</strong></p><ol style="padding-left:18px;font-size:13px;line-height:2;">${d.details.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
    }catch(e){el.innerHTML=`<p style="color:var(--red);margin-top:12px;"><i class="fas fa-exclamation-circle"></i> ${e.message}</p>`;}
}

// ===== NOTIFICATIONS =====
async function notif(){
    const list = L(await api('/notifications/'));
    const pc = {urgent:'var(--red)',high:'var(--orange)',medium:'var(--amber)',low:'var(--blue)'};
    document.getElementById('main-content').innerHTML = `
        <div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>Notifications</h1><button class="btn btn-outline" onclick="markAll()"><i class="fas fa-check-double"></i> Mark All Read</button></div>
        <div class="card">${list.length>0?list.map(n=>`<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);opacity:${n.is_read?0.5:1};"><span style="width:8px;height:8px;border-radius:50%;background:${pc[n.priority]||'var(--blue)'};flex-shrink:0;"></span><span style="flex:1;"><strong style="font-size:13px;">${n.title}</strong><span style="font-size:11px;color:var(--text2);display:block;">${n.message}</span></span><span style="font-size:10px;color:var(--text2);">${(n.created_at||'').substring(0,16)}</span>${!n.is_read?`<button class="btn btn-outline" style="font-size:10px;padding:4px 10px;" onclick="mr(${n.id})">Read</button>`:''}</div>`).join(''):'<div class="empty-state"><i class="fas fa-bell-slash"></i><p>No notifications</p></div>'}</div>`;
    window._nl = list;
}
async function mr(id){await api(`/notifications/${id}/`,'PATCH',{is_read:true});loadSection('notifications');}
async function markAll(){for(const n of (window._nl||[])){if(!n.is_read)await api(`/notifications/${n.id}/`,'PATCH',{is_read:true});}loadSection('notifications');}

// ===== SETTINGS =====
async function sett(){
    document.getElementById('main-content').innerHTML = `
        <div class="page-header"><button class="back-btn" onclick="backToDashboard()"><i class="fas fa-arrow-left"></i> Back</button><h1>Settings</h1></div>
        <div class="card" style="max-width:500px;">
            <div class="card-title"><i class="fas fa-info-circle"></i> System Information</div>
            <table style="width:100%;">
                <tr><td style="padding:8px 0;color:var(--text2);">Platform</td><td style="padding:8px 0;font-weight:500;">AutoGarage Pro v2.0</td></tr>
                <tr><td style="padding:8px 0;color:var(--text2);">API Endpoint</td><td class="text-mono" style="padding:8px 0;">${API}</td></tr>
                <tr><td style="padding:8px 0;color:var(--text2);">Status</td><td style="padding:8px 0;color:var(--green);"><i class="fas fa-circle" style="font-size:8px;"></i> Connected</td></tr>
            </table>
            <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px;">
                <button class="btn btn-outline" onclick="testConn()"><i class="fas fa-plug"></i> Test Connection</button>
                <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
            </div>
            <div id="tr" style="margin-top:12px;font-size:12px;"></div>
        </div>`;
}
async function testConn(){
    const el=document.getElementById('tr');el.innerHTML='<div class="loading-spinner"></div>';
    const s=Date.now();
    try{await api('/dashboard/');el.innerHTML=`<span style="color:var(--green);"><i class="fas fa-check-circle"></i> Connected (${Date.now()-s}ms)</span>`;}
    catch(e){el.innerHTML=`<span style="color:var(--red);"><i class="fas fa-times-circle"></i> ${e.message}</span>`;}
}

// ===== HELPERS =====
function FT(s,t){const q=document.getElementById(s).value.toLowerCase();document.querySelectorAll(`#${t} tr`).forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q)?'':'';});}
function logout(){localStorage.removeItem('token');window.location.href='/api/auth/login-page/';}

loadSection('dashboard');
</script>
