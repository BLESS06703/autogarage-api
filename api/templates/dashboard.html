<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoGarage Pro</title>
<style>
body{background:#0D0D0D;color:#E0E0E0;font-family:sans-serif;padding:40px;text-align:center}
h1{color:#FF6F00}
.btn{display:inline-block;background:#FF6F00;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600;margin-top:20px}
</style>
</head>
<body>
<h1>AutoGarage Pro</h1>
<div id="status">Checking...</div>
<script>
var token = localStorage.getItem('token');
if (!token) {
    document.getElementById('status').innerHTML = '<p>Please sign in to continue.</p><a href="/api/auth/login-page/" class="btn">Sign In</a>';
} else {
    document.getElementById('status').innerHTML = '<p style="color:#22C55E">Logged in!</p><p>Dashboard loading...</p>';
}
</script>
</body>
</html>
