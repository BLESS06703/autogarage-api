<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoGarage Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
--bg-primary:#0d0d0d;--bg-surface:#0f1b27;--text-main:#f2f2f2;--text-muted:#d9d9d9;
--accent-color:#bfafaf;--accent-hover:#cfbfbf;--border-subtle:rgba(217,217,217,0.15);
--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--yellow:#eab308;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-primary);color:var(--text-muted);font-family:system-ui,-apple-system,sans-serif;display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--bg-surface);border-right:1px solid var(--border-subtle);padding:16px;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;transition:transform 0.3s}
.sidebar-brand{font-size:16px;font-weight:700;color:var(--text-main);margin-bottom:16px;padding:4px 8px}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--text-muted);cursor:pointer;font-size:13px;border:none;background:none;width:100%;text-align:left;margin-bottom:1px;transition:0.15s}
.nav-item:hover{background:rgba(217,217,217,0.05);color:var(--text-main)}
.nav-item.active{background:var(--accent-color);color:var(--bg-primary);font-weight:600}
.nav-item i{width:16px;text-align:center;font-size:12px}
.nav-section{font-size:10px;color:var(--text-muted);letter-spacing:1.5px;margin:16px 0 6px 12px;text-transform:uppercase;font-weight:600;opacity:0.5}
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--bg-surface);color:var(--text-main);border:1px solid var(--border-subtle);width:38px;height:38px;border-radius:8px;font-size:16px;cursor:pointer}
.main{margin-left:240px;flex:1;padding:28px 32px;min-height:100vh}
.greeting-wrap{margin-bottom:20px}
.greeting-hi{font-size:13px;color:var(--text-muted)}
.greeting-name{font-size:24px;font-weight:700;color:var(--text-main);margin-top:3px}
.greeting-date{font-size:11px;color:var(--text-muted);margin-top:5px;opacity:0.7}
.section-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:22px 0 12px;opacity:0.7}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi-card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:18px;padding:20px;cursor:pointer;transition:0.15s}
.kpi-card:hover{border-color:var(--accent-color)}
.kpi-icon{font-size:18px;margin-bottom:8px;color:var(--accent-color)}
.kpi-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.kpi-value{font-size:26px;font-weight:700;font-family:monospace;color:var(--text-main)}
.kpi-context{font-size:11px;color:var(--text-muted);margin-top:6px;opacity:0.8}
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:18px;padding:22px}
.card-title{font-size:11px;font-weight:600;color:var(--text-main);margin-bottom:16px;text-transform:uppercase;letter-spacing:0.5px}
.btn{padding:9px 16px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:0.2s}
.btn-primary{background:var(--accent-color);color:var(--bg-primary)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-outline{background:transparent;color:var(--text-main);border:1px solid var(--border-subtle)}
.btn-outline:hover{background:rgba(217,217,217,0.05)}
.user-bar{position:fixed;top:12px;right:16px;z-index:90;display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:10px}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-color);display:flex;align-items:center;justify-content:center;color:var(--bg-primary);font-weight:600;font-size:12px}
.user-name{font-size:12px;color:var(--text-main)}
.user-garage{font-size:9px;color:var(--text-muted)}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--text-muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border-subtle)}
td{padding:10px 12px;border-bottom:1px solid var(--border-subtle);color:var(--text-main)}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:600}
.tag-active{background:rgba(34,197,94,0.1);color:var(--green)}
.tag-pending{background:rgba(245,158,11,0.1);color:var(--amber)}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.text-mono{font-family:'SF Mono',Consolas,Menlo,monospace}
.loading-spinner{width:24px;height:24px;border:2px solid var(--border-subtle);border-top-color:var(--accent-color);border-radius:50%;animation:spin 0.8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:40px;color:var(--text-muted)}
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.page-header h1{font-size:18px;font-weight:700;color:var(--text-main);flex:1}
.page-header h1 i{margin-right:8px;color:var(--accent-color)}
.back-btn{background:var(--bg-surface);color:var(--text-main);border:1px solid var(--border-subtle);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:300}
.modal{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:18px;padding:24px;width:90%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:600;color:var(--text-main);margin-bottom:18px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:9px 12px;background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:10px;color:var(--text-main);font-size:13px;outline:none;font-family:inherit}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent-color)}
.form-subhead{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px;opacity:0.7}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.fab{position:fixed;bottom:24px;right:24px;z-index:150;width:52px;height:52px;border-radius:50%;background:var(--accent-color);color:var(--bg-primary);border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center}
.fab-menu{position:fixed;bottom:88px;right:24px;z-index:150;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:14px;padding:6px;display:none;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,0.5);min-width:200px}
.fab-menu.open{display:flex}
.fab-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--text-main);border:none;background:none;width:100%;text-align:left}
.fab-item:hover{background:rgba(217,217,217,0.05)}
.fab-item i{width:16px;text-align:center}
.avatar-sm{width:38px;height:38px;border-radius:50%;background:var(--accent-color);color:var(--bg-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.avatar-ico{width:38px;height:38px;border-radius:12px;background:var(--bg-primary);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;cursor:pointer;transition:0.15s}
.list-row:not(:last-child){border-bottom:1px solid var(--border-subtle)}
.list-row:hover{background:rgba(217,217,217,0.04)}
.list-row-main{flex:1;min-width:0}
.list-row-title{font-size:14px;font-weight:600;color:var(--text-main)}
.list-row-sub{font-size:11px;color:var(--text-muted);margin-top:3px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px}
.bar-label{width:110px;color:var(--text-muted);flex-shrink:0}
.bar-track{flex:1;height:8px;background:rgba(217,217,217,0.08);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-value{width:64px;text-align:right;color:var(--text-main);font-weight:600;flex-shrink:0;font-family:monospace}
.activity-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-subtle);font-size:12px;color:var(--text-main)}
.activity-row:last-child{border-bottom:none}
.detail-row{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--border-subtle)}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--text-muted)}
.form-error{color:var(--red);font-size:11px;margin-top:10px}
@media(max-width:768px){
.hamburger{display:flex;align-items:center;justify-content:center}
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0!important;padding:56px 14px 80px 14px!important}
.kpi-grid{grid-template-columns:repeat(2,1fr)!important}
.content-grid{grid-template-columns:1fr!important}
.fab{bottom:16px;right:16px;width:44px;height:44px;font-size:20px}
.fab-menu{bottom:70px;right:16px}
.table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{font-size:11px}
th,td{padding:6px 8px;white-space:nowrap}
th{font-size:9px}
.kpi-value{font-size:20px}
.kpi-card{padding:14px}
.card{padding:16px}
.page-header h1{font-size:16px}
.user-bar{top:8px;right:8px;padding:4px 8px}
.user-name{font-size:11px}
.user-garage{font-size:8px}
}
</style>
</head>
<body>
<button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
<aside class="sidebar" id="sidebar">
<div class="sidebar-brand">AutoGarage Pro</div>
<button class="nav-item active" data-section="dashboard"><i class="fas fa-th-large"></i>Dashboard</button>
<div class="nav-section">Operations</div>
<button class="nav-item" data-section="customers"><i class="fas fa-users"></i>Customers</button>
<button class="nav-item" data-section="vehicles"><i class="fas fa-car"></i>Vehicles</button>
<button class="nav-item" data-section="appointments"><i class="fas fa-calendar-alt"></i>Appointments</button>
<button class="nav-item" data-section="workorders"><i class="fas fa-clipboard-list"></i>Work Orders</button>
<button class="nav-item" data-section="mechanics"><i class="fas fa-user-cog"></i>Mechanics</button>
<button class="nav-item" data-section="inventory"><i class="fas fa-boxes"></i>Inventory</button>
<div class="nav-section">Finance</div>
<button class="nav-item" data-section="invoices"><i class="fas fa-file-invoice"></i>Invoices</button>
<button class="nav-item" data-section="payments"><i class="fas fa-money-bill-wave"></i>Payments</button>
<button class="nav-item" data-section="reports"><i class="fas fa-chart-bar"></i>Reports</button>
<div class="nav-section">Smart Tools</div>
<button class="nav-item" data-section="ai"><i class="fas fa-robot"></i>AI Diagnostics</button>
<button class="nav-item" data-section="scanner"><i class="fas fa-camera"></i>Vehicle Scanner</button>
<button class="nav-item" data-section="notifications"><i class="fas fa-bell"></i>Notifications</button>
<div class="nav-section">Administration</div>
<button class="nav-item" data-section="users"><i class="fas fa-user-shield"></i>Users</button>
<button class="nav-item" data-section="settings"><i class="fas fa-cog"></i>Settings</button>
<button class="nav-item" data-section="help"><i class="fas fa-circle-question"></i>Help</button>
<div style="margin-top:auto;padding-top:12px">
<button class="nav-item" onclick="logout()" style="color:var(--red)"><i class="fas fa-sign-out-alt"></i>Sign Out</button>
</div>
</aside>
<div class="user-bar" id="userBar"><div class="user-avatar" id="userAvatar">U</div><div><div class="user-name" id="userName">User</div><div class="user-garage" id="garageName">Garage</div></div></div>
<main class="main" id="main-content">
<div id="debugBar" style="background:#333;color:#fff;padding:8px;font-size:11px;position:fixed;bottom:0;left:0;right:0;z-index:9999;text-align:center;"></div>
<script>
var dbg = document.getElementById('debugBar');
dbg.textContent = 'Token: ' + (localStorage.getItem('token') ? 'YES (' + localStorage.getItem('token').substring(0,20) + '...)' : 'NO');
if (localStorage.getItem('token')) {
    dbg.textContent += ' | Calling loadSection...';
    try { loadSection('dashboard'); dbg.textContent += ' DONE'; }
    catch(e) { dbg.textContent += ' ERROR: ' + e.message; }
} else {
    dbg.textContent += ' | Need login';
}
</script></main>
<button class="fab" onclick="toggleFab()">+</button>
<div class="fab-menu" id="fabMenu">
<button class="fab-item" onclick="toggleFab();openForm('workorder')"><i class="fas fa-clipboard-list"></i>New Work Order</button>
<button class="fab-item" onclick="toggleFab();openForm('customer')"><i class="fas fa-user-plus"></i>Register Customer</button>
<button class="fab-item" onclick="toggleFab();openForm('vehicle')"><i class="fas fa-car"></i>Register Vehicle</button>
<button class="fab-item" onclick="toggleFab();openForm('inventory')"><i class="fas fa-box"></i>Add Inventory</button>
<button class="fab-item" onclick="toggleFab();openForm('staff')"><i class="fas fa-user-plus"></i>Add Staff</button>
<button class="fab-item" onclick="toggleFab();openForm('invoice')"><i class="fas fa-file-invoice"></i>New Invoice</button>
</div>
<script>
var API='/api',token=localStorage.getItem('token');
var currentUser=JSON.parse(localStorage.getItem('user')||'{}');
if(currentUser.username){document.getElementById('userName').textContent=currentUser.username;document.getElementById('userAvatar').textContent=currentUser.username[0].toUpperCase();}
if(currentUser.garage_name)document.getElementById('garageName').textContent=currentUser.garage_name+(currentUser.role?' - '+currentUser.role:'');
function toggleSidebar(){var s=document.getElementById('sidebar');s.classList.toggle('open');document.getElementById('hamburgerBtn').innerHTML=s.classList.contains('open')?'<i class="fas fa-xmark"></i>':'<i class="fas fa-bars"></i>';}
function toggleFab(){document.getElementById('fabMenu').classList.toggle('open');}
document.querySelectorAll('.nav-item[data-section]').forEach(function(btn){
btn.addEventListener('click',function(){goSection(this.dataset.section);});
});
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function goSection(s){document.querySelectorAll('.nav-item[data-section]').forEach(function(el){el.classList.toggle('active',el.dataset.section===s);});document.getElementById('sidebar').classList.remove('open');document.getElementById('hamburgerBtn').innerHTML='<i class="fas fa-bars"></i>';loadSection(s);}
function greetName(){var h=new Date().getHours();return h<12?'Good Morning':h<18?'Good Afternoon':'Good Evening';}
function todayStr(){return new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function gGarageName(){return currentUser.garage_name||'AutoGarage Pro';}
var WO_STATUS_META={'In Progress':'#f59e0b','Awaiting Parts':'#eab308','Ready (Pending Invoice)':'#3b82f6','Completed':'#22c55e','Cancelled':'#ef4444'};
var INVC_STATUS_META={paid:'#22c55e',sent:'#3b82f6',draft:'#f59e0b'};
function statusBadge(status,metaMap){var dot=metaMap[status]||'#d9d9d9';return '<span class="tag" style="background:'+dot+'22;color:'+dot+'"><span class="status-dot" style="background:'+dot+'"></span>'+esc(status||'—')+'</span>';}
async function api(p,m,body){m=m||'GET';var opts={method:m,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}};if(body)opts.body=JSON.stringify(body);var res=await fetch(API+p,opts);var data=await res.json().catch(function(){return{};});if(!res.ok){throw new Error(apiErrorMessage(data,res.status));}return data;}
function apiErrorMessage(data,status){if(data&&(data.detail||data.message||data.error))return data.detail||data.message||data.error;var parts=[];if(data&&typeof data==='object'&&!Array.isArray(data)){Object.keys(data).forEach(function(k){var v=data[k];if(Array.isArray(v))parts.push(k+': '+v.join(' '));else if(typeof v==='string')parts.push(k+': '+v);});}return parts.length?parts.join(' | '):('Request failed ('+status+')');}
function L(d){return Array.isArray(d)?d:(d&&d.results?d.results:[]);}
async function openForm(type){
var _custList=[];
if(type==='vehicle'){try{_custList=L(await api('/customers/'));}catch(e){}
// Check if first time - show onboarding
if(cu.length===0 && ve.length===0 && wo.length===0){
setTimeout(function(){
var ov=document.createElement('div');ov.className='modal-overlay';ov.id='onboardingWizard';
ov.innerHTML='<div class="modal" style="max-width:600px;text-align:center"><h2 style="font-size:20px;margin-bottom:8px">Welcome to AutoGarage Pro!</h2><p style="color:var(--text-muted);margin-bottom:20px">Let us set up your garage in 3 quick steps.</p><div style="display:flex;gap:12px;margin-bottom:20px"><div style="flex:1;background:var(--bg-primary);padding:16px;border-radius:10px;border:1px solid var(--border-subtle)"><div style="font-size:28px;margin-bottom:8px">1</div><strong>Add Customers</strong><p style="font-size:11px;color:var(--text-muted);margin-top:4px">Register your first customer</p></div><div style="flex:1;background:var(--bg-primary);padding:16px;border-radius:10px;border:1px solid var(--border-subtle)"><div style="font-size:28px;margin-bottom:8px">2</div><strong>Register Vehicles</strong><p style="font-size:11px;color:var(--text-muted);margin-top:4px">Add customer vehicles</p></div><div style="flex:1;background:var(--bg-primary);padding:16px;border-radius:10px;border:1px solid var(--border-subtle)"><div style="font-size:28px;margin-bottom:8px">3</div><strong>Create Work Orders</strong><p style="font-size:11px;color:var(--text-muted);margin-top:4px">Start tracking repairs</p></div></div><button class="btn btn-primary" style="width:100%;margin-bottom:8px" onclick="document.getElementById('onboardingWizard').remove();openForm('customer')">Get Started — Add First Customer</button><button class="btn btn-outline" style="width:100%" onclick="document.getElementById('onboardingWizard').remove()">Skip for now</button></div>';
document.body.appendChild(ov);
ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
},800);
}}
var forms={
customer:{title:'Register Customer',fields:'<div class="form-group"><label>Full Name *</label><input id="cfName"></div><div class="form-group"><label>Phone</label><input id="cfPhone"></div>',create:async function(){var n=document.getElementById('cfName').value.trim();if(!n){alert('Name required');return;}await api('/customers/','POST',{full_name:n,phone:document.getElementById('cfPhone').value});document.querySelector('.modal-overlay').remove();loadSection('customers');}},
vehicle:{title:'Register Vehicle',fields:'<div class="form-group"><label>Customer *</label><select id="cfCustomer">'+(_custList.length?_custList.map(function(c){return '<option value="'+c.id+'">'+esc(c.full_name)+' ('+esc(c.phone||'')+')</option>';}).join(''):'<option value="">No customers yet — register one first</option>')+'</select></div><div class="form-group"><label>Make *</label><input id="cfMake"></div><div class="form-group"><label>Model *</label><input id="cfModel"></div><div class="form-group"><label>Plate *</label><input id="cfPlate"></div><div class="form-group"><label>Year *</label><input id="cfYear"></div>',create:async function(){var custId=document.getElementById('cfCustomer').value,mk=document.getElementById('cfMake').value.trim(),md=document.getElementById('cfModel').value.trim(),pl=document.getElementById('cfPlate').value.trim(),yr=document.getElementById('cfYear').value.trim();if(!custId){alert('Select a customer first');return;}if(!mk||!md||!pl||!yr){alert('Make, model, plate and year are required');return;}await api('/quick-vehicle/','POST',{make:mk,model_name:md,plate:pl,year:yr,customer_id:custId,mileage:0});document.querySelector('.modal-overlay').remove();loadSection('vehicles');}},

async function pay(){var list=L(await api('/payments/'));document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1><i class="fas fa-money-bill-wave"></i> Payments</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Ref</th><th>Amount</th><th>Method</th></tr></thead><tbody>'+(list.length?list.map(function(p){return'<tr><td class="text-mono">'+esc(p.transaction_ref)+'</td><td style="color:var(--green);font-weight:600">MWK '+parseFloat(p.amount).toLocaleString()+'</td><td>'+esc(p.payment_method)+'</td></tr>';}).join(''):'<tr><td colspan="3"><div class="empty-state"><p>No payments</p></div></td></tr>')+'</tbody></table></div></div>';}
async function invc(){var list=L(await api('/invoices/'));document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1><i class="fas fa-file-invoice"></i> Invoices</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Invoice #</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>'+(list.length?list.map(function(i){return'<tr><td class="text-mono">'+esc(i.invoice_number||('INV-'+i.id))+'</td><td>'+esc(i.customer_name)+'</td><td style="color:var(--green);font-weight:600">MWK '+parseFloat(i.total_amount).toLocaleString()+'</td><td>'+statusBadge(i.status,INVC_STATUS_META)+'</td></tr>';}).join(''):'<tr><td colspan="4"><div class="empty-state"><p>No invoices</p></div></td></tr>')+'</tbody></table></div></div>';}
async function rpt(){
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1><i class="fas fa-chart-bar"></i> Reports & Analytics</h1></div><div style="text-align:center;padding:40px"><div class="loading-spinner"></div></div>';
var woList=[],pa=[],me=[],loadErrors=[];
try{woList=L(await api('/work-orders/'));}catch(e){loadErrors.push('Work Orders ('+e.message+')');}
try{pa=L(await api('/payments/'));}catch(e){loadErrors.push('Payments ('+e.message+')');}
try{me=L(await api('/mechanics/'));}catch(e){loadErrors.push('Mechanics ('+e.message+')');}
if(!woList.length&&!pa.length&&loadErrors.length){document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1><i class="fas fa-chart-bar"></i> Reports & Analytics</h1></div><div class="empty-state"><p>Couldn\'t load report data: '+esc(loadErrors.join(' · '))+'</p></div>';return;}
var totalRev=pa.reduce(function(s,x){return s+(parseFloat(x.amount)||0);},0);
var completed=woList.filter(function(w){return w.status==='Completed';}).length;
var active=woList.filter(function(w){return w.status==='In Progress'||w.status==='Awaiting Parts';}).length;
var avgJob=completed>0?Math.round(totalRev/completed):0;
var byStatus={};woList.forEach(function(w){byStatus[w.status]=(byStatus[w.status]||0)+1;});
var byMethod={};pa.forEach(function(x){var k=x.payment_method||'Other';byMethod[k]=(byMethod[k]||0)+(parseFloat(x.amount)||0);});
var byIssue={};woList.forEach(function(w){var k=(w.issue_description||'General').trim().split(/\s+/).slice(0,3).join(' ')||'General';byIssue[k]=(byIssue[k]||0)+1;});
var topIssues=Object.keys(byIssue).map(function(k){return [k,byIssue[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
var byMechanic={};woList.forEach(function(w){if(w.mechanic==null)return;byMechanic[w.mechanic]=(byMechanic[w.mechanic]||0)+1;});
var mechLabels=me.length?me.map(function(m){return m.full_name||m.username||('#'+m.id);}):Object.keys(byMechanic);
var mechData=me.length?me.map(function(m){return byMechanic[m.id||m.user]||0;}):Object.values(byMechanic);
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1><i class="fas fa-chart-bar"></i> Reports & Analytics</h1></div>'
+(loadErrors.length?'<div style="color:var(--red);font-size:12px;margin-bottom:14px;padding:10px 14px;background:rgba(239,68,68,0.08);border-radius:10px">Some data failed to load: '+esc(loadErrors.join(' · '))+'</div>':'')
+'<div class="kpi-grid"><div class="kpi-card"><div class="kpi-label">Total Revenue</div><div class="kpi-value">MWK '+totalRev.toLocaleString()+'</div></div><div class="kpi-card"><div class="kpi-label">Completed Jobs</div><div class="kpi-value">'+completed+'</div></div><div class="kpi-card"><div class="kpi-label">Active Jobs</div><div class="kpi-value">'+active+'</div></div><div class="kpi-card"><div class="kpi-label">Avg Job Value</div><div class="kpi-value">MWK '+avgJob.toLocaleString()+'</div></div></div>'
+'<div class="content-grid"><div class="card"><div class="card-title">Revenue by Payment Method</div><div style="height:240px;position:relative">'+(Object.keys(byMethod).length?'<canvas id="r1"></canvas>':'<div class="empty-state"><p>No payments yet</p></div>')+'</div></div><div class="card"><div class="card-title">Job Status Distribution</div><div style="height:240px;position:relative">'+(Object.keys(byStatus).length?'<canvas id="r2"></canvas>':'<div class="empty-state"><p>No work orders yet</p></div>')+'</div></div></div>'
+'<div class="content-grid" style="margin-top:14px"><div class="card"><div class="card-title">Most Common Repairs</div><div style="height:240px;position:relative">'+(topIssues.length?'<canvas id="r3"></canvas>':'<div class="empty-state"><p>No work orders yet</p></div>')+'</div></div><div class="card"><div class="card-title">Mechanic Workload</div><div style="height:240px;position:relative">'+(mechLabels.length?'<canvas id="r4"></canvas>':'<div class="empty-state"><p>No mechanics on file</p></div>')+'</div></div></div>';
if(Object.keys(byMethod).length)new Chart(document.getElementById('r1'),{type:'bar',data:{labels:Object.keys(byMethod),datasets:[{label:'Revenue (MWK)',data:Object.values(byMethod),backgroundColor:'#bfafaf',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#d9d9d9'},grid:{color:'rgba(217,217,217,0.08)'}},y:{ticks:{color:'#d9d9d9'},grid:{color:'rgba(217,217,217,0.08)'}}}}});
if(Object.keys(byStatus).length)new Chart(document.getElementById('r2'),{type:'doughnut',data:{labels:Object.keys(byStatus),datasets:[{data:Object.values(byStatus),backgroundColor:Object.keys(byStatus).map(function(k){return WO_STATUS_META[k]||'#d9d9d9';})}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#d9d9d9',boxWidth:10,font:{size:11}}}}}});
if(topIssues.length)new Chart(document.getElementById('r3'),{type:'line',data:{labels:topIssues.map(function(i){return i[0];}),datasets:[{label:'Occurrences',data:topIssues.map(function(i){return i[1];}),borderColor:'#bfafaf',backgroundColor:'rgba(191,175,175,0.15)',fill:true,tension:0.35,pointBackgroundColor:'#bfafaf'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#d9d9d9',font:{size:10}},grid:{color:'rgba(217,217,217,0.08)'}},y:{ticks:{color:'#d9d9d9',stepSize:1},grid:{color:'rgba(217,217,217,0.08)'}}}}});
if(mechLabels.length)new Chart(document.getElementById('r4'),{type:'polarArea',data:{labels:mechLabels,datasets:[{data:mechData,backgroundColor:['#bfafaf','#3b82f6','#22c55e','#8b5cf6','#f59e0b','#ef4444','#ec4899','#14b8a6']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#d9d9d9',boxWidth:10,font:{size:11}}}}}});
}
async function aid(){document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1><i class="fas fa-robot"></i> AI Diagnostics</h1></div><div class="card" style="max-width:500px"><div class="card-title">Fault Code Analyzer</div><div class="form-group"><label>OBD-II Code</label><input id="ac" placeholder="e.g. P0300" maxlength="5" style="text-transform:uppercase"></div><div class="form-group"><label>Vehicle</label><input id="av" placeholder="e.g. Toyota Hilux"></div><button class="btn btn-primary" onclick="runAI()">Run Diagnosis</button><div id="ar" style="margin-top:12px"></div></div>';}
async function runAI(){var c=document.getElementById('ac').value,v=document.getElementById('av').value,el=document.getElementById('ar');if(!c){el.innerHTML='<p style="color:var(--red)">Enter a code</p>';return;}el.innerHTML='<div class="loading-spinner"></div>';try{var d=await api('/ai/diagnose/','POST',{code:c,vehicle:v});el.innerHTML='<div style="padding:14px;background:var(--bg-primary);border-radius:12px;margin-top:12px;border:1px solid var(--border-subtle)"><h3>'+esc(d.title)+'</h3><p style="font-size:12px;color:var(--text-muted);margin:6px 0">Severity: '+esc(d.severity)+' · Cost: '+esc(d.estimated_cost)+'</p><ol style="padding-left:16px;font-size:13px;line-height:2">'+d.details.map(function(x){return'<li>'+esc(x)+'</li>';}).join('')+'</ol></div>';}catch(e){el.innerHTML='<p style="color:var(--red)">'+esc(e.message)+'</p>';}}
async function scanner(){document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1><i class="fas fa-camera"></i> Vehicle Scanner</h1></div><div class="card" style="max-width:500px"><div class="card-title">Scan Plate / VIN</div><div id="scanArea" style="background:var(--bg-primary);border:1px solid var(--border-subtle);border-radius:14px;overflow:hidden;margin-bottom:14px;min-height:220px;display:flex;align-items:center;justify-content:center"><video id="scanVideo" autoplay playsinline style="width:100%;display:none"></video><div id="scanPlaceholder" style="color:var(--text-muted);font-size:12px;text-align:center;padding:20px"><i class="fas fa-camera" style="font-size:26px;display:block;margin-bottom:10px;color:var(--accent-color)"></i>Camera preview will appear here</div></div><canvas id="scanCanvas" style="display:none"></canvas><div style="display:flex;gap:8px"><button class="btn btn-primary" id="scanStartBtn" onclick="startScanner()">Start Camera</button><button class="btn btn-outline" id="scanCaptureBtn" style="display:none" onclick="captureScan()">Capture</button></div><div id="scanResult" style="margin-top:14px"></div></div>';}
var _scanStream=null;
async function startScanner(){var video=document.getElementById('scanVideo'),ph=document.getElementById('scanPlaceholder'),el=document.getElementById('scanResult');
try{_scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=_scanStream;video.style.display='block';ph.style.display='none';document.getElementById('scanStartBtn').style.display='none';document.getElementById('scanCaptureBtn').style.display='inline-flex';}
catch(e){el.innerHTML='<p style="color:var(--red)">Camera access failed: '+esc(e.message)+'</p>';}}
async function captureScan(){var video=document.getElementById('scanVideo'),canvas=document.getElementById('scanCanvas'),el=document.getElementById('scanResult');
canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);
var imageData=canvas.toDataURL('image/jpeg',0.85);
el.innerHTML='<div class="loading-spinner"></div>';
try{var d=await api('/vehicles/scan/','POST',{image:imageData});el.innerHTML='<div style="padding:14px;background:var(--bg-primary);border-radius:12px;border:1px solid var(--border-subtle)"><p style="font-size:13px"><strong>Plate:</strong> '+esc(d.plate||'Not detected')+'</p>'+(d.make?'<p style="font-size:13px;margin-top:4px"><strong>Vehicle:</strong> '+esc(d.make)+' '+esc(d.model||'')+'</p>':'')+'</div>';}
catch(e){el.innerHTML='<p style="color:var(--red);font-size:13px">'+esc(e.message)+'</p><p style="font-size:11px;color:var(--text-muted);margin-top:8px">This needs a /vehicles/scan/ endpoint on your backend that accepts a base64 image and returns detected plate/vehicle info.</p>';}
if(_scanStream){_scanStream.getTracks().forEach(function(t){t.stop();});_scanStream=null;}}
async function usersPage(){document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1><i class="fas fa-user-shield"></i> Users</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Username</th><th>Role</th><th>Status</th></tr></thead><tbody id="usersTbody"><tr><td colspan="3"><div class="loading-spinner"></div></td></tr></tbody></table></div></div><button class="btn btn-primary" style="margin-top:14px" onclick="openForm(\'user\')">+ Add User</button>';
try{var list=L(await api('/users/'));document.getElementById('usersTbody').innerHTML=list.length?list.map(function(u){return '<tr><td><strong>'+esc(u.username||u.full_name)+'</strong></td><td>'+esc(u.role||'—')+'</td><td><span class="tag '+(u.is_active?'tag-active':'tag-pending')+'">'+(u.is_active?'Active':'Inactive')+'</span></td></tr>';}).join(''):'<tr><td colspan="3"><div class="empty-state"><p>No users found</p></div></td></tr>';}
catch(e){document.getElementById('usersTbody').innerHTML='<tr><td colspan="3"><div class="empty-state"><p>Couldn\'t load users — this needs a /users/ endpoint on your backend ('+esc(e.message)+').</p></div></td></tr>';}}
async function helpPage(){document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1><i class="fas fa-circle-question"></i> Help</h1></div><div class="card"><div class="empty-state"><p>Need a hand? Reach out to your garage administrator.</p></div></div>';}
async function notif(){var list=L(await api('/notifications/'));document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1><i class="fas fa-bell"></i> Notifications</h1></div><div class="card">'+(list.length?list.map(function(n){return'<div style="padding:10px 0;border-bottom:1px solid var(--border-subtle);opacity:'+(n.is_read?0.5:1)+'"><strong>'+esc(n.title)+'</strong><div style="font-size:11px;color:var(--text-muted)">'+esc(n.message)+'</div></div>';}).join(''):'<div class="empty-state"><p>No notifications</p></div>')+'</div>';}
async function sett(){document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="goSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1><i class="fas fa-cog"></i> Settings</h1></div><div class="card" style="max-width:400px"><p>AutoGarage Pro v2.0</p><p style="color:var(--green)">Connected</p><p style="color:var(--text-muted)">PostgreSQL · Supabase</p><button class="btn btn-outline" style="width:100%;margin-top:16px" onclick="logout()">Sign Out</button></div>';}
function logout(){localStorage.removeItem('token');window.location.href='/api/auth/login-page/';}
if(token){loadSection('dashboard');}else{document.getElementById('main-content').innerHTML='<div style="text-align:center;padding:80px 20px"><h2 style="color:var(--text-main)">Sign In Required</h2><p style="color:var(--text-muted);margin:12px 0 20px">Please log in to access your dashboard.</p><a href="/api/auth/login-page/" class="btn btn-primary">Sign In</a></div>';}
</script>
