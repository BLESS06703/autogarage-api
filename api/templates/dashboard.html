<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoGarage Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
--bg:#0A0A0A;--surface:#161616;--surface2:#1E1E1E;--border:#252525;
--text:#E0E0E0;--text2:#777;--accent:#4A4A4A;--accent2:#5A5A5A;
--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#0a84ff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);padding:16px;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;transition:transform 0.3s}
.sidebar-brand{font-size:16px;font-weight:700;color:var(--text);margin-bottom:16px;padding:4px 8px;letter-spacing:-0.5px}
.sidebar-brand span{color:var(--accent2)}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;color:var(--text2);cursor:pointer;font-size:13px;border:none;background:none;width:100%;text-align:left;margin-bottom:1px;transition:0.15s}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--surface2);color:var(--text);font-weight:600}
.nav-item i{width:16px;text-align:center;font-size:12px;opacity:0.6}
.nav-section{font-size:10px;color:var(--text2);letter-spacing:1.5px;margin:16px 0 6px 12px;text-transform:uppercase;font-weight:600;opacity:0.5}
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--surface);color:var(--text);border:1px solid var(--border);width:38px;height:38px;border-radius:6px;font-size:16px;cursor:pointer}
.main{margin-left:240px;flex:1;padding:24px 28px;min-height:100vh}
.welcome{margin-bottom:24px}
.welcome-greeting{font-size:13px;color:var(--text2)}
.welcome-name{font-size:22px;font-weight:700;margin-top:2px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:0.15s}
.kpi-card:hover{border-color:var(--accent)}
.kpi-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.kpi-value{font-size:28px;font-weight:700;font-family:'SF Mono',monospace;color:var(--text)}
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.card-title{font-size:11px;font-weight:600;color:var(--text);margin-bottom:14px;text-transform:uppercase;letter-spacing:0.5px}
.btn{padding:9px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn-primary{background:var(--text);color:var(--bg)}
.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{background:var(--surface2)}
.user-bar{position:fixed;top:12px;right:16px;z-index:90;display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--text);font-weight:600;font-size:12px}
.user-name{font-size:12px;color:var(--text)}
.user-garage{font-size:9px;color:var(--text2)}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--text2);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
.tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:500}
.tag-active{background:rgba(34,197,94,0.1);color:var(--green)}
.tag-pending{background:rgba(245,158,11,0.1);color:var(--amber)}
.loading-spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--text2);border-radius:50%;animation:spin 0.8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:40px;color:var(--text2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:300}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:90%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:600;margin-bottom:18px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.form-group input,.form-group textarea{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none;font-family:inherit}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent2)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.page-header h1{font-size:18px;font-weight:700;flex:1}
.back-btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px}
.fab{position:fixed;bottom:24px;right:24px;z-index:150;width:52px;height:52px;border-radius:50%;background:var(--text);color:var(--bg);border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center}
.fab-menu{position:fixed;bottom:88px;right:24px;z-index:150;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px;display:none;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,0.5);min-width:200px}
.fab-menu.open{display:flex}
.fab-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text);border:none;background:none;width:100%;text-align:left}
.fab-item:hover{background:var(--surface2)}
.fab-item i{width:16px;text-align:center;opacity:0.5}
@media(max-width:768px){
.hamburger{display:flex;align-items:center;justify-content:center}
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0!important;padding:56px 12px 80px 12px!important}
.kpi-grid{grid-template-columns:repeat(2,1fr)!important}
.content-grid{grid-template-columns:1fr!important}
.fab{bottom:16px;right:16px;width:44px;height:44px;font-size:20px}
.fab-menu{bottom:70px;right:16px}
}
</style>
</head>
<body>
<button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()">☰</button>
<aside class="sidebar" id="sidebar">
<div class="sidebar-brand">AutoGarage<span>Pro</span></div>
<button class="nav-item active" data-section="dashboard"><i class="fas fa-th-large"></i>Dashboard</button>
<div class="nav-section">Operations</div>
<button class="nav-item" data-section="customers"><i class="fas fa-users"></i>Customers</button>
<button class="nav-item" data-section="vehicles"><i class="fas fa-car"></i>Vehicles</button>
<button class="nav-item" data-section="appointments"><i class="fas fa-calendar-alt"></i>Appointments</button>
<button class="nav-item" data-section="workorders"><i class="fas fa-clipboard-list"></i>Work Orders</button>
<button class="nav-item" data-section="mechanics"><i class="fas fa-user-cog"></i>Mechanics</button>
<button class="nav-item" data-section="inventory"><i class="fas fa-boxes"></i>Inventory</button>
<div class="nav-section">Finance</div>
<button class="nav-item" data-section="invoices"><i class="fas fa-file-invoice"></i>Invoices</button>
<button class="nav-item" data-section="payments"><i class="fas fa-money-bill-wave"></i>Payments</button>
<button class="nav-item" data-section="reports"><i class="fas fa-chart-bar"></i>Reports</button>
<div class="nav-section">Smart Tools</div>
<button class="nav-item" data-section="ai"><i class="fas fa-robot"></i>AI Diagnostics</button>
<button class="nav-item" data-section="notifications"><i class="fas fa-bell"></i>Notifications</button>
<div class="nav-section">System</div>
<button class="nav-item" data-section="settings"><i class="fas fa-cog"></i>Settings</button>
<div style="margin-top:auto;padding-top:12px">
<button class="nav-item" onclick="logout()" style="color:var(--red)"><i class="fas fa-sign-out-alt"></i>Sign Out</button>
</div>
</aside>
<div class="user-bar" id="userBar"><div class="user-avatar" id="userAvatar">U</div><div><div class="user-name" id="userName">User</div><div class="user-garage" id="garageName">Garage</div></div></div>
<main class="main" id="main-content"></main>
<button class="fab" onclick="toggleFab()">+</button>
<div class="fab-menu" id="fabMenu">
<button class="fab-item" onclick="toggleFab();openForm('workorder')"><i class="fas fa-clipboard-list"></i>New Work Order</button>
<button class="fab-item" onclick="toggleFab();openForm('customer')"><i class="fas fa-user-plus"></i>Register Customer</button>
<button class="fab-item" onclick="toggleFab();openForm('vehicle')"><i class="fas fa-car"></i>Register Vehicle</button>
<button class="fab-item" onclick="toggleFab();openForm('inventory')"><i class="fas fa-box"></i>Add Inventory</button>
</div>
<script>
var API='/api',token=localStorage.getItem('token');

(function(){
var d=JSON.parse(localStorage.getItem('user')||'{}');
if(d.username){document.getElementById('userName').textContent=d.username;document.getElementById('userAvatar').textContent=d.username[0].toUpperCase();}
if(d.garage_name)document.getElementById('garageName').textContent=d.garage_name+(d.role?' • '+d.role:'');
})();

function toggleSidebar(){var s=document.getElementById('sidebar');s.classList.toggle('open');document.getElementById('hamburgerBtn').innerHTML=s.classList.contains('open')?'✕':'☰';}
function toggleFab(){document.getElementById('fabMenu').classList.toggle('open');}

document.querySelectorAll('.nav-item[data-section]').forEach(function(btn){
btn.addEventListener('click',function(){
document.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('active');});
this.classList.add('active');
document.getElementById('sidebar').classList.remove('open');
loadSection(this.dataset.section);
});
});

async function api(p,m,body){
m=m||'GET';
var opts={method:m,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}};
if(body)opts.body=JSON.stringify(body);
var res=await fetch(API+p,opts);
return res.json();
}
function L(d){return Array.isArray(d)?d:(d&&d.results?d.results:[]);}

function openForm(type){
var forms={
customer:{title:'Register Customer',fields:'<div class="form-group"><label>Full Name *</label><input id="cfName"></div><div class="form-group"><label>Phone</label><input id="cfPhone"></div>',
create:async function(){
var n=document.getElementById('cfName').value.trim();
if(!n){alert('Name required');return;}
await api('/customers/','POST',{full_name:n,phone:document.getElementById('cfPhone').value});
document.querySelector('.modal-overlay').remove();loadSection('customers');
}},
vehicle:{title:'Register Vehicle',fields:'<div class="form-group"><label>Make *</label><input id="cfMake"></div><div class="form-group"><label>Model</label><input id="cfModel"></div><div class="form-group"><label>Plate *</label><input id="cfPlate"></div><div class="form-group"><label>Year</label><input id="cfYear"></div>',
create:async function(){
var mk=document.getElementById('cfMake').value.trim(),pl=document.getElementById('cfPlate').value.trim();
if(!mk||!pl){alert('Make and plate required');return;}
await api('/vehicles/','POST',{make:mk,model_name:document.getElementById('cfModel').value,plate:pl,year:document.getElementById('cfYear').value,mileage:0});
document.querySelector('.modal-overlay').remove();loadSection('vehicles');
}},
inventory:{title:'Add Inventory',fields:'<div class="form-group"><label>Part Name *</label><input id="cfPart"></div><div class="form-group"><label>Quantity</label><input id="cfQty" type="number" value="1"></div><div class="form-group"><label>Min Threshold</label><input id="cfMin" type="number" value="5"></div><div class="form-group"><label>Unit Price (MWK)</label><input id="cfPrice" type="number" value="0"></div>',
create:async function(){
var n=document.getElementById('cfPart').value.trim();
if(!n){alert('Part name required');return;}
await api('/inventory/','POST',{part_name:n,quantity:parseInt(document.getElementById('cfQty').value)||1,min_threshold:parseInt(document.getElementById('cfMin').value)||5,unit_price:parseFloat(document.getElementById('cfPrice').value)||0});
document.querySelector('.modal-overlay').remove();loadSection('inventory');
}},
workorder:{title:'New Work Order',fields:'<div class="form-group"><label>Vehicle *</label><input id="cfVeh"></div><div class="form-group"><label>Customer *</label><input id="cfCust"></div><div class="form-group"><label>Issue</label><textarea id="cfIssue"></textarea></div><div class="form-group"><label>Cost (MWK)</label><input id="cfCost" type="number" value="0"></div>',
create:async function(){
var v=document.getElementById('cfVeh').value.trim(),c=document.getElementById('cfCust').value.trim();
if(!v||!c){alert('Vehicle and customer required');return;}
await api('/work-orders/','POST',{vehicle_info:v,customer_name:c,issue_description:document.getElementById('cfIssue').value,cost_estimate:parseFloat(document.getElementById('cfCost').value)||0});
document.querySelector('.modal-overlay').remove();loadSection('workorders');
}}
};
var f=forms[type];if(!f)return;
var ov=document.createElement('div');ov.className='modal-overlay';
ov.innerHTML='<div class="modal"><div class="modal-title">'+f.title+'</div>'+f.fields+'<div class="form-actions"><button class="btn btn-outline" onclick="this.closest(\\'.modal-overlay\\').remove()">Cancel</button><button class="btn btn-primary" id="fbSubmit">Create</button></div></div>';
document.body.appendChild(ov);
document.getElementById('fbSubmit').addEventListener('click',function(){f.create();});
ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
}

async function loadSection(s){
var m=document.getElementById('main-content');
m.innerHTML='<div class="loading-spinner"></div>';
try{
if(s==='dashboard')await dash();else if(s==='workorders')await wo();else if(s==='customers')await cust();
else if(s==='vehicles')await veh();else if(s==='mechanics')await mech();else if(s==='inventory')await inv();
else if(s==='appointments')await appt();else if(s==='payments')await pay();else if(s==='invoices')await invc();
else if(s==='reports')await rpt();else if(s==='ai')await aid();else if(s==='notifications')await notif();
else if(s==='settings')await sett();
}catch(e){m.innerHTML='<div class="empty-state"><p>Error: '+e.message+'</p></div>';}
}

async function dash(){
document.getElementById('main-content').innerHTML='<div class="welcome"><div class="welcome-greeting">Good Day</div><div class="welcome-name">AutoGarage Pro</div></div><div class="kpi-grid"><div class="kpi-card" onclick="loadSection(\'customers\')"><div class="kpi-label">Customers</div><div class="kpi-value" id="k1">-</div></div><div class="kpi-card" onclick="loadSection(\'vehicles\')"><div class="kpi-label">Vehicles</div><div class="kpi-value" id="k2">-</div></div><div class="kpi-card" onclick="loadSection(\'workorders\')"><div class="kpi-label">Active Jobs</div><div class="kpi-value" id="k3">-</div></div><div class="kpi-card" onclick="loadSection(\'reports\')"><div class="kpi-label">Revenue</div><div class="kpi-value" id="k4">-</div></div></div><div class="content-grid"><div class="card"><div class="card-title">Quick Actions</div><button class="btn btn-primary" style="width:100%;margin-bottom:8px" onclick="openForm(\'workorder\')">New Work Order</button><button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="openForm(\'customer\')">Register Customer</button><button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="openForm(\'vehicle\')">Register Vehicle</button><button class="btn btn-outline" style="width:100%" onclick="openForm(\'inventory\')">Add Inventory</button></div></div>';
try{
var o=await api('/work-orders/'),c=await api('/customers/'),v=await api('/vehicles/'),p=await api('/payments/');
var wo=L(o),cu=L(c),ve=L(v),pa=L(p);
document.getElementById('k1').textContent=cu.length;
document.getElementById('k2').textContent=ve.length;
document.getElementById('k3').textContent=wo.filter(function(w){return w.status==='In Progress'||w.status==='Awaiting Parts';}).length;
document.getElementById('k4').textContent='MWK '+pa.reduce(function(s,p){return s+(parseFloat(p.amount)||0);},0).toLocaleString();
}catch(e){}
}

async function wo(){
var list=L(await api('/work-orders/'));
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Work Orders</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>SRN</th><th>Vehicle</th><th>Status</th><th>Cost</th></tr></thead><tbody>'+(list.length?list.map(function(w){var sc={'In Progress':'tag-active','Awaiting Parts':'tag-pending','Ready (Pending Invoice)':'tag-pending','Completed':'tag-active'};return'<tr><td class="text-mono">'+(w.srn||'BG-'+w.id)+'</td><td>'+(w.vehicle_info||w.vehicle||'--')+'</td><td><span class="tag '+(sc[w.status]||'')+'">'+w.status+'</span></td><td>MWK '+parseFloat(w.cost_estimate||0).toLocaleString()+'</td></tr>';}).join(''):'<tr><td colspan="4"><div class="empty-state"><p>No work orders</p></div></td></tr>')+'</tbody></table></div></div>';
}

async function cust(){
var list=L(await api('/customers/'));
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Customers</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Ref</th></tr></thead><tbody>'+(list.length?list.map(function(c){return'<tr><td><strong>'+c.full_name+'</strong></td><td>'+c.phone+'</td><td>'+c.email+'</td><td class="text-mono">'+c.reference_number+'</td></tr>';}).join(''):'<tr><td colspan="4"><div class="empty-state"><p>No customers</p></div></td></tr>')+'</tbody></table></div></div>';
}

async function veh(){
var list=L(await api('/vehicles/'));
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Vehicles</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Make</th><th>Model</th><th>Plate</th><th>Year</th></tr></thead><tbody>'+(list.length?list.map(function(v){return'<tr><td>'+v.make+'</td><td>'+v.model_name+'</td><td class="text-mono">'+v.plate+'</td><td>'+v.year+'</td></tr>';}).join(''):'<tr><td colspan="4"><div class="empty-state"><p>No vehicles</p></div></td></tr>')+'</tbody></table></div></div>';
}

async function mech(){
var list=L(await api('/mechanics/'));
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Mechanics</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Name</th><th>Skills</th><th>Status</th></tr></thead><tbody>'+(list.length?list.map(function(m){return'<tr><td><strong>'+(m.full_name||m.username)+'</strong></td><td>'+m.skills+'</td><td><span class="tag '+(m.is_available?'tag-active':'tag-pending')+'">'+(m.is_available?'Available':'Busy')+'</span></td></tr>';}).join(''):'<tr><td colspan="3"><div class="empty-state"><p>No mechanics</p></div></td></tr>')+'</tbody></table></div></div>';
}

async function inv(){
var list=L(await api('/inventory/'));
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Inventory</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Part</th><th>Qty</th><th>Min</th><th>Price</th></tr></thead><tbody>'+(list.length?list.map(function(i){var lo=i.quantity<i.min_threshold;return'<tr><td><strong>'+i.part_name+'</strong></td><td style="color:'+(lo?'var(--red)':'var(--green)')+';font-weight:600">'+i.quantity+'</td><td>'+i.min_threshold+'</td><td>MWK '+parseFloat(i.unit_price||0).toLocaleString()+'</td></tr>';}).join(''):'<tr><td colspan="4"><div class="empty-state"><p>No items</p></div></td></tr>')+'</tbody></table></div></div>';
}

async function appt(){
var list=L(await api('/appointments/'));
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Appointments</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Date</th><th>Time</th><th>Customer</th><th>Reason</th></tr></thead><tbody>'+(list.length?list.map(function(a){return'<tr><td>'+a.date+'</td><td>'+a.time+'</td><td>'+a.customer+'</td><td>'+a.reason+'</td></tr>';}).join(''):'<tr><td colspan="4"><div class="empty-state"><p>No appointments</p></div></td></tr>')+'</tbody></table></div></div>';
}

async function pay(){
var list=L(await api('/payments/'));
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Payments</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Ref</th><th>Amount</th><th>Method</th></tr></thead><tbody>'+(list.length?list.map(function(p){return'<tr><td class="text-mono">'+p.transaction_ref+'</td><td style="color:var(--green);font-weight:600">MWK '+parseFloat(p.amount).toLocaleString()+'</td><td>'+p.payment_method+'</td></tr>';}).join(''):'<tr><td colspan="3"><div class="empty-state"><p>No payments</p></div></td></tr>')+'</tbody></table></div></div>';
}

async function invc(){
var list=L(await api('/invoices/'));
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Invoices</h1></div><div class="card"><div class="table-wrapper"><table><thead><tr><th>Invoice #</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>'+(list.length?list.map(function(i){var sc={paid:'tag-active',sent:'tag-pending',draft:'tag-pending'};return'<tr><td class="text-mono">'+(i.invoice_number||'INV-'+i.id)+'</td><td>'+i.customer_name+'</td><td style="color:var(--green);font-weight:600">MWK '+parseFloat(i.total_amount).toLocaleString()+'</td><td><span class="tag '+sc[i.status]+'">'+i.status.toUpperCase()+'</span></td></tr>';}).join(''):'<tr><td colspan="4"><div class="empty-state"><p>No invoices</p></div></td></tr>')+'</tbody></table></div></div>';
}

async function rpt(){
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Reports</h1></div><div class="empty-state"><p>Coming soon</p></div>';
}

async function aid(){
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>AI Diagnostics</h1></div><div class="card" style="max-width:500px"><div class="card-title">Fault Code Analyzer</div><div class="form-group"><label>OBD-II Code</label><input id="ac" placeholder="e.g. P0300" maxlength="5" style="text-transform:uppercase"></div><div class="form-group"><label>Vehicle</label><input id="av" placeholder="e.g. Toyota Hilux"></div><button class="btn btn-primary" onclick="runAI()">Run Diagnosis</button><div id="ar" style="margin-top:12px"></div></div>';
}
async function runAI(){
var c=document.getElementById('ac').value,v=document.getElementById('av').value,el=document.getElementById('ar');
if(!c){el.innerHTML='<p style="color:var(--red)">Enter a code</p>';return;}
el.innerHTML='<div class="loading-spinner"></div>';
try{
var d=await api('/ai/diagnose/','POST',{code:c,vehicle:v});
el.innerHTML='<div style="padding:14px;background:var(--surface2);border-radius:8px;margin-top:12px"><h3>'+d.title+'</h3><p style="font-size:12px;color:var(--text2);margin:6px 0">Severity: '+d.severity+' · Cost: '+d.estimated_cost+'</p><ol style="padding-left:16px;font-size:13px;line-height:2">'+d.details.map(function(x){return'<li>'+x+'</li>';}).join('')+'</ol></div>';
}catch(e){el.innerHTML='<p style="color:var(--red)">'+e.message+'</p>';}
}

async function notif(){
var list=L(await api('/notifications/'));
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Notifications</h1></div><div class="card">'+(list.length?list.map(function(n){return'<div style="padding:10px 0;border-bottom:1px solid var(--border);opacity:'+(n.is_read?0.5:1)+'"><strong>'+n.title+'</strong><div style="font-size:11px;color:var(--text2)">'+n.message+'</div></div>';}).join(''):'<div class="empty-state"><p>No notifications</p></div>')+'</div>';
}

async function sett(){
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Settings</h1></div><div class="card" style="max-width:400px"><p>AutoGarage Pro v2.0</p><p style="color:var(--green)">Connected</p><p style="color:var(--text2)">PostgreSQL · Supabase</p><button class="btn btn-outline" style="width:100%;margin-top:16px" onclick="logout()">Sign Out</button></div>';
}

function logout(){localStorage.removeItem('token');window.location.href='/api/auth/login-page/';}

if(token){loadSection('dashboard');}else{document.getElementById('main-content').innerHTML='<div style="text-align:center;padding:80px 20px"><h2>Sign In Required</h2><p style="color:var(--text2);margin:12px 0 20px">Please log in to access your dashboard.</p><a href="/api/auth/login-page/" class="btn btn-primary">Sign In</a></div>';}
</script>
