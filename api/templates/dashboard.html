<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGarage Pro - Dashboard</title>
    <style>
        :root {
            --bg: #0D0D0D;
            --surface: #1A1A1A;
            --surface2: #242424;
            --border: #2A2A2A;
            --text: #E0E0E0;
            --text2: #888888;
            --orange: #FF6F00;
            --green: #22C55E;
            --red: #EF4444;
            --blue: #3B82F6;
            --amber: #F59E0B;
            --purple: #8B5CF6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar-brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--orange);
            margin-bottom: 4px;
        }

        .sidebar-version {
            font-size: 10px;
            color: var(--text2);
            margin-bottom: 24px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text2);
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 2px;
            transition: all 0.15s;
            text-decoration: none;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover { background: var(--surface2); color: var(--text); }
        .nav-item.active { background: var(--orange); color: #fff; font-weight: 600; }

        .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .nav-section {
            font-size: 10px;
            color: var(--text2);
            letter-spacing: 1.5px;
            margin: 20px 0 8px 12px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* MAIN */
        .main {
            margin-left: 260px;
            flex: 1;
            padding: 28px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .header-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            color: var(--green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            margin-right: 6px;
        }

        /* KPIs */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 28px;
        }

        .kpi-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        .kpi-label {
            font-size: 11px;
            color: var(--text2);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 700;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
        }

        .kpi-sub {
            font-size: 11px;
            color: var(--text2);
            margin-top: 4px;
        }

        .kpi-green { color: var(--green); }
        .kpi-orange { color: var(--orange); }
        .kpi-blue { color: var(--blue); }
        .kpi-purple { color: var(--purple); }

        /* GRID */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 28px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .card-empty {
            color: var(--text2);
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
        }

        /* PROGRESS BARS */
        .progress-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .progress-label {
            width: 110px;
            font-size: 12px;
            color: var(--text2);
            flex-shrink: 0;
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: var(--surface2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s;
        }

        .progress-count {
            font-size: 12px;
            font-weight: 600;
            font-family: 'SF Mono', 'Consolas', monospace;
            width: 28px;
            text-align: right;
            flex-shrink: 0;
        }

        /* TABLE */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 10px 12px;
            color: var(--text2);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }

        tr:hover td { background: rgba(255,255,255,0.02); }

        /* STATUS TAGS */
        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .tag-progress { background: rgba(255,111,0,0.15); color: var(--orange); }
        .tag-parts { background: rgba(245,158,11,0.15); color: var(--amber); }
        .tag-invoice { background: rgba(59,130,246,0.15); color: var(--blue); }
        .tag-done { background: rgba(34,197,94,0.15); color: var(--green); }

        /* ACTIVITY */
        .activity-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .activity-item:last-child { border-bottom: none; }

        .activity-marker {
            width: 24px; height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .marker-done { background: var(--green); color: #000; }
        .marker-progress { background: var(--orange); color: #fff; }
        .marker-info { background: var(--blue); color: #fff; }

        /* FULL WIDTH */
        .full-width { grid-column: 1 / -1; }

        /* MOBILE */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; padding: 16px; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-brand">AutoGarage Pro</div>
    <div class="sidebar-version">Management Console v2.0</div>

    <button class="nav-item active" onclick="showSection('dashboard')">
        <span class="nav-icon">&#9632;</span> Dashboard
    </button>
    <button class="nav-item" onclick="showSection('garages')">
        <span class="nav-icon">&#9632;</span> Garages
    </button>
    <button class="nav-item" onclick="showSection('customers')">
        <span class="nav-icon">&#9632;</span> Customers
    </button>
    <button class="nav-item" onclick="showSection('vehicles')">
        <span class="nav-icon">&#9632;</span> Vehicles
    </button>
    <button class="nav-item" onclick="showSection('appointments')">
        <span class="nav-icon">&#9632;</span> Appointments
    </button>

    <div class="nav-section">Operations</div>
    <button class="nav-item" onclick="showSection('workorders')">
        <span class="nav-icon">&#9632;</span> Work Orders
    </button>
    <button class="nav-item" onclick="showSection('mechanics')">
        <span class="nav-icon">&#9632;</span> Mechanics
    </button>
    <button class="nav-item" onclick="showSection('inventory')">
        <span class="nav-icon">&#9632;</span> Inventory
    </button>

    <div class="nav-section">Finance</div>
    <button class="nav-item" onclick="showSection('payments')">
        <span class="nav-icon">&#9632;</span> Payments
    </button>
    <button class="nav-item" onclick="showSection('invoices')">
        <span class="nav-icon">&#9632;</span> Invoices
    </button>
    <button class="nav-item" onclick="showSection('reports')">
        <span class="nav-icon">&#9632;</span> Reports
    </button>

    <div class="nav-section">System</div>
    <button class="nav-item" onclick="showSection('settings')">
        <span class="nav-icon">&#9632;</span> Settings
    </button>

    <div style="margin-top: auto; padding-top: 20px;">
        <button class="nav-item" onclick="logout()" style="color: var(--red);">
            <span class="nav-icon">&#9632;</span> Sign Out
        </button>
    </div>
</aside>

<main class="main" id="main-content"></main>

<script>
    const API = '/api';
    const token = localStorage.getItem('token');

    if (!token) {
        window.location.href = '/api/auth/login-page/';
    }

    async function api(path) {
        const res = await fetch(`${API}${path}`, {
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        });
        return res.json();
    }

    async function loadDashboard() {
        try {
            const [orders, inventory, appointments, customers, mechanics, payments] = await Promise.all([
                api('/work-orders/').catch(() => []),
                api('/inventory/').catch(() => []),
                api('/appointments/').catch(() => []),
                api('/customers/').catch(() => []),
                api('/mechanics/').catch(() => []),
                api('/payments/').catch(() => [])
            ]);

            const woList = Array.isArray(orders) ? orders : (orders.results || []);
            const invList = Array.isArray(inventory) ? inventory : (inventory.results || []);
            const apptList = Array.isArray(appointments) ? appointments : (appointments.results || []);
            const custList = Array.isArray(customers) ? customers : (customers.results || []);
            const mechList = Array.isArray(mechanics) ? mechanics : (mechanics.results || []);
            const payList = Array.isArray(payments) ? payments : (payments.results || []);

            const activeJobs = woList.filter(w => w.status === 'In Progress' || w.status === 'Awaiting Parts').length;
            const pendingInvoice = woList.filter(w => w.status === 'Ready (Pending Invoice)').length;
            const completedJobs = woList.filter(w => w.status === 'Completed').length;
            const totalRevenue = payList.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);

            const inProgress = woList.filter(w => w.status === 'In Progress').length;
            const awaitingParts = woList.filter(w => w.status === 'Awaiting Parts').length;
            const readyInvoice = woList.filter(w => w.status === 'Ready (Pending Invoice)').length;
            const completed = completedJobs;
            const maxJobs = Math.max(inProgress, awaitingParts, readyInvoice, completed, 1);

            const lowStockItems = invList.filter(i => i.quantity < i.min_threshold);
            const availableMechanics = mechList.filter(m => m.is_available).length;

            document.getElementById('main-content').innerHTML = `
                <div class="header">
                    <h1 class="header-title">Dashboard</h1>
                    <span class="status-badge"><span class="status-dot"></span>System Active</span>
                </div>

                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-label">Customers</div>
                        <div class="kpi-value kpi-blue">${custList.length}</div>
                        <div class="kpi-sub">Registered accounts</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Active Jobs</div>
                        <div class="kpi-value kpi-orange">${activeJobs}</div>
                        <div class="kpi-sub">${pendingInvoice} pending invoice</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Revenue</div>
                        <div class="kpi-value kpi-green">MWK ${totalRevenue.toLocaleString()}</div>
                        <div class="kpi-sub">${completedJobs} jobs completed</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-label">Mechanics</div>
                        <div class="kpi-value kpi-purple">${mechList.length}</div>
                        <div class="kpi-sub">${availableMechanics} available today</div>
                    </div>
                </div>

                <div class="content-grid">
                    <div class="card">
                        <div class="card-title">Work Order Status</div>
                        <div class="progress-item">
                            <span class="progress-label">In Progress</span>
                            <div class="progress-bar"><div class="progress-fill" style="width:${(inProgress/maxJobs*100)}%;background:var(--orange);"></div></div>
                            <span class="progress-count">${inProgress}</span>
                        </div>
                        <div class="progress-item">
                            <span class="progress-label">Awaiting Parts</span>
                            <div class="progress-bar"><div class="progress-fill" style="width:${(awaitingParts/maxJobs*100)}%;background:var(--amber);"></div></div>
                            <span class="progress-count">${awaitingParts}</span>
                        </div>
                        <div class="progress-item">
                            <span class="progress-label">Pending Invoice</span>
                            <div class="progress-bar"><div class="progress-fill" style="width:${(readyInvoice/maxJobs*100)}%;background:var(--blue);"></div></div>
                            <span class="progress-count">${readyInvoice}</span>
                        </div>
                        <div class="progress-item">
                            <span class="progress-label">Completed</span>
                            <div class="progress-bar"><div class="progress-fill" style="width:${(completed/maxJobs*100)}%;background:var(--green);"></div></div>
                            <span class="progress-count">${completed}</span>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">Appointments</div>
                        ${apptList.slice(0, 5).length > 0 ? `
                            <div class="table-wrapper">
                                <table>
                                    <thead><tr><th>Time</th><th>Customer</th><th>Reason</th></tr></thead>
                                    <tbody>
                                        ${apptList.slice(0, 5).map(a => `
                                            <tr>
                                                <td style="color:var(--orange);font-family:monospace;">${a.time || '--:--'}</td>
                                                <td>${a.customer_name || a.customer || '--'}</td>
                                                <td style="color:var(--text2);">${a.reason || '--'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : '<div class="card-empty">No appointments scheduled</div>'}
                    </div>

                    <div class="card">
                        <div class="card-title">Low Stock Alerts</div>
                        ${lowStockItems.length > 0 ? `
                            <div class="table-wrapper">
                                <table>
                                    <thead><tr><th>Part</th><th>Qty</th><th>Min</th><th>Status</th></tr></thead>
                                    <tbody>
                                        ${lowStockItems.slice(0, 5).map(i => `
                                            <tr>
                                                <td>${i.part_name}</td>
                                                <td style="color:var(--red);font-weight:600;font-family:monospace;">${i.quantity}</td>
                                                <td>${i.min_threshold}</td>
                                                <td><span class="tag tag-parts">Reorder</span></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : '<div class="card-empty" style="color:var(--green);">All parts adequately stocked</div>'}
                    </div>

                    <div class="card">
                        <div class="card-title">Recent Activity</div>
                        ${woList.slice(0, 5).length > 0 ? woList.slice(0, 5).map(w => `
                            <div class="activity-item">
                                <span class="activity-marker marker-${w.status === 'Completed' ? 'done' : w.status === 'In Progress' ? 'progress' : 'info'}">
                                    ${w.status === 'Completed' ? 'OK' : w.status === 'In Progress' ? 'W' : 'I'}
                                </span>
                                <span style="flex:1;">${w.vehicle_info || w.vehicle || 'Work Order'} #${w.id}</span>
                                <span class="tag tag-${w.status === 'Completed' ? 'done' : w.status === 'In Progress' ? 'progress' : w.status === 'Awaiting Parts' ? 'parts' : 'invoice'}">${w.status}</span>
                            </div>
                        `).join('') : '<div class="card-empty">No recent activity</div>'}
                    </div>
                </div>
            `;
        } catch (e) {
            document.getElementById('main-content').innerHTML = `
                <div class="card" style="text-align:center;padding:60px;">
                    <h2>Connection Error</h2>
                    <p style="color:var(--text2);margin-top:10px;">Unable to load dashboard data. Please check your connection.</p>
                    <p style="color:var(--text2);font-size:12px;margin-top:4px;">${e.message}</p>
                </div>
            `;
        }
    }

    function showSection(section) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if (event && event.target) {
            event.target.closest('.nav-item').classList.add('active');
        }

        const main = document.getElementById('main-content');
        const sections = {
            dashboard: { title: 'Dashboard', desc: null },
            garages: { title: 'Garages', desc: 'Manage workshop locations and branches' },
            customers: { title: 'Customers', desc: 'Customer database, history and contact records' },
            vehicles: { title: 'Vehicles', desc: 'Vehicle registry, service history and documentation' },
            appointments: { title: 'Appointments', desc: 'Schedule and manage customer appointments' },
            workorders: { title: 'Work Orders', desc: 'Active and completed repair job management' },
            mechanics: { title: 'Mechanics', desc: 'Team profiles, skills tracking and availability' },
            inventory: { title: 'Inventory', desc: 'Parts, supplies and stock level monitoring' },
            payments: { title: 'Payments', desc: 'Transaction records and payment processing' },
            invoices: { title: 'Invoices', desc: 'Invoice generation, tracking and history' },
            reports: { title: 'Reports', desc: 'Revenue analysis, performance metrics and exports' },
            settings: { title: 'Settings', desc: 'System configuration and user preferences' }
        };

        const s = sections[section] || { title: section, desc: 'Section under development' };

        if (section === 'dashboard') {
            loadDashboard();
        } else {
            main.innerHTML = `
                <div class="header">
                    <h1 class="header-title">${s.title}</h1>
                </div>
                <div class="card" style="text-align:center;padding:80px;">
                    <h2 style="color:var(--text2);font-weight:500;">${s.desc}</h2>
                    <p style="color:var(--text2);margin-top:8px;font-size:13px;">This module is currently in development.</p>
                </div>
            `;
        }
    }

    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/api/auth/login-page/';
    }

    loadDashboard();
</script>

</body>
</html>
