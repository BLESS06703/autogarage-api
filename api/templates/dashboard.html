<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoGarage Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0D0D0D;--surface:#1A1A1A;--surface2:#242424;--border:#2A2A2A;--text:#E0E0E0;--text2:#888;--orange:#FF6F00;--green:#22C55E;--red:#EF4444;--blue:#3B82F6;--amber:#F59E0B;--purple:#8B5CF6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;transition:transform 0.3s}
.sidebar-brand{font-size:17px;font-weight:700;color:var(--orange);margin-bottom:4px;padding:0 8px}
.sidebar-ver{font-size:10px;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:20px;padding:0 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text2);cursor:pointer;font-size:13px;border:none;background:none;width:100%;text-align:left;margin-bottom:1px;transition:0.15s}
.nav-item i{width:18px;text-align:center;font-size:13px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--orange);color:#fff;font-weight:600}
.nav-section{font-size:10px;color:var(--text2);letter-spacing:1.5px;margin:18px 0 6px 12px;text-transform:uppercase;font-weight:600}
.hamburger{display:none;position:fixed;top:14px;left:14px;z-index:200;background:var(--surface);color:var(--text);border:1px solid var(--border);width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer}
.main{margin-left:250px;flex:1;padding:28px 32px;min-height:100vh}
.welcome{margin-bottom:28px}
.welcome-greeting{font-size:14px;color:var(--text2);margin-bottom:2px}
.welcome-name{font-size:24px;font-weight:700}
.welcome-date{font-size:12px;color:var(--text2);margin-top:4px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;transition:0.15s;cursor:pointer}
.kpi-card:hover{border-color:var(--orange)}
.kpi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:12px}
.kpi-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.kpi-value{font-size:26px;font-weight:700;font-family:'SF Mono',monospace}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:4px}
.icon-orange{background:rgba(255,111,0,0.15);color:var(--orange)}
.icon-blue{background:rgba(59,130,246,0.15);color:var(--blue)}
.icon-green{background:rgba(34,197,94,0.15);color:var(--green)}
.icon-purple{background:rgba(139,92,246,0.15);color:var(--purple)}
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px}
.card-title{font-size:12px;font-weight:600;margin-bottom:16px;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
.card-title i{color:var(--orange);font-size:13px}
.btn{padding:10px 18px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:0.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:#E65100}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{background:var(--surface2)}
.page-header{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.page-header h1{font-size:20px;font-weight:700;flex:1}
.back-btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px}
.table-wrapper{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:12px 14px;color:var(--text2);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);background:var(--surface)}
td{padding:12px 14px;border-bottom:1px solid var(--border)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:rgba(255,255,255,0.03)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:14px;font-size:10px;font-weight:500}
.tag::before{content:'';width:6px;height:6px;border-radius:50%}
.tag-progress{background:rgba(255,111,0,0.15);color:var(--orange)}.tag-progress::before{background:var(--orange)}
.tag-parts{background:rgba(245,158,11,0.15);color:var(--amber)}.tag-parts::before{background:var(--amber)}
.tag-invoice{background:rgba(59,130,246,0.15);color:var(--blue)}.tag-invoice::before{background:var(--blue)}
.tag-done{background:rgba(34,197,94,0.15);color:var(--green)}.tag-done::before{background:var(--green)}
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap i{position:absolute;left:14px;top:14px;color:var(--text2);font-size:13px}
.search-input{width:100%;padding:11px 14px 11px 38px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;outline:none}
.search-input:focus{border-color:var(--orange)}
.text-mono{font-family:'SF Mono',monospace;font-size:12px}
.loading-spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--surface2);border-top-color:var(--orange);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:50px 20px;color:var(--text2)}
.empty-state i{font-size:44px;margin-bottom:14px;color:var(--border)}
.empty-state p{font-size:13px}
.activity-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.dot-green{background:var(--green);color:#000}
.dot-orange{background:var(--orange);color:#fff}
.dot-blue{background:var(--blue);color:#fff}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:300}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;font-weight:500}
.form-group input,.form-group textarea{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;font-family:inherit}
.form-group textarea{resize:vertical;min-height:80px}
.form-group input:focus,.form-group textarea:focus{border-color:var(--orange)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.user-bar{position:fixed;top:12px;right:16px;z-index:90;display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px}
.user-name{font-size:12px;color:var(--text)}
.user-garage{font-size:10px;color:var(--text2)}
.fab{position:fixed;bottom:28px;right:28px;z-index:150;width:56px;height:56px;border-radius:50%;background:var(--orange);color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 6px 20px rgba(255,111,0,0.3);display:flex;align-items:center;justify-content:center}
.fab-menu{position:fixed;bottom:96px;right:28px;z-index:150;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px;display:none;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,0.4);min-width:210px}
.fab-menu.open{display:flex}
.fab-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text);border:none;background:none;width:100%;text-align:left}
.fab-item:hover{background:var(--surface2)}
.fab-item i{width:18px;text-align:center;color:var(--orange)}
@media(max-width:768px){
.hamburger{display:flex;align-items:center;justify-content:center}
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0);box-shadow:4px 0 20px rgba(0,0,0,0.5)}
.main{margin-left:0!important;padding:56px 12px 80px 12px!important}
.kpi-grid{grid-template-columns:repeat(2,1fr)!important;gap:10px!important}
.content-grid{grid-template-columns:1fr!important}
.page-header{flex-direction:column;align-items:flex-start!important}
.fab{bottom:20px;right:20px;width:50px;height:50px;font-size:22px}
.fab-menu{bottom:84px;right:20px}
.welcome-name{font-size:20px!important}
}
</style>
</head>
<body>
<button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()">☰</button>
<aside class="sidebar" id="sidebar">
<div class="sidebar-brand">AutoGarage Pro</div>
<div class="sidebar-ver">Management Console</div>
<button class="nav-item active" data-section="dashboard"><i class="fas fa-th-large"></i>Dashboard</button>
<div class="nav-section">Operations</div>
<button class="nav-item" data-section="customers"><i class="fas fa-users"></i>Customers</button>
<button class="nav-item" data-section="vehicles"><i class="fas fa-car"></i>Vehicles</button>
<button class="nav-item" data-section="appointments"><i class="fas fa-calendar-alt"></i>Appointments</button>
<button class="nav-item" data-section="workorders"><i class="fas fa-clipboard-list"></i>Work Orders</button>
<button class="nav-item" data-section="mechanics"><i class="fas fa-user-cog"></i>Mechanics</button>
<button class="nav-item" data-section="inventory"><i class="fas fa-boxes"></i>Inventory</button>
<div class="nav-section">Finance</div>
<button class="nav-item" data-section="invoices"><i class="fas fa-file-invoice"></i>Invoices</button>
<button class="nav-item" data-section="payments"><i class="fas fa-money-bill-wave"></i>Payments</button>
<button class="nav-item" data-section="reports"><i class="fas fa-chart-bar"></i>Reports</button>
<div class="nav-section">Smart Tools</div>
<button class="nav-item" data-section="ai"><i class="fas fa-robot"></i>AI Diagnostics</button>
<button class="nav-item" data-section="notifications"><i class="fas fa-bell"></i>Notifications</button>
<div class="nav-section">Administration</div>
<button class="nav-item" data-section="settings"><i class="fas fa-cog"></i>Settings</button>
<div style="margin-top:auto;padding-top:16px">
<button class="nav-item" onclick="logout()" style="color:var(--red)"><i class="fas fa-sign-out-alt"></i>Sign Out</button>
</div>
</aside>
<div class="user-bar" id="userBar"><div class="user-avatar" id="userAvatar">U</div><div><div class="user-name" id="userName">User</div><div class="user-garage" id="garageName">Garage</div></div></div>
<main class="main" id="main-content"></main>
<button class="fab" onclick="toggleFab()">+</button>
<div class="fab-menu" id="fabMenu">
<button class="fab-item" onclick="toggleFab();openCreateForm('workorder')"><i class="fas fa-clipboard-list"></i>New Work Order</button>
<button class="fab-item" onclick="toggleFab();openCreateForm('customer')"><i class="fas fa-user-plus"></i>Register Customer</button>
<button class="fab-item" onclick="toggleFab();openCreateForm('vehicle')"><i class="fas fa-car"></i>Register Vehicle</button>
<button class="fab-item" onclick="toggleFab();openCreateForm('inventory')"><i class="fas fa-box"></i>Add Inventory</button>
</div>
<script>
const API='/api';
const token=localStorage.getItem('token');

(function(){
var d=JSON.parse(localStorage.getItem('user')||'{}');
if(d.username){
document.getElementById('userName').textContent=d.username;
document.getElementById('userAvatar').textContent=d.username[0].toUpperCase();
}
if(d.garage_name){
document.getElementById('garageName').textContent=d.garage_name+(d.role?' • '+d.role:'');
}
})();

function toggleSidebar(){
var s=document.getElementById('sidebar');
s.classList.toggle('open');
document.getElementById('hamburgerBtn').innerHTML=s.classList.contains('open')?'✕':'☰';
}

document.querySelectorAll('.nav-item[data-section]').forEach(function(btn){
btn.addEventListener('click',function(){
document.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('active');});
this.classList.add('active');
document.getElementById('sidebar').classList.remove('open');
loadSection(this.dataset.section);
});
});

async function api(p,m,body){
m=m||'GET';
var opts={method:m,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}};
if(body)opts.body=JSON.stringify(body);
var res=await fetch(API+p,opts);
return res.json();
}

function L(d){return Array.isArray(d)?d:(d&&d.results?d.results:[]);}

function toggleFab(){document.getElementById('fabMenu').classList.toggle('open');}

function openCreateForm(type){
var forms={
customer:{title:'Register Customer',fields:'<div class="form-group"><label>Full Name *</label><input id="cfName" placeholder="Customer name"></div><div class="form-group"><label>Phone</label><input id="cfPhone" placeholder="+265..."></div>',
create:async function(){
var n=document.getElementById('cfName').value.trim();
if(!n){alert('Name required');return;}
await api('/customers/','POST',{full_name:n,phone:document.getElementById('cfPhone').value});
document.querySelector('.modal-overlay').remove();
loadSection('customers');
}},
vehicle:{title:'Register Vehicle',fields:'<div class="form-group"><label>Make *</label><input id="cfMake" placeholder="Toyota"></div><div class="form-group"><label>Model</label><input id="cfModel" placeholder="Hilux"></div><div class="form-group"><label>Plate *</label><input id="cfPlate" placeholder="BT1234"></div><div class="form-group"><label>Year</label><input id="cfYear" placeholder="2018"></div>',
create:async function(){
var mk=document.getElementById('cfMake').value.trim();
var pl=document.getElementById('cfPlate').value.trim();
if(!mk||!pl){alert('Make and plate required');return;}
await api('/vehicles/','POST',{make:mk,model_name:document.getElementById('cfModel').value,plate:pl,year:document.getElementById('cfYear').value,mileage:0});
document.querySelector('.modal-overlay').remove();
loadSection('vehicles');
}},
inventory:{title:'Add Inventory',fields:'<div class="form-group"><label>Part Name *</label><input id="cfPart" placeholder="Oil Filter"></div><div class="form-group"><label>Quantity</label><input id="cfQty" type="number" value="1"></div><div class="form-group"><label>Min Threshold</label><input id="cfMin" type="number" value="5"></div><div class="form-group"><label>Unit Price (MWK)</label><input id="cfPrice" type="number" value="0"></div>',
create:async function(){
var n=document.getElementById('cfPart').value.trim();
if(!n){alert('Part name required');return;}
await api('/inventory/','POST',{part_name:n,quantity:parseInt(document.getElementById('cfQty').value)||1,min_threshold:parseInt(document.getElementById('cfMin').value)||5,unit_price:parseFloat(document.getElementById('cfPrice').value)||0});
document.querySelector('.modal-overlay').remove();
loadSection('inventory');
}},
workorder:{title:'New Work Order',fields:'<div class="form-group"><label>Vehicle *</label><input id="cfVeh" placeholder="e.g. Toyota Hilux"></div><div class="form-group"><label>Customer *</label><input id="cfCust" placeholder="Customer name"></div><div class="form-group"><label>Issue</label><textarea id="cfIssue"></textarea></div><div class="form-group"><label>Cost (MWK)</label><input id="cfCost" type="number" value="0"></div>',
create:async function(){
var v=document.getElementById('cfVeh').value.trim();
var c=document.getElementById('cfCust').value.trim();
if(!v||!c){alert('Vehicle and customer required');return;}
await api('/work-orders/','POST',{vehicle_info:v,customer_name:c,issue_description:document.getElementById('cfIssue').value,cost_estimate:parseFloat(document.getElementById('cfCost').value)||0});
document.querySelector('.modal-overlay').remove();
loadSection('workorders');
}}
};
var f=forms[type];
if(!f)return;
var ov=document.createElement('div');ov.className='modal-overlay';
ov.innerHTML='<div class="modal"><div class="modal-title">'+f.title+'</div>'+f.fields+'<div class="form-actions"><button class="btn btn-outline" onclick="this.closest(\\'.modal-overlay\\').remove()">Cancel</button><button class="btn btn-primary" id="fabSubmit">Create</button></div></div>';
document.body.appendChild(ov);
document.getElementById('fabSubmit').addEventListener('click',function(){f.create();});
ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
}

async function loadSection(s){
var m=document.getElementById('main-content');
m.innerHTML='<div style="text-align:center;padding:40px;"><div class="loading-spinner"></div></div>';
try{
if(s==='dashboard')await dash();
else if(s==='workorders')await wo();
else if(s==='customers')await cust();
else if(s==='vehicles')await veh();
else if(s==='mechanics')await mech();
else if(s==='inventory')await inv();
else if(s==='appointments')await appt();
else if(s==='payments')await pay();
else if(s==='invoices')await invc();
else if(s==='reports')await rpt();
else if(s==='ai')await aid();
else if(s==='notifications')await notif();
else if(s==='settings')await sett();
}catch(e){m.innerHTML='<div class="empty-state"><p>Error: '+e.message+'</p></div>';}
}

async function dash(){
var now=new Date();
var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
var h=now.getHours();
var greeting=h<12?'Good Morning':h<17?'Good Afternoon':'Good Evening';
var dateStr=days[now.getDay()]+', '+now.getDate()+' '+months[now.getMonth()]+' '+now.getFullYear();
document.getElementById('main-content').innerHTML='<div class="welcome"><div class="welcome-greeting">'+greeting+'</div><div class="welcome-name">AutoGarage Pro</div><div class="welcome-date">'+dateStr+' · Today Overview</div></div><div class="kpi-grid"><div class="kpi-card" onclick="loadSection(\'customers\')"><div class="kpi-icon icon-blue"><i class="fas fa-users"></i></div><div class="kpi-label">Customers</div><div class="kpi-value" id="k1" style="color:var(--blue);">-</div></div><div class="kpi-card" onclick="loadSection(\'vehicles\')"><div class="kpi-icon icon-purple"><i class="fas fa-car"></i></div><div class="kpi-label">Vehicles</div><div class="kpi-value" id="k2" style="color:var(--purple);">-</div></div><div class="kpi-card" onclick="loadSection(\'workorders\')"><div class="kpi-icon icon-orange"><i class="fas fa-clipboard-list"></i></div><div class="kpi-label">Active Jobs</div><div class="kpi-value" id="k3" style="color:var(--orange);">-</div></div><div class="kpi-card" onclick="loadSection(\'reports\')"><div class="kpi-icon icon-green"><i class="fas fa-chart-bar"></i></div><div class="kpi-label">Revenue</div><div class="kpi-value" id="k4" style="color:var(--green);">-</div></div></div><div class="content-grid"><div class="card"><div class="card-title"><i class="fas fa-clock"></i>Recent Activity</div><div id="activity"></div></div><div class="card"><div class="card-title"><i class="fas fa-bolt"></i>Quick Actions</div><button class="btn btn-primary" style="width:100%;margin-bottom:8px" onclick="openCreateForm(\'workorder\')"><i class="fas fa-plus"></i>New Work Order</button><button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="openCreateForm(\'customer\')"><i class="fas fa-user-plus"></i>Register Customer</button><button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="openCreateForm(\'vehicle\')"><i class="fas fa-car"></i>Register Vehicle</button><button class="btn btn-outline" style="width:100%" onclick="openCreateForm(\'inventory\')"><i class="fas fa-box"></i>Add Inventory</button></div></div>';
try{
var o=await api('/work-orders/'),c=await api('/customers/'),v=await api('/vehicles/'),p=await api('/payments/');
var wo=L(o),cu=L(c),ve=L(v),pa=L(p);
document.getElementById('k1').textContent=cu.length;
document.getElementById('k2').textContent=ve.length;
document.getElementById('k3').textContent=wo.filter(function(w){return w.status==='In Progress'||w.status==='Awaiting Parts';}).length;
document.getElementById('k4').textContent='MWK '+pa.reduce(function(s,p){return s+(parseFloat(p.amount)||0);},0).toLocaleString();
document.getElementById('activity').innerHTML=wo.slice(0,5).map(function(w){return '<div class="activity-item"><span class="activity-dot '+(w.status==='Completed'?'dot-green':w.status==='In Progress'?'dot-orange':'dot-blue')+'">'+(w.status==='Completed'?'✓':'●')+'</span><span style="flex:1">'+(w.vehicle_info||'WO')+' #'+w.id+'</span><span class="tag '+(w.status==='Completed'?'tag-done':w.status==='In Progress'?'tag-progress':'tag-parts')+'">'+w.status+'</span></div>';}).join('')||'<div class="empty-state"><p>No activity yet</p></div>';
}catch(e){}
}

async function wo(){
var list=L(await api('/work-orders/'));
var sc={'In Progress':'tag-progress','Awaiting Parts':'tag-parts','Ready (Pending Invoice)':'tag-invoice','Completed':'tag-done'};

async function rpt(){
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Reports</h1></div><div style="text-align:center;padding:40px"><div class="loading-spinner"></div></div>';
try{
var o=await api('/work-orders/'),p=await api('/payments/'),m=await api('/mechanics/');
var wo=L(o),pa=L(p),me=L(m);
var rev=pa.reduce(function(s,p){return s+(parseFloat(p.amount)||0);},0);
var comp=wo.filter(function(w){return w.status==='Completed';}).length;
var st={'In Progress':0,'Awaiting Parts':0,'Ready (Pending Invoice)':0,'Completed':0};
wo.forEach(function(w){if(st[w.status]!==undefined)st[w.status]++;});
var mt={};pa.forEach(function(p){var m=p.payment_method||'Other';mt[m]=(mt[m]||0)+parseFloat(p.amount||0);});
var it={};wo.forEach(function(w){var k=(w.issue_description||'General').split(' ').slice(0,3).join(' ');it[k]=(it[k]||0)+1;});
var top=Object.entries(it).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Reports</h1></div><div class="kpi-grid"><div class="kpi-card"><div class="kpi-label">Revenue</div><div class="kpi-value" style="color:var(--green)">MWK '+rev.toLocaleString()+'</div></div><div class="kpi-card"><div class="kpi-label">Completed</div><div class="kpi-value" style="color:var(--blue)">'+comp+'</div></div></div><div class="content-grid"><div class="card"><div class="card-title">Revenue by Method</div><div style="height:280px"><canvas id="c1"></canvas></div></div><div class="card"><div class="card-title">Job Status</div><div style="height:280px"><canvas id="c2"></canvas></div></div></div>';
setTimeout(function(){
new Chart(document.getElementById('c1'),{type:'bar',data:{labels:Object.keys(mt),datasets:[{label:'Revenue',data:Object.values(mt),backgroundColor:['#FF6F00','#3B82F6','#22C55E'],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#888'}}},scales:{x:{ticks:{color:'#888'}},y:{ticks:{color:'#888'}}}}});
new Chart(document.getElementById('c2'),{type:'doughnut',data:{labels:Object.keys(st),datasets:[{data:Object.values(st),backgroundColor:['#FF6F00','#F59E0B','#3B82F6','#22C55E']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#888'}}}}});
},300);
}catch(e){document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>Reports</h1></div><div class="empty-state"><p>No data yet</p></div>';}
}

async function aid(){
document.getElementById('main-content').innerHTML='<div class="page-header"><button class="back-btn" onclick="loadSection(\'dashboard\')"><i class="fas fa-arrow-left"></i>Back</button><h1>AI Diagnostics</h1></div><div class="card" style="max-width:560px"><div class="card-title"><i class="fas fa-robot"></i>Fault Code Analyzer</div><div class="form-group"><label>OBD-II Code</label><input id="ac" placeholder="e.g. P0300" maxlength="5" style="text-transform:uppercase"></div><div class="form-group"><label>Vehicle (optional)</label><input id="av" placeholder="e.g. Toyota Hilux"></div><button class="btn btn-primary" onclick="runAI()"><i class="fas fa-search"></i>Run Diagnosis</button><div id="ar" style="margin-top:14px"></div></div>';
}
async function runAI(){
var c=document.getElementById('ac').value,v=document.getElementById('av').value,el=document.getElementById('ar');
if(!c){el.innerHTML='<p style="color:var(--red)">Enter a code</p>';return;}
el.innerHTML='<div class="loading-spinner"></div>';
try{
var d=await api('/ai/diagnose/','POST',{code:c,vehicle:v});
var sc={Critical:'var(--red)',High:'var(--orange)',Medium:'var(--amber)',Low:'var(--green)'};
el.innerHTML='<div style="padding:18px;background:var(--surface2);border-radius:10px;border-left:4px solid '+sc[d.severity]+';margin-top:12px"><h3>'+d.title+'</h3><p style="font-size:12px;color:var(--text2);margin:8px 0">Severity: <strong>'+d.severity+'</strong> · Cost: <strong>'+d.estimated_cost+'</strong></p><ol style="padding-left:18px;font-size:13px;line-height:2">'+d.details.map(function(x){return'<li>'+x+'</li>';}).join('')+'</ol></div>';
}catch(e){el.innerHTML='<p style="color:var(--red)">'+e.message+'</p>';}
}
