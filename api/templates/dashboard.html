<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGarage Pro - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0D0D0D;
            --surface: #1A1A1A;
            --surface2: #242424;
            --border: #2A2A2A;
            --text: #E0E0E0;
            --text2: #888888;
            --orange: #FF6F00;
            --green: #22C55E;
            --red: #EF4444;
            --blue: #3B82F6;
            --amber: #F59E0B;
            --purple: #8B5CF6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
            overflow-y: auto;
        }

        .sidebar-brand {
            font-size: 17px;
            font-weight: 700;
            color: var(--orange);
            margin-bottom: 2px;
        }

        .sidebar-version {
            font-size: 10px;
            color: var(--text2);
            margin-bottom: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 7px;
            color: var(--text2);
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 1px;
            transition: all 0.15s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover { background: var(--surface2); color: var(--text); }
        .nav-item.active { background: var(--orange); color: #fff; font-weight: 600; }

        .nav-section {
            font-size: 10px;
            color: var(--text2);
            letter-spacing: 1.5px;
            margin: 18px 0 8px 12px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .main {
            margin-left: 240px;
            flex: 1;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-title {
            font-size: 21px;
            font-weight: 700;
            color: var(--text);
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 9px 16px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.15s;
        }

        .btn-primary { background: var(--orange); color: #fff; }
        .btn-primary:hover { background: #E65100; }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--surface2); }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-danger:hover { background: #DC2626; }

        .status-badge {
            background: rgba(34, 197, 94, 0.15);
            color: var(--green);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            margin-right: 6px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .kpi-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
        }

        .kpi-label {
            font-size: 10px;
            color: var(--text2);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: 700;
            font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
        }

        .kpi-sub {
            font-size: 11px;
            color: var(--text2);
            margin-top: 3px;
        }

        .kpi-green { color: var(--green); }
        .kpi-orange { color: var(--orange); }
        .kpi-blue { color: var(--blue); }
        .kpi-purple { color: var(--purple); }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .card-empty {
            color: var(--text2);
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
        }

        .progress-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .progress-label {
            width: 110px;
            font-size: 12px;
            color: var(--text2);
            flex-shrink: 0;
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: var(--surface2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s;
        }

        .progress-count {
            font-size: 12px;
            font-weight: 600;
            font-family: 'SF Mono', 'Consolas', monospace;
            width: 26px;
            text-align: right;
            flex-shrink: 0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 10px 12px;
            color: var(--text2);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            white-space: nowrap;
        }

        tr:hover td { background: rgba(255,255,255,0.02); }

        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .tag-progress { background: rgba(255,111,0,0.15); color: var(--orange); }
        .tag-parts { background: rgba(245,158,11,0.15); color: var(--amber); }
        .tag-invoice { background: rgba(59,130,246,0.15); color: var(--blue); }
        .tag-done { background: rgba(34,197,94,0.15); color: var(--green); }

        .activity-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .activity-item:last-child { border-bottom: none; }

        .activity-marker {
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .marker-done { background: var(--green); color: #000; }
        .marker-progress { background: var(--orange); color: #fff; }
        .marker-info { background: var(--blue); color: #fff; }

        .full-width { grid-column: 1 / -1; }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            margin-bottom: 14px;
        }

        .search-input:focus { border-color: var(--orange); }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text2);
        }

        .loading-spinner {
            display: inline-block;
            width: 28px; height: 28px;
            border: 3px solid var(--surface2);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text2);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 7px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--orange); }

        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .text-mono { font-family: 'SF Mono', 'Consolas', monospace; }

        @media (max-width: 768px) {
        .mobile-toggle { display: block !important; }
            .sidebar { display: none; position:fixed; z-index:150; }
    .sidebar.open { display: flex; }
            .main { margin-left: 0; padding: 14px; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .content-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-brand">AutoGarage Pro</div>
    <div class="sidebar-version">Management Console v2.0</div>

    <button class="nav-item active" data-section="dashboard">Dashboard</button>
    <button class="nav-item" data-section="garages">Garages</button>
    <button class="nav-item" data-section="customers">Customers</button>
    <button class="nav-item" data-section="vehicles">Vehicles</button>
    <button class="nav-item" data-section="appointments">Appointments</button>

    <div class="nav-section">Operations</div>
    <button class="nav-item" data-section="workorders">Work Orders</button>
    <button class="nav-item" data-section="mechanics">Mechanics</button>
    <button class="nav-item" data-section="inventory">Inventory</button>

    <div class="nav-section">Finance</div>
    <button class="nav-item" data-section="payments">Payments</button>
    <button class="nav-item" data-section="invoices">Invoices</button>
    <button class="nav-item" data-section="reports">Reports</button>

    <div class="nav-section">System</div>
    <button class="nav-item" data-section="settings">Settings</button>

    <div style="margin-top: auto; padding-top: 20px;">
        <button class="nav-item" onclick="logout()" style="color: var(--red);">Sign Out</button>
    </div>
</aside>

<button class="mobile-toggle" onclick="document.querySelector(047.sidebar047).classList.toggle(047open047)" style="display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--orange);color:#fff;border:none;width:36px;height:36px;border-radius:8px;font-size:18px;cursor:pointer;">☰</button>
<main class="main" id="main-content">
    <div class="loading">
        <div class="loading-spinner"></div>
        <div>Loading dashboard...</div>
    </div>
</main>

<script>
    const API = '/api';
    const token = localStorage.getItem('token');

    if (!token) { window.location.href = '/api/auth/login-page/'; }

    async function api(path, method = 'GET', body = null) {
        const opts = {
            method,
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(`${API}${path}`, opts);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
    }

    function extractList(data) {
        if (Array.isArray(data)) return data;
        if (data && data.results) return data.results;
        return [];
    }

    // ==================== NAVIGATION ====================
    document.querySelectorAll('.nav-item[data-section]').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            this.classList.add('active');
            loadSection(this.dataset.section);
        });
    });

    async function loadSection(section) {
        const main = document.getElementById('main-content');
        main.innerHTML = '<div class="loading"><div class="loading-spinner"></div><div>Loading...</div></div>';

        try {
            clearTimeout(timeout);
            switch(section) {
                case 'dashboard': await loadDashboard(); break;
                case 'workorders': await loadWorkOrders(); break;
                case 'customers': await loadCustomers(); break;
                case 'vehicles': await loadVehicles(); break;
                case 'mechanics': await loadMechanics(); break;
                case 'inventory': await loadInventory(); break;
                case 'appointments': await loadAppointments(); break;
                case 'payments': await loadPayments(); break;
                case 'invoices': await loadInvoices(); break;
                case 'garages': await loadGarages(); break;
                case 'ai': await loadAI(); break;
                case 'notifications': await loadNotifications(); break;
                case 'reports': await loadReports(); break;
                case 'settings': await loadSettings(); break;
                default: loadPlaceholder(section);
            }
        } catch (e) {
            main.innerHTML = `<div class="card" style="text-align:center;padding:60px;"><h2>Error Loading Data</h2><p style="color:var(--text2);margin-top:8px;">${e.message}</p><button class="btn btn-outline" style="margin-top:16px;" onclick="loadSection('${section}')">Retry</button></div>`;
        }
    }

    // ==================== DASHBOARD ====================
    async function loadDashboard() {
        const timeout = setTimeout(() => {
            if (document.getElementById('main-content').querySelector('.loading-spinner')) {
                document.getElementById('main-content').innerHTML = '<div class="card" style="text-align:center;padding:60px;"><h2>Server is waking up</h2><p style="color:var(--text2);margin-top:8px;">Free tier spins down after inactivity. Please wait...</p><button class="btn btn-primary" style="margin-top:16px;" onclick="loadSection(\'dashboard\')">Retry</button></div>';
            }
        }, 10000);
        const orders = await api('/work-orders/').catch(() => []);
        const inventory = await api('/inventory/').catch(() => []);
        const appointments = await api('/appointments/').catch(() => []);
        const customers = await api('/customers/').catch(() => []);
        const mechanics = await api('/mechanics/').catch(() => []);
        const payments = await api('/payments/').catch(() => []);

        const woList = extractList(orders);
        const invList = extractList(inventory);
        const apptList = extractList(appointments);
        const custList = extractList(customers);
        const mechList = extractList(mechanics);
        const payList = extractList(payments);

        const activeJobs = woList.filter(w => w.status === 'In Progress' || w.status === 'Awaiting Parts').length;
        const pendingInvoice = woList.filter(w => w.status === 'Ready (Pending Invoice)').length;
        const completedJobs = woList.filter(w => w.status === 'Completed').length;
        const totalRevenue = payList.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);

        const inProgress = woList.filter(w => w.status === 'In Progress').length;
        const awaitingParts = woList.filter(w => w.status === 'Awaiting Parts').length;
        const readyInvoice = woList.filter(w => w.status === 'Ready (Pending Invoice)').length;
        const maxJobs = Math.max(inProgress, awaitingParts, readyInvoice, completedJobs, 1);

        const lowStockItems = invList.filter(i => i.quantity < i.min_threshold);
        const availableMechanics = mechList.filter(m => m.is_available).length;

        document.getElementById('main-content').innerHTML = `
            <div class="header">
                <h1 class="header-title">Dashboard</h1>
                <span class="status-badge"><span class="status-dot"></span>System Active</span>
            </div>
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-label">Customers</div>
                    <div class="kpi-value kpi-blue">${custList.length}</div>
                    <div class="kpi-sub">Registered accounts</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Active Jobs</div>
                    <div class="kpi-value kpi-orange">${activeJobs}</div>
                    <div class="kpi-sub">${pendingInvoice} pending invoice</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Revenue</div>
                    <div class="kpi-value kpi-green">MWK ${totalRevenue.toLocaleString()}</div>
                    <div class="kpi-sub">${completedJobs} completed</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Mechanics</div>
                    <div class="kpi-value kpi-purple">${mechList.length}</div>
                    <div class="kpi-sub">${availableMechanics} available</div>
                </div>
            </div>
            <div class="content-grid">
                <div class="card">
                    <div class="card-title">Work Order Status</div>
                    ${['In Progress', 'Awaiting Parts', 'Pending Invoice', 'Completed'].map((label, i) => {
                        const vals = [inProgress, awaitingParts, readyInvoice, completedJobs];
                        const colors = ['var(--orange)', 'var(--amber)', 'var(--blue)', 'var(--green)'];
                        return `<div class="progress-item"><span class="progress-label">${label}</span><div class="progress-bar"><div class="progress-fill" style="width:${vals[i]/maxJobs*100}%;background:${colors[i]};"></div></div><span class="progress-count">${vals[i]}</span></div>`;
                    }).join('')}
                </div>
                <div class="card">
                    <div class="card-title">Appointments</div>
                    ${apptList.slice(0, 5).length > 0 ? `<div class="table-wrapper"><table><thead><tr><th>Time</th><th>Customer</th><th>Reason</th></tr></thead><tbody>${apptList.slice(0,5).map(a => `<tr><td class="text-mono" style="color:var(--orange);">${a.time||'--:--'}</td><td>${a.customer_name||a.customer||'--'}</td><td style="color:var(--text2);">${a.reason||'--'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card-empty">No appointments scheduled</div>'}
                </div>
                <div class="card">
                    <div class="card-title">Low Stock Alerts</div>
                    ${lowStockItems.length > 0 ? `<div class="table-wrapper"><table><thead><tr><th>Part</th><th>Qty</th><th>Min</th></tr></thead><tbody>${lowStockItems.slice(0,5).map(i => `<tr><td>${i.part_name}</td><td style="color:var(--red);font-weight:600;" class="text-mono">${i.quantity}</td><td>${i.min_threshold}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card-empty" style="color:var(--green);">All parts adequately stocked</div>'}
                </div>
                <div class="card">
                    <div class="card-title">Recent Activity</div>
                    ${woList.slice(0,5).length > 0 ? woList.slice(0,5).map(w => {
                        const markerClass = w.status === 'Completed' ? 'marker-done' : w.status === 'In Progress' ? 'marker-progress' : 'marker-info';
                        const markerText = w.status === 'Completed' ? 'OK' : w.status === 'In Progress' ? 'W' : 'I';
                        const tagClass = w.status === 'Completed' ? 'tag-done' : w.status === 'In Progress' ? 'tag-progress' : w.status === 'Awaiting Parts' ? 'tag-parts' : 'tag-invoice';
                        return `<div class="activity-item"><span class="activity-marker ${markerClass}">${markerText}</span><span style="flex:1;">${w.vehicle_info||w.vehicle||'WO'} #${w.id}</span><span class="tag ${tagClass}">${w.status}</span></div>`;
                    }).join('') : '<div class="card-empty">No recent activity</div>'}
                </div>
            </div>
        `;
    }

    // ==================== WORK ORDERS ====================
    async function loadWorkOrders() {
        const [orders, vehicles, mechanics] = await Promise.all([
            api('/work-orders/').catch(() => []),
            api('/vehicles/').catch(() => []),
            api('/mechanics/').catch(() => [])
        ]);
        const woList = extractList(orders);
        const vehList = extractList(vehicles);
        const mechList = extractList(mechanics);

        const statusColors = {
            'In Progress': 'tag-progress',
            'Awaiting Parts': 'tag-parts',
            'Ready (Pending Invoice)': 'tag-invoice',
            'Completed': 'tag-done'
        };

        window._woData = { woList, vehList, mechList };

        document.getElementById('main-content').innerHTML = `
            <div class="header">
                <h1 class="header-title">Work Orders</h1>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="showWOModal()">+ New Work Order</button>
                    <button class="btn btn-outline" onclick="loadSection('workorders')">Refresh</button>
                </div>
            </div>
            <div class="card">
                <input class="search-input" id="woSearch" placeholder="Search work orders by vehicle, customer or status..." oninput="filterWOTable()">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr><th>SRN</th><th>Vehicle</th><th>Customer</th><th>Status</th><th>Cost (MWK)</th><th>Date</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="woTableBody">
                            ${woList.length > 0 ? woList.map(w => `
                                <tr data-search="${w.srn||''} ${w.vehicle_info||w.vehicle||''} ${w.customer_name||''} ${w.status||''}">
                                    <td class="text-mono">${w.srn||'BG-'+w.id}</td>
                                    <td>${w.vehicle_info||w.vehicle||'--'}</td>
                                    <td>${w.customer_name||'--'}</td>
                                    <td><span class="tag ${statusColors[w.status]||'tag-progress'}">${w.status||'In Progress'}</span></td>
                                    <td class="text-mono">${parseFloat(w.cost_estimate||0).toLocaleString()}</td>
                                    <td>${w.created_at ? w.created_at.substring(0,10) : '--'}</td>
                                    <td>
                                        <select onchange="updateWOStatus(${w.id}, this.value)" style="padding:4px 8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:11px;">
                                            <option value="">Change...</option>
                                            <option value="In Progress">In Progress</option>
                                            <option value="Awaiting Parts">Awaiting Parts</option>
                                            <option value="Ready (Pending Invoice)">Pending Invoice</option>
                                            <option value="Completed">Completed</option>
                                        </select>
                                    </td>
                                </tr>

    async function loadReports() {

                api("/work-orders/").catch(() => []),

            ]);
            const woList = extractList(orders);

            const custList = extractList(customers);
            const mechList = extractList(mechanics);
            const totalRevenue = payList.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
            const completedJobs = woList.filter(w => w.status === "Completed").length;
            const activeJobs = woList.filter(w => w.status === "In Progress" || w.status === "Awaiting Parts").length;
            const avgJobValue = completedJobs > 0 ? Math.round(totalRevenue / completedJobs) : 0;
            const methodTotals = {};
            payList.forEach(p => { const m = p.payment_method || "Other"; methodTotals[m] = (methodTotals[m] || 0) + parseFloat(p.amount || 0); });
            const statusCounts = { "In Progress": 0, "Awaiting Parts": 0, "Ready (Pending Invoice)": 0, "Completed": 0 };
            woList.forEach(w => { if (statusCounts[w.status] !== undefined) statusCounts[w.status]++; });
            const issueTypes = {};
            woList.forEach(w => { const issue = w.issue_description || "General"; const words = issue.split(" ").slice(0, 3).join(" "); issueTypes[words] = (issueTypes[words] || 0) + 1; });
            const topIssues = Object.entries(issueTypes).sort((a,b) => b[1] - a[1]).slice(0, 6);

            document.getElementById("main-content").innerHTML = '<div class="header"><h1 class="header-title">Reports & Analytics</h1><div class="header-actions"><button class="btn btn-outline" onclick="loadSection(\'reports\')">Refresh</button><button class="btn btn-outline" onclick="exportCSV()">Export CSV</button></div></div><div class="kpi-grid"><div class="kpi-card"><div class="kpi-label">Total Revenue</div><div class="kpi-value kpi-green">MWK ' + totalRevenue.toLocaleString() + '</div></div><div class="kpi-card"><div class="kpi-label">Completed Jobs</div><div class="kpi-value kpi-blue">' + completedJobs + '</div></div><div class="kpi-card"><div class="kpi-label">Avg Job Value</div><div class="kpi-value kpi-orange">MWK ' + avgJobValue.toLocaleString() + '</div></div><div class="kpi-card"><div class="kpi-label">Customers</div><div class="kpi-value kpi-purple">' + custList.length + '</div></div></div><div class="content-grid"><div class="card"><div class="card-title">Revenue by Payment Method</div><div style="height:250px;"><canvas id="revenueChart"></canvas></div></div><div class="card"><div class="card-title">Job Status Distribution</div><div style="height:250px;"><canvas id="statusChart"></canvas></div></div><div class="card"><div class="card-title">Most Common Repairs</div><div style="height:250px;"><canvas id="repairsChart"></canvas></div></div><div class="card"><div class="card-title">Mechanic Performance</div><div style="height:250px;"><canvas id="mechanicsChart"></canvas></div></div><div class="card full-width"><div class="card-title">Recent Transactions</div><div class="table-wrapper"><table><thead><tr><th>Date</th><th>Ref</th><th>Method</th><th>Amount</th></tr></thead><tbody>' + (payList.slice(0,10).map(p => "<tr><td>" + (p.created_at||"").substring(0,10) + "</td><td class=\"text-mono\">" + (p.transaction_ref||"--") + "</td><td>" + (p.payment_method||"--") + "</td><td class=\"text-mono\" style=\"color:var(--green);\">MWK " + parseFloat(p.amount||0).toLocaleString() + "</td></tr>").join("") || "<tr><td colspan=\"4\">No transactions</td></tr>") + "</tbody></table></div></div></div>';

            setTimeout(() => {
                const methodLabels = Object.keys(methodTotals);
                const methodValues = Object.values(methodTotals);
                const ctx1 = document.getElementById("revenueChart");
                if (ctx1 && typeof Chart !== "undefined") {
                    new Chart(ctx1, { type: "bar", data: { labels: methodLabels, datasets: [{ label: "Revenue (MWK)", data: methodValues, backgroundColor: ["#FF6F00","#3B82F6","#22C55E","#8B5CF6","#F59E0B","#EF4444"], borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: "#888" } } }, scales: { x: { ticks: { color: "#888" }, grid: { color: "#222" } }, y: { ticks: { color: "#888" }, grid: { color: "#222" } } } } });

                const ctx2 = document.getElementById("statusChart");

                }
                const ctx3 = document.getElementById("repairsChart");

                    new Chart(ctx3, { type: "line", data: { labels: topIssues.map(i=>i[0]), datasets: [{ label: "Occurrences", data: topIssues.map(i=>i[1]), borderColor: "#FF6F00", backgroundColor: "rgba(255,111,0,0.1)", fill: true, tension: 0.4, pointBackgroundColor: "#FF6F00" }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: "#888" } } }, scales: { x: { ticks: { color: "#888" }, grid: { color: "#222" } }, y: { ticks: { color: "#888", stepSize: 1 }, grid: { color: "#222" } } } } });

                const ctx4 = document.getElementById("mechanicsChart");

        localStorage.clear();
        alert("Local cache cleared. Token removed. You will be redirected to login.");
        window.location.href = "/api/auth/login-page/";
    }


    // ==================== AI ASSISTANT ====================
    async function loadAI() {
        try {
            clearTimeout(timeout);
            const codesData = await api("/ai/codes/").catch(() => ({}));
            const supportedCodes = codesData.supported_codes || [];

            document.getElementById("main-content").innerHTML = `
                <div class="header">
                    <h1 class="header-title">AI Diagnostic Assistant</h1>
                </div>
                <div class="content-grid">
                    <div class="card">
                        <div class="card-title">Fault Code Diagnosis</div>
                        <div class="form-group">
                            <label>OBD-II Fault Code</label>
                            <input id="aiCode" placeholder="e.g. P0300" style="text-transform:uppercase;" maxlength="5">
                        </div>
                        <div class="form-group">
                            <label>Vehicle Info (optional)</label>
                            <input id="aiVehicle" placeholder="e.g. Toyota Hilux 2018">
                        </div>
                        <button class="btn btn-primary" style="width:100%;" onclick="runDiagnosis()">Run Diagnosis</button>
                        <div id="aiResult" style="margin-top:16px;"></div>
                    </div>
                    <div class="card">
                        <div class="card-title">Supported Codes</div>
                        <div class="table-wrapper">
                            <table>
                                <thead><tr><th>Code</th><th>Description</th><th>Severity</th></tr></thead>
                                <tbody>
                                    ${supportedCodes.length > 0 ? supportedCodes.map(c => `
                                        <tr style="cursor:pointer;" onclick="document.getElementById(047aiCode047).value=047${c.code}047; runDiagnosis();">
                                            <td class="text-mono" style="color:var(--orange);">${c.code}</td>
                                            <td style="font-size:12px;">${c.title}</td>
                                            <td><span class="tag tag-${c.severity === "Critical" ? "progress" : c.severity === "High" ? "parts" : c.severity === "Medium" ? "invoice" : "done"}">${c.severity}</span></td>
                                        </tr>
                                    `).join("") : "<tr><td colspan=0473047 style=047text-align:center;color:var(--text2);padding:20px;047>Loading codes...</td></tr>"}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        } catch(e) {
            document.getElementById("main-content").innerHTML = `<div class="card" style="text-align:center;padding:60px;"><h2>Error</h2><p style="color:var(--text2);">${e.message}</p></div>`;
        }
    }

    async function runDiagnosis() {
        const code = document.getElementById("aiCode").value.trim();
        const vehicle = document.getElementById("aiVehicle").value.trim();
        const resultDiv = document.getElementById("aiResult");
        if (!code) { resultDiv.innerHTML = "<p style=047color:var(--red);047>Please enter a fault code</p>"; return; }
        resultDiv.innerHTML = "<div class=047loading-spinner047></div> Analyzing...";
        try {
            clearTimeout(timeout);
            const data = await api("/ai/diagnose/", "POST", { code, vehicle });
            const severityColors = { Critical: "var(--red)", High: "var(--orange)", Medium: "var(--amber)", Low: "var(--green)" };
            resultDiv.innerHTML = `
                <div style="margin-top:12px;padding:16px;background:var(--surface2);border-radius:8px;border-left:3px solid ${severityColors[data.severity]||"var(--blue)"};">
                    <h3 style="color:var(--text);margin-bottom:4px;">${data.title}</h3>
                    <p style="font-size:11px;color:var(--text2);margin-bottom:10px;">Vehicle: ${data.vehicle} | Severity: <span style="color:${severityColors[data.severity]||"var(--text2)"};">${data.severity}</span> | Est. Cost: ${data.estimated_cost}</p>
                    <ol style="padding-left:16px;font-size:13px;color:var(--text);line-height:1.8;">
                        ${data.details.map(d => `<li>${d}</li>`).join("")}
                    </ol>
                </div>
            `;
        } catch(e) {
            resultDiv.innerHTML = `<p style="color:var(--red);">Diagnosis failed: ${e.message}</p>`;
        }
    }


    // ==================== NOTIFICATIONS ====================
    async function loadNotifications() {
        try {
            clearTimeout(timeout);
            const data = await api("/notifications/").catch(() => []);
            const list = extractList(data);
            const unread = list.filter(n => !n.is_read).length;

            const priorityColors = { urgent: "var(--red)", high: "var(--orange)", medium: "var(--amber)", low: "var(--blue)" };

            document.getElementById("main-content").innerHTML = `
                <div class="header">
                    <h1 class="header-title">Notifications</h1>
                    <div class="header-actions">
                        <button class="btn btn-outline" onclick="markAllRead()">Mark All Read</button>
                        <button class="btn btn-outline" onclick="loadSection(047notifications047)">Refresh</button>
                    </div>
                </div>
                <div class="card">
                    ${list.length > 0 ? list.map(n => `
                        <div class="activity-item" style="opacity:${n.is_read ? "0.5" : "1"};cursor:pointer;" onclick="${n.link ? `window.location.href=047${n.link}047` : ""}">
                            <span class="activity-marker" style="background:${priorityColors[n.priority]||"var(--blue)"};color:#fff;font-size:8px;">${n.priority.toUpperCase().substring(0,3)}</span>
                            <span style="flex:1;">
                                <strong>${n.title}</strong>
                                <span style="font-size:11px;color:var(--text2);display:block;">${n.message}</span>
                            </span>
                            <span style="font-size:10px;color:var(--text2);">${n.created_at ? n.created_at.substring(0,16) : ""}</span>
                            ${!n.is_read ? `<button class="btn btn-outline" style="font-size:10px;padding:4px 8px;" onclick="event.stopPropagation();markRead(${n.id})">Read</button>` : ""}
                        </div>
                    `).join("") : "<div class=047card-empty047>No notifications</div>"}
                </div>
            `;
            window._notifList = list;
        } catch(e) {
            document.getElementById("main-content").innerHTML = `<div class="card" style="text-align:center;padding:60px;"><h2>Error</h2><p style="color:var(--text2);">${e.message}</p></div>`;
        }
    }

    async function markRead(id) {
        try {
            clearTimeout(timeout); await api(`/notifications/${id}/`, "PATCH", { is_read: true }); loadSection("notifications"); } catch(e) {}
    }

    async function markAllRead() {
        const list = window._notifList || [];
        for (const n of list) {
            if (!n.is_read) {
                try {
            clearTimeout(timeout); await api(`/notifications/${n.id}/`, "PATCH", { is_read: true }); } catch(e) {}
            }
        }
        loadSection("notifications");
    }

    async function updateNotifBadge() {
        try {
            clearTimeout(timeout);
            const data = await api("/notifications/").catch(() => []);
            const list = extractList(data);
            const count = list.filter(n => !n.is_read).length;
            const badge = document.getElementById("notifBadge");
            if (badge) {
                badge.textContent = count;
                badge.style.display = count > 0 ? "inline" : "none";
            }
        } catch(e) {}
    }

    setInterval(updateNotifBadge, 30000);
    updateNotifBadge();

    function loadPlaceholder(section) {
        const titles = {
            reports: 'Reports', settings: 'Settings'
        };
        document.getElementById('main-content').innerHTML = `
            <div class="header"><h1 class="header-title">${titles[section]||section}</h1></div>
            <div class="card" style="text-align:center;padding:80px;">
                <h2 style="color:var(--text2);font-weight:500;">This module is currently in development</h2>
                <p style="color:var(--text2);margin-top:8px;font-size:13px;">Coming in the next update.</p>
            </div>
        `;
    }

    function filterTable(searchId, tbodyId) {
        const q = document.getElementById(searchId).value.toLowerCase();
        document.querySelectorAll(`#${tbodyId} tr`).forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
    }

    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/api/auth/login-page/';
    }

    // Initial load
    loadSection('dashboard');
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/api/templates/sw.js");}</script>
</body>
</html>
