<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — AutoGarage Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#1a1a2e;--surface:#16213e;--border:#1f3460;--text:#e0e0e0;--text2:#8892b0;--accent:#0a84ff;--green:#22c55e;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:36px 28px;width:100%;max-width:380px}
h1{text-align:center;font-size:20px;font-weight:700;margin-bottom:4px;color:var(--text)}
.sub{text-align:center;color:var(--text2);font-size:11px;letter-spacing:1px;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.field input{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.field input:focus{border-color:var(--accent)}
.field .pw-wrap{position:relative}
.field .pw-wrap input{padding-right:38px}
.field .pw-wrap i{position:absolute;right:12px;top:12px;color:var(--text2);cursor:pointer}
.btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:0.2s}
.btn:hover{opacity:0.9}
.btn:disabled{opacity:0.5}
.msg{font-size:12px;padding:10px;border-radius:6px;margin-bottom:12px;display:none;text-align:center}
.msg.error{display:block;background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.msg.success{display:block;background:rgba(34,197,94,0.1);color:var(--green);border:1px solid rgba(34,197,94,0.2)}
.links{text-align:center;margin-top:14px;font-size:12px;color:var(--text2)}
.links a{color:var(--accent);text-decoration:none;font-weight:500}
</style>
</head>
<body>
<div class="card">
<h1>AutoGarage Pro</h1>
<div class="sub">SIGN IN</div>
<div id="msg" class="msg"></div>
<div class="field">
<label>Username</label>
<input type="text" id="username" placeholder="Enter username" autocomplete="username">
</div>
<div class="field">
<label>Password</label>
<div class="pw-wrap">
<input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
<i class="fas fa-eye" onclick="var p=document.getElementById('password');p.type=p.type==='password'?'text':'password';this.className=p.type==='password'?'fas fa-eye':'fas fa-eye-slash'"></i>
</div>
</div>
<button class="btn" id="btn" onclick="login()">Sign In</button>
<div id="dashboardLink" style="text-align:center;margin-top:12px;display:none"></div>
<div class="links">
<a href="/api/auth/register-page/">Create account</a> · <a href="/">Home</a>
</div>
</div>
<script>
var saved=localStorage.getItem('savedUsername');
if(saved)document.getElementById('username').value=saved;

function show(msg,type){
var el=document.getElementById('msg');
el.textContent=msg;
el.className='msg '+type;
}

async function login(){
var u=document.getElementById('username').value.trim();
var p=document.getElementById('password').value;
var btn=document.getElementById('btn');
if(!u)return show('Enter username','error');
if(!p)return show('Enter password','error');
btn.disabled=true;btn.textContent='Signing in...';show('','');
try{
var res=await fetch('/api/auth/login/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
var data=await res.json();
if(data.access){
localStorage.setItem('token',data.access);
localStorage.setItem('user',JSON.stringify(data));
localStorage.setItem('savedUsername',u);
show('Signed in successfully!','success');
btn.textContent='Done!';
document.getElementById('dashboardLink').innerHTML='<a href="/api/dashboard-page/" style="display:inline-block;background:var(--accent);color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;font-weight:600;margin-top:8px">Open Dashboard</a>';
document.getElementById('dashboardLink').style.display='block';
}else{
show(data.error||'Invalid credentials','error');
btn.disabled=false;btn.textContent='Sign In';
}
}catch(e){
show('Cannot connect. Check your internet.','error');
btn.disabled=false;btn.textContent='Sign In';
}
}
</script>
</body>
</html>
