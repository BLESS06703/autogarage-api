<!DOCTYPE html>
<html lang="en">
<head>
    <title>AutoGarage Pro - Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0D0D0D;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #1A1A1A;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #2A2A2A;
        }
        .brand {
            font-size: 22px;
            font-weight: 700;
            color: #FF6F00;
            margin-bottom: 4px;
            text-align: center;
        }
        .subtitle {
            color: #888;
            font-size: 12px;
            margin-bottom: 28px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 10px;
            background: #0A0A0A;
            border: 1px solid #333;
            border-radius: 8px;
            color: #E0E0E0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #FF6F00; }
        button {
            width: 100%;
            padding: 13px;
            background: #FF6F00;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }
        button:hover { background: #E65100; }
        .message {
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
        }
        .message-error {
            display: block;
            background: rgba(239,68,68,0.1);
            color: #EF4444;
            border: 1px solid rgba(239,68,68,0.2);
        }
        .message-success {
            display: block;
            background: rgba(34,197,94,0.1);
            color: #22C55E;
            border: 1px solid rgba(34,197,94,0.2);
        }
        .footer {
            color: #888;
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
        }
        .footer a {
            color: #3B82F6;
            text-decoration: none;
            font-weight: 500;
        }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">AutoGarage Pro</div>
        <div class="subtitle">WORKSHOP MANAGEMENT SYSTEM</div>
        <div id="message" class="message"></div>
        <input type="text" id="username" placeholder="Username" autocomplete="username">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <button onclick="login()">Sign In</button>
        <div class="footer">
            <a href="/api/auth/register-page/">Create an account</a>
        </div>
    </div>
    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            msg.className = 'message';
            msg.style.display = 'none';

            if (!username || !password) {
                msg.className = 'message message-error';
                msg.innerText = 'Please enter username and password';
                return;
            }

            try {
                const res = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if (data.access) {
                    msg.className = 'message message-success';
                    msg.innerText = 'Signed in successfully. Redirecting...';
                    localStorage.setItem('token', data.access);
                    setTimeout(() => { window.location.href = '/api/dashboard-page/'; }, 600);
                } else {
                    msg.className = 'message message-error';
                    msg.innerText = data.error || 'Invalid credentials';
                }
            } catch (e) {
                msg.className = 'message message-error';
                msg.innerText = 'Connection error. Please try again.';
            }
        }
    </script>
</body>
</html>
