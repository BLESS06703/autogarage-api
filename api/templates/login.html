<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — AutoGarage Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg:#0D0D0D; --surface:#1A1A1A; --border:#2A2A2A; --text:#E0E0E0; --text2:#888; --orange:#FF6F00; --green:#22C55E; --red:#EF4444; --blue:#3B82F6; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; display:flex; min-height:100vh; }
        .split { display:flex; width:100%; }
        .left { flex:1; background:linear-gradient(160deg,#1A1A1A 0%,#0A0A0A 100%); display:none; align-items:center; justify-content:center; padding:40px; }
        .left-content { text-align:center; max-width:380px; }
        .left-content .icon-circle { width:72px; height:72px; border-radius:20px; background:rgba(255,111,0,0.15); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:32px; color:var(--orange); }
        .left-content h2 { font-size:22px; margin-bottom:8px; }
        .left-content p { color:var(--text2); font-size:13px; line-height:1.6; }
        .right { flex:1; display:flex; align-items:center; justify-content:center; padding:30px; }
        .form-card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:44px 36px; width:100%; max-width:420px; }
        .brand { text-align:center; margin-bottom:28px; }
        .brand h1 { font-size:22px; color:var(--orange); font-weight:700; }
        .brand span { font-size:11px; color:var(--text2); letter-spacing:1.5px; display:block; margin-top:4px; }
        .field { margin-bottom:18px; position:relative; }
        .field label { display:block; font-size:11px; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; font-weight:500; }
        .field input { width:100%; padding:14px 16px; background:#0A0A0A; border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-size:14px; outline:none; transition:0.2s; }
        .field input:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(255,111,0,0.1); }
        .field input.error { border-color:var(--red); }
        .field .icon-left { display:none; }
        .field .icon-right { position:absolute; right:14px; top:38px; color:var(--text2); cursor:pointer; font-size:14px; }
        .field .icon-right:hover { color:var(--text); }
        .field .error-msg { font-size:10px; color:var(--red); margin-top:4px; display:none; }
        .field .error-msg.show { display:block; }
        .options { display:flex; justify-content:space-between; align-items:center; margin:8px 0 22px; font-size:12px; }
        .options label { display:flex; align-items:center; gap:6px; color:var(--text2); cursor:pointer; }
        .options input[type=checkbox] { accent-color:var(--orange); width:16px; height:16px; }
        .btn { width:100%; padding:15px; background:var(--orange); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; transition:0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
        .btn:hover { background:#E65100; }
        .btn:disabled { opacity:0.6; cursor:not-allowed; }
        .alert { font-size:12px; padding:12px 16px; border-radius:10px; margin-bottom:16px; display:none; align-items:center; gap:8px; }
        .alert-error { display:flex; background:rgba(239,68,68,0.1); color:var(--red); border:1px solid rgba(239,68,68,0.2); }
        .alert-success { display:flex; background:rgba(34,197,94,0.1); color:var(--green); border:1px solid rgba(34,197,94,0.2); }
        .footer-link { text-align:center; margin-top:20px; font-size:13px; color:var(--text2); }
        .footer-link a { color:var(--orange); text-decoration:none; font-weight:500; }
        .footer-link a:hover { text-decoration:underline; }
        @media (min-width:768px) { .left { display:flex; } }
    </style>
</head>
<body>
<div class="split">
    <div class="left">
        <div class="left-content">
            <div class="icon-circle"><i class="fas fa-wrench"></i></div>
            <h2>Welcome Back</h2>
            <p>Sign in to manage your workshop, track repairs, and grow your business.</p>
        </div>
    </div>
    <div class="right">
        <div class="form-card">
            <div class="brand">
                <h1>AutoGarage Pro</h1>
                <span>SIGN IN TO CONTINUE</span>
            </div>
            <div id="alert" class="alert"></div>
            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="field">
                    <label>Username</label>
                    <i class="fas fa-user icon-left"></i>
                    <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required minlength="2">
                    <div class="error-msg" id="usernameError"></div>
                </div>
                <div class="field">
                    <label>Password</label>
                    <i class="fas fa-lock icon-left"></i>
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required minlength="4">
                    <i class="fas fa-eye icon-right" id="togglePass" onclick="togglePassword()"></i>
                    <div class="error-msg" id="passwordError"></div>
                </div>
                <div class="options">
                    <label><input type="checkbox" id="rememberMe"> Remember me</label>
                </div>
                <button type="submit" class="btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
            </form>
            <div class="footer-link">Don't have an account? <a href="/api/auth/register-page/">Create one</a></div>
            <div class="footer-link" style="margin-top:8px;"><a href="/"><i class="fas fa-arrow-left"></i> Back to Home</a></div>
        </div>
    </div>
</div>
<script>
const API = '/api';

// Auto-fill saved username
(function(){
    var saved = localStorage.getItem('savedUsername');
    if (saved) { document.getElementById('username').value = saved; document.getElementById('rememberMe').checked = true; }
    
    // Check existing token
    var token = localStorage.getItem('token');
    if (token) {
        fetch(API + '/dashboard/', {headers:{'Authorization':'Bearer '+token}})
            .then(function(r){ if(r.ok) window.location.href='/api/dashboard-page/'; })
            .catch(function(){});
    }
})();

function togglePassword() {
    var input = document.getElementById('password');
    var icon = document.getElementById('togglePass');
    if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash icon-right'; }
    else { input.type = 'password'; icon.className = 'fas fa-eye icon-right'; }
}

function showAlert(msg, type) {
    var el = document.getElementById('alert');
    el.className = 'alert alert-' + type;
    el.innerHTML = '<i class="fas fa-' + (type==='error'?'exclamation-circle':'check-circle') + '"></i> ' + msg;
}

function showFieldError(fieldId, msg) {
    var el = document.getElementById(fieldId + 'Error');
    var input = document.getElementById(fieldId);
    el.textContent = msg;
    el.classList.add('show');
    input.classList.add('error');
}

function clearErrors() {
    document.getElementById('alert').className = 'alert';
    ['username','password'].forEach(function(id){
        document.getElementById(id+'Error').classList.remove('show');
        document.getElementById(id).classList.remove('error');
    });
}

async function handleLogin(e) {
    e.preventDefault();
    clearErrors();
    
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    var remember = document.getElementById('rememberMe').checked;
    var btn = document.getElementById('loginBtn');
    var valid = true;

    if (!username) { showFieldError('username','Username is required'); valid = false; }
    else if (username.length < 2) { showFieldError('username','Username is too short'); valid = false; }
    if (!password) { showFieldError('password','Password is required'); valid = false; }
    else if (password.length < 4) { showFieldError('password','Password is too short'); valid = false; }
    if (!valid) return false;

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

    var controller = new AbortController();
    var timeout = setTimeout(function(){ controller.abort(); }, 20000);

    try {
        var res = await fetch(API + '/auth/login/', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({username:username, password:password}),
            signal:controller.signal
        });
        clearTimeout(timeout);
        
        var data = await res.json();
        
        if (data.access) {
            localStorage.setItem('token', data.access);
            localStorage.setItem('user', JSON.stringify(data));
            if (remember) { localStorage.setItem('savedUsername', username); }
            else { localStorage.removeItem('savedUsername'); }
            showAlert('Login successful! Redirecting...', 'success');
            btn.innerHTML = '<i class="fas fa-check"></i> Signed In';
            setTimeout(function(){ window.location.href = '/api/dashboard-page/'; }, 400);
        } else {
            showAlert(data.error || data.detail || 'Invalid credentials. Please try again.', 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        }
    } catch(e) {
        clearTimeout(timeout);
        if (e.name === 'AbortError') {
            showAlert('Request timed out. Server may be waking up, please try again.', 'error');
        } else {
            showAlert('Network error. Please check your connection.', 'error');
        }
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
    }
    return false;
}
</script>
</body>
</html>
